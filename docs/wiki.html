 anyone could forge an update for the extension.\n\nThe id is fixed by the `key` field in the manifest, and that matters here: the node only\naccepts a WebSocket whose origin is that exact id. Without the committed key, every\nreinstall would produce a new id and break the link.\n\nThe badge turns amber when the local WebSocket is connected. If the manifest key was\nchanged, set `LARUCHE_EXTENSION_ID` to the resulting extension id or restore the\ncommitted public key.\n\n## What remains visible\n\n- Agent tabs are grouped in a yellow LaRuche tab group.\n- The controlled page has an amber frame and status panel.\n- Clicked or filled elements flash briefly.\n- Chrome keeps its own debugging banner visible.\n- The popup switch disconnects control immediately.\n\nThe page panel keeps its position, size, narration, history and unsent draft across\nnavigations. After 40 seconds without a command, the extension detaches the debugger\nand returns a borrowed tab to its previous group.\n\n## Capture and showcase recording\n\nThe popup can record the active tab, a selected window or a screen. Recording continues\nthrough navigation in an offscreen document and stops when the browser session closes,\nafter 40 seconds without a command, or when the user clicks stop.\n\nCurrent Chrome versions save MP4 when the encoder is available and fall back to WebM.\nTab capture starts only after a click in the popup. Window and screen capture always use\nChrome's own source picker.\n\n## Memory capture\n\nThe popup can save the current page or a short note into LaRuche's cognitive memory.\nThis is an explicit user action. The extension does not scrape tabs in the background.\n\n## Transport\n\nThe extension connects only to `127.0.0.1` on the configured node port and uses\n`/ws/navigateur`. The node checks the extension id before accepting the bridge.\n\nThe narrow extension protocol exposes `navigate`, `eval`, `screenshot`, `glow`, `tap`,\n`cdp`, `tab`, `tabs`, `open_tab`, `select`, `close` and `ping`. Higher-level operations\nsuch as `read`, `find`, refs, overlays and form handling live in the node and are shared\nwith launch and attach modes.\n\n## Security boundary\n\nThe extension requests `debugger`, tab, capture and download permissions. This is a\npowerful local bridge. No analytics or third-party service is used, and cookie values\nare not copied out of Chrome.\n\nThe remaining risk is local port replacement. The extension trusts the process\nlistening on its configured port. If LaRuche is stopped and another local process takes\nthat port, that process could receive the bridge. Disable browser control when the node\nis not running.\n\nThe implementation is documented in `extension-chrome/README.md`. Node-side transport\nlives in `laruche-essaim/src/pont_navigateur.rs` and\n`laruche-node/src/ws_navigateur.rs`.\n","Secrets":"# Secrets\n\nThe secrets vault exists for one reason: your API keys, tokens, and passwords should\nnever enter a model's context. Not the local model's, not a cloud model's, not the\nsession file's. LaRuche enforces this in both directions.\n\n## Storing a secret\n\n**Settings > Secrets**: give it a name (`TAVILY_KEY`, `HOMELAB_SSH_PASS`), paste the\nvalue once. Values are encrypted at rest and never displayed again.\n\n## Using a secret: `@@NAME`\n\nReference a secret by name anywhere: in chat, in a cron payload, in a watcher action,\nin a tool argument. Autocomplete for `@@` works across the UI.\n\n> \"Call the staging API with the header `Authorization: Bearer @@STAGING_TOKEN` and\n> tell me the status.\"\n\nThe model sees the literal text `@@STAGING_TOKEN` and passes it along in its tool call.\nSubstitution happens at execution time, inside the tool runner, after the model has\nalready committed its arguments. The value exists only in the actual HTTP request or\nshell command.\n\n## The way back is guarded too\n\nSubstitution alone is not enough: a tool's output can echo the secret (a debug page\nprinting headers, `env` in a shell, an error message quoting the request). LaRuche\nmasks tool outputs before they return to the loop: any exact occurrence of a stored\nsecret value becomes `[SECRET:NAME]`.\n\nSo even in the worst case, the model's context and the session file contain the\nplaceholder, never the value.\n\n## What this enables\n\n- Give a **local** model the ability to use your paid cloud APIs without ever holding\n  the keys.\n- Let the agent run authenticated shell commands while keeping credentials out of chat\n  history.\n- Share a screen or a session export without scrubbing it first.\n\n## Limits worth knowing\n\nMasking matches exact values. A tool that re-encodes a secret (base64, URL-encoding)\nbefore printing it would slip past the filter. Treat the vault as a strong seatbelt,\nnot diplomatic immunity: prefer scoped, revocable tokens where the service offers them.\n","MCP":"# MCP\n\nLaRuche sits on both sides of the Model Context Protocol: it consumes external MCP\nservers as extra tools, and it exposes itself as an MCP server so other agents can use\nthe hive.\n\n## LaRuche as an MCP client\n\nAdd servers in **Settings > MCP**. Their tools join the tool registry and become\navailable to the agent alongside the built-ins, subject to the same approval gates and\nthe same secrets masking on outputs.\n\nDynamic tool selection applies too: MCP tools are matched against the conversation's\nintent like any other tool, so connecting a large server does not flood every context.\n\n## LaRuche as an MCP server\n\nThe node exposes an MCP endpoint at `POST /mcp`. Any MCP-capable client (Claude Code,\nan IDE, another agent framework) can connect and use the hive's capabilities:\n\n- query the cognitive memory,\n- trigger agentic runs,\n- reach the tools you choose to expose.\n\nThis turns LaRuche into infrastructure: a persistent memory and automation node that\nyour other AI tooling talks to.\n\n## A concrete pattern\n\nRun LaRuche 24/7 on a homelab box. Connect your laptop's coding agent to it over MCP.\nThe coding agent now has a durable, searchable memory that survives its own sessions,\nplus scheduled jobs and watchers on a machine that never sleeps, without giving up its\nown workflow.\n","Desktop-App":"# Desktop App\n\nLaRuche ships as a desktop application, a server node and a terminal client. They share\nthe same Rust workspace and the same responsive web interface.\n\n## The three executables\n\n| Executable | Use |\n|---|---|\n| `laruche` | Normal desktop entry point. Opens the LaRuche window and starts a local node when needed. |\n| `laruche-node` | Headless server, web UI, API, channels, MCP and background jobs. |\n| `laruche-cli` | Terminal TUI for operating a node. |\n\nThe desktop application does not contain a second frontend. It displays the exact SPA\nserved by the node, so the browser, desktop and phone layouts do not drift apart.\n\n## Full application\n\nWindows and Linux releases include full installers. The node travels with the desktop\napplication. On launch, the application checks for a node already answering on\n`127.0.0.1:8419`. If none exists, it starts the bundled node, waits for a real HTTP\nresponse and then opens the window. It only stops a node that it started itself.\n\nPortable archives include all three executables. macOS is distributed this way because\nthe project does not currently publish a signed DMG.\n\n## Lightweight LAN client\n\nThe client variant contains the desktop shell without a node. It listens for Miel mDNS\nannouncements and connects to a hive already running on the local network. If one hive\nis found, it opens directly. If several are found, a local selection page is shown.\n\nThe remote node must be started with `LARUCHE_BIND_LAN=1`. Discovery and reachability\nare separate: a hive can announce itself over mDNS while still listening only on\nloopback. `decouvrir_ruches.bat` reports both states on Windows.\n\n## Selecting a target\n\n`LARUCHE_URL` gives the desktop application an explicit target:\n\n```text\nLARUCHE_URL=http://192.168.1.20:8419\n```\n\n`LARUCHE_SANS_NOEUD=1` forces client-only mode and prevents the application from finding\nor starting a local node.\n\n## Data directory\n\nEvery launcher resolves to the same hive home unless `LARUCHE_DATA_DIR` says otherwise:\n\n| Platform | Default |\n|---|---|\n| Windows | `%APPDATA%\\LaRuche` |\n| macOS | `~/Library/Application Support/LaRuche` |\n| Linux | `$XDG_DATA_HOME/laruche`, normally `~/.local/share/laruche` |\n\nThis directory contains memory, sessions, skills, plugins, secrets, configuration and\njournals. A source checkout that already contains hive state remains a valid home for\nbackward compatibility.\n","Installation":"# Installation\n\nThe normal entry point is the desktop application. The server node can also run alone\non a workstation or homelab machine. Neither path needs Node.js or a separate frontend\nbuild. Optional voice services use Python.\n\n## Release builds\n\nDownload the latest build from the project releases page.\n\n- Windows: full NSIS or MSI installer, plus a lightweight client installer.\n- Linux: full AppImage or deb package, plus client-only variants.\n- macOS: portable archive. A signed DMG is not currently published.\n- Every platform: a portable archive containing `laruche`, `laruche-node` and\n  `laruche-cli`.\n\nUse `laruche` for the desktop application. See [Desktop App](Desktop-App) for how it\nstarts a bundled node or connects to another hive.\n\n## Build prerequisites\n\n- [Rust](https://rustup.rs/) stable\n- `git`, for the source checkout and memory snapshots\n- A model server such as llama.cpp, Ollama, LM Studio or vLLM, or a supported API\n  provider\n- Optional: `ollama pull nomic-embed-text` for semantic memory recall\n\nLinux desktop builds also need the WebKitGTK, GTK, X11 and PipeWire development\npackages listed in `.github/workflows/ci.yml`.\n\n## Desktop application from source\n\n```bash\ngit clone https://github.com/infinition/LaRuche\ncd LaRuche/laruche\ncargo build --release -p laruche-node -p laruche-bureau\ncargo run --release -p laruche-bureau\n```\n\nOn Windows, `lancer_bureau.bat` performs these steps and opens the application.\n`lancer_bureau_client.bat` runs the client-only mode.\n\n## Server only\n\n```bash\ngit clone https://github.com/infinition/LaRuche\ncd LaRuche/laruche\ncargo run --release -p laruche-node\n```\n\nThen open `http://localhost:8419`. The dashboard is compiled into the node and works\nwithout a CDN or frontend build step.\n\n`lancer_butinage.bat` remains available on Windows for the browser-based server path.\n\n## Docker\n\n```bash\ncd LaRuche/laruche\ndocker compose up\n```\n\nThe compose file builds the node in a multi-stage image and exposes port 8419. Desktop\ncontrol is not the intended Docker use case.\n\n## Data on disk\n\nInstalled builds use one hive home:\n\n| Platform | Default location |\n|---|---|\n| Windows | `%APPDATA%\\LaRuche` |\n| macOS | `~/Library/Application Support/LaRuche` |\n| Linux | `$XDG_DATA_HOME/laruche`, normally `~/.local/share/laruche` |\n\n`LARUCHE_DATA_DIR` overrides the location. A source directory that already contains\nhive state remains in use for compatibility.\n\n| File or folder | Content |\n|---|---|\n| `memoire.db` | Cognitive memory in SQLite |\n| `memoire-okf/` | Optional markdown snapshots in a dedicated git repository |\n| `sessions/` | Conversation history |\n| `skills/` | User and bundled markdown skills |\n| `plugins/` | Runtime tool plugins |\n| configuration and journals | Providers, channels, secrets, activity and supervision state |\n\nBack up the hive home to preserve the full installation state.\n\n## Updating\n\nInstalled applications can be replaced by a newer release. From source:\n\n```bash\ngit pull\ncargo build --release -p laruche-node -p laruche-bureau\n```\n\nDatabase migrations run automatically at startup.\n\n## Next step\n\nContinue with the [Quick Start](Quick-Start).\n","Local-Models":"# Local Models\n\nLaRuche is designed local-first, and specifically for the reality of local models: they\nare slower, they misformat tool calls, and they have small contexts. The engine is built\naround those constraints instead of pretending they do not exist.\n\n## Supported providers\n\n| Provider | Notes |\n|---|---|\n| llama.cpp (server mode) | The reference local setup. OpenAI-compatible endpoint. |\n| Ollama | Works out of the box, also used for embeddings. |\n| Any OpenAI-compatible API | LM Studio, vLLM, TGI, OpenRouter, DeepSeek, etc. |\n| Anthropic API | Native support for the Anthropic message format and tool calling. |\n\nProviders are configured in **Settings > Providers**, live, no restart. You can define\nseveral and assign a different model per channel: a big cloud model for deep missions,\na small local one for Telegram quick replies, for example.\n\n## Tool calling with imperfect models\n\nThe engine uses native tool calling when the provider supports it, and falls back to\ntolerant text parsing when the model emits tool calls as text. Every tool call is\nvalidated client-side against the tool's JSON Schema before execution; invalid arguments\nare returned to the model as a corrective message it can act on, instead of crashing the\nrun. See [Butinage Engine](Butinage-Engine).\n\nIn practice this means 7B-class models can drive real multi-step tool work.\n\n## Embeddings\n\nSemantic memory recall needs an embedding model:\n\n```bash\nollama pull nomic-embed-text\n```\n\nConfiguration:\n\n| Variable | Default |\n|---|---|\n| `LARUCHE_EMBED_URL` | the local Ollama endpoint |\n| `LARUCHE_EMBED_MODEL` | `nomic-embed-text` |\n\nWithout embeddings, memory recall falls back to full-text search only. Everything still\nworks; recall is just less clever about synonyms and phrasing.\n\n## Context size\n\nSet the context window per provider in Settings so the gauge (the engine's token\naccountant) can budget correctly. When a run approaches the limit, the engine performs\nan escale: an LLM-driven compaction that summarizes the conversation so far and\ncontinues with the summary. Long missions survive small contexts this way.\n\n## Practical picks\n\n- **Small and fast (8 to 12 GB VRAM)**: a 7B/8B instruct model in llama.cpp. Good for\n  chat, Telegram, watchers with `llm_check` leaves.\n- **Balanced (16 to 24 GB)**: a 12B to 32B model. Comfortable for real agentic missions.\n- **Hybrid**: local model as default plus a cloud key for the heavy channels. The\n  secrets vault keeps the key out of the model's sight ([Secrets](Secrets)).\n","Quick-Start":"# Quick Start\n\nYou have opened the desktop application or started the node ([Installation](Installation)).\nThe same UI is available in the application window and at http://localhost:8419.\n\n## First boot\n\nThe onboarding checklist walks you through the essentials:\n\n1. **Model provider**: point LaRuche at your llama.cpp server, Ollama, or a cloud\n   endpoint. The check probes the endpoint for real; a green checkmark means a model\n   actually answered.\n2. **Embeddings**: optional, enables semantic memory recall. `nomic-embed-text` via\n   Ollama is the default expectation.\n3. **Voice**: optional, can be set up later from Settings.\n\nEverything in onboarding can be changed later, live, in **Settings**. Nothing requires\na restart.\n\n## First conversation\n\nJust talk. The agent has its tools from the first message: web research, file and git\naccess, shell and Python behind approval gates, memory, scheduling, computer control,\nbrowser control and images.\n\nSome things to try:\n\n> \"What can you do?\"\n\n> \"Search the web for the latest release of X and summarize the changelog.\"\n\n> \"Remember that my home server is at 192.168.1.40 and runs the staging site.\"\n\n> \"Every morning at 9, check these three pages and tell me what changed.\"\n\n> \"Watch the folder `deploys/` and tell me when a file named release.zip appears.\"\n\n> \"Look at this screenshot and tell me which setting is wrong.\"\n\nThe last two create a cron and a watcher through the agent's own tools. You will see\nthe approval popup for anything sensitive; nothing destructive happens without you.\n\n## The dashboard\n\n- **Chat**: sessions persist, agent runs survive a page refresh, live steering lets you\n  redirect a run in progress. Images can be attached, pasted or dropped.\n- **Memory**: browse and edit the cognitive map directly, including the `system.*`\n  entries that are the agent's hot-editable system prompts.\n- **Automation**: crons, watchers, missions, kanban, all in one hub.\n- **Capabilities**: the live tool registry, skills, plugins and MCP servers.\n- **Table ronde**: a specialist debate can be opened from Chat when one answer is not\n  enough.\n- **Settings**: providers and per-channel models, context sizes, the curator, LaReine,\n  secrets, MCP servers, channels, voice. All live.\n\n## Where to go next\n\n- Connect [Telegram](Telegram) so the hive reaches your phone.\n- Read about the [Cognitive Memory](Cognitive-Memory) to understand what the agent\n  remembers and why.\n- Turn on [LaReine](LaReine) to get supervised, reviewed answers.\n- Build your first real [watcher](Watchers).\n","Table-Ronde":"# Table Ronde\n\nThe table ronde is LaRuche's structured multi-agent deliberation mode. It is available\nnext to normal chat and is meant for questions where competing analyses are more useful\nthan one fast answer.\n\nIts main output is not a consensus score. It is a final answer together with the\npositions that still disagree, who holds them and why.\n\n## Four mission types\n\nThe mission determines the deliverable and the exact tool whitelist available to every\nspecialist.\n\n| Mission | Deliverable | Access |\n|---|---|---|\n| Answer | An answer and its disagreements | Web and cognitive-memory reading |\n| Code | A plan, code and written files | Research, local file reading and writing, git status and diff |\n| Research | A report and its sources | Deep web research, images and local file reading |\n| Experiment | A reproducible result from executed code | Research, file writing, Python, scripts and shell commands |\n\nThe whitelist grows by level:\n\n- Every mission: `web_search`, `web_fetch`, `read_extract`, `memory_search`,\n  `memory_read_node`, `memory_tree`, `math_eval`.\n- Research, Code and Experiment: `web_deep_search`, `image_search`, `file_read`,\n  `file_list`, `file_search`.\n- Code and Experiment: `file_write`, `file_edit`, `git_status`, `git_diff`.\n- Experiment only: `execute_code`, `run_script`, `shell_exec`.\n\nNo mission opens destructive memory, plugin, skill, watcher or scheduler tools. It also\ncannot message another channel, spawn more agents or send mesh messages. A specialist\ncan make at most three tool calls per intervention. Each tool result is limited to\n4,000 characters before it returns to the specialist so one large file cannot consume\nthe context of every later round.\n\nCode and Experiment can change the machine. In the current interface, selecting one of\nthose missions and sending the request starts the deliberation without a second\nmission-level confirmation dialog. Check the selected mission before submitting.\n\n## The specialist pool\n\nLaRuche ships these reasoning strategies:\n\n| Specialist | Role |\n|---|---|\n| Orchestrator | Represents team selection and cost control. It does not debate. |\n| Scientist | Checks claims, evidence, uncertainty and testability. |\n| Systems engineer | Tests scale, latency, cost, failure modes and shared state. |\n| Attacker | Looks for concrete abuse paths and invalid trust assumptions. |\n| Contrarian | Attacks positions and states what evidence would change its mind. |\n| Visionary | Explores alternatives beyond current constraints and marks feasibility. |\n| Optimizer | Removes cost, dependencies and complexity while naming what is lost. |\n| Arbiter | Compares, decides and writes the final answer without adding new ideas. |\n\n**Manage the team** can hire or reserve specialists, change their name, avatar, role,\nreasoning strategy and provider profile, and add custom specialists. Changes are stored\nin `specialistes.json` inside the hive data directory. A custom entry with the same id\nreplaces the shipped definition and can later be removed to return to the built-in\nversion.\n\nThe provider profile is important. Several strategies running on the same base model\nstill share that model's blind spots. Assigning different provider profiles is what\ncreates real model diversity. If a selected profile no longer exists, the specialist\nfalls back to the active profile so the debate can continue.\n\n### Current team selection behavior\n\nThe current web flow sends every hired contributor and contrarian to the table. The\norchestrator is displayed as a structural role but is not called to choose a smaller\nteam dynamically. If no eligible specialist is hired, the mission's default team is\nused as a fallback. The arbiter is always outside the participant count and speaks only\nfor the final synthesis.\n\n## The constitution\n\nEvery specialist receives the same constitution before its own strategy. It requires:\n\n1. no invented facts;\n2. explicit assumptions;\n3. a distinction between fact, hypothesis and opinion;\n4. a declared confidence level;\n5. named unknowns;\n6. an explanation whenever a position changes;\n7. criticism of arguments, never participants;\n8. truth before consensus.\n\nThe effective constitution can be replaced through the cognitive-memory document\n`system.constitution`. An empty replacement falls back to the built-in text.\n\nEach intervention uses a structured header followed by free text:\n\n- agreement: approve, reserve or oppose;\n- confidence from 0 to 100;\n- what changed the specialist's position;\n- what evidence would refute it;\n- assumptions and unknowns;\n- the actual position and reasoning.\n\nAgreement and confidence are self-reported by the specialist. LaRuche displays them; it\ndoes not infer them from the prose.\n\n## How a deliberation runs\n\n1. Every participant answers independently. They cannot see the other first-round\n   answers.\n2. Participants read the latest position from each other specialist and revise their\n   own position in parallel.\n3. Once the debate is established, the contrarian attacks the current positions.\n4. Contributors answer the objections directed at them.\n5. The arbiter lists remaining disagreements first, then agreements, then writes the\n   final synthesis using only material already present in the debate.\n\nParticipants in the same stage run in parallel. Later stages see only the latest\nposition from each specialist, not every earlier draft, which keeps the context bounded.\n\nThe normal web request asks for at most three debate rounds. The engine has a hard cap\nof four rounds, eight participants and 30,000 accounted tokens for the whole deliberation.\nIt can stop earlier when positions stop moving. If the token budget is reached, it\nstill reserves a final call for the arbiter so the work remains usable.\n\nA specialist that fails to answer does not discard the other work. If no one answers a\nstage, the run stops instead of retrying indefinitely. A separate 32-stage guard\nprotects against control-flow regressions.\n\n## What the interface shows\n\nThe table receives an NDJSON stream while the run is active. It shows:\n\n- the current stage and the specialists working now;\n- interventions as they arrive;\n- each specialist's latest agreement, confidence and change-of-position marker;\n- the arbiter's final answer;\n- remaining dissidents before the complete transcript;\n- token use, round count and the stop reason;\n- a transcript grouped by round, including refutation conditions.\n\nThere is deliberately no consensus percentage. Agreement between models measures\nconformity, not correctness, especially when they share the same base model.\n\n## History and storage\n\nCompleted deliberations are stored as individual JSON files in `deliberations/` inside\nthe hive data directory. Each record contains the question, mission, participants,\nrounds, token count, interventions, final agreement distribution and dissidents.\n\nThe Table ronde sidebar lists previous runs and reopens their full transcript. The API\nalso supports deleting a saved run. Deliberations are kept out of cognitive memory on\npurpose: a debate is an audit trace containing several competing claims, not a fact the\nagent has learned.\n\n## When to use it\n\nUse the table ronde for architecture choices, security reviews, research with disputed\nevidence, implementation plans and experiments where several failure modes matter.\n\nNormal chat is usually better for a direct factual answer, a small edit or work where\none agent can verify the result cheaply. Every additional specialist adds one model\ncall per active stage, and later stages carry the other positions in their context.\n","Watchers":"# Watchers\n\nA watcher is a standing condition. It observes something, decides whether that means\nanything, and reacts. The design goal is blunt: **watching must cost nothing while\nnothing is happening.**\n\nThat single constraint explains every decision below. A cron wakes a model on every\ntick to look at something that did not change. A watcher evaluates a compiled rule tree\ninstead, and never involves a model unless the tree explicitly asks for one.\n\n## Three questions\n\nEvery watcher answers three separate questions, and they are worth keeping apart.\n\n| Question | Field | Answers |\n|---|---|---|\n| What do I observe? | `watcher_type` + `target` | a file, a page, a log, a command |\n| Does it mean anything? | `regles` | a rule tree, evaluated for free |\n| What do I do about it? | `action` | reason, notify, or act |\n\nYou describe it in plain language:\n\n> \"If it is Tuesday or Thursday and my local site has been down for 10 minutes, send me\n> a Telegram message every 20 minutes until it comes back.\"\n\nThe agent compiles that once, through its `watcher-design` skill, into a deterministic\npredicate tree. At runtime the scheduler evaluates the tree. No model is involved.\n\n## What you can observe\n\n| `watcher_type` | Observes | Rules it can satisfy |\n|---|---|---|\n| `file` | the lifecycle AND the presence of a path. Carries NO text | `apparu`, `supprime`, `modifie`, `existe`, `absent`, `taille_depasse_mo` |\n| `log` | new lines appended to a growing file | `contient`, `contenu_change`, `nouvelle_ligne` |\n| `url` | reachability and page text | `est_down`, `down_depuis_min`, `retour_en_ligne`, `status_http`, `contient`, `contenu_change` |\n| `command` | the output and exit code of a shell command | `contient`, `contenu_change`, `nouvelle_ligne`, `code_retour` |\n\nThe `command` type is what makes everything else reachable. A lamp, a service, a\ncontainer, free disk space: none of those is a file or a page, and all of them answer\nto a CLI. The command is re-run at every poll, through PowerShell on Windows and `sh`\non macOS and Linux.\n\nA rule that does not match its type is false at every poll. `contient` on a `file`\nwatcher reads an observation that carries no text, so the watcher reports itself active\nand never fires. Creation refuses that combination rather than letting it ship.\n\n## Rules\n\nOne JSON object tagged by `op`, nesting through `regles` arrays. Combinators are `et`,\n`ou`, `non`.\n\n| Rule | True when |\n|---|---|\n| `jour_semaine` | today is in the given set |\n| `heure_entre` | local time is inside a window, end excluded |\n| `plage_date` | the date is inside a range |\n| `apparu` / `supprime` / `modifie` | the watched file appeared, was deleted, changed |\n| `existe` / `absent` | the watched path is there right now, or is not |\n| `contenu_change` | the observed content differs from last time |\n| `nouvelle_ligne` | a line appeared that was NOT in the previous poll |\n| `contient` | fresh content contains a pattern |\n| `taille_depasse_mo` | the file passed a size |\n| `est_down` / `down_depuis_min` / `retour_en_ligne` | a target is down, has been for N minutes, just came back |\n| `status_http` | the last status is in the list |\n| `code_retour` | the command exited with one of those codes |\n| `watcher` | ANOTHER watcher currently holds a true verdict |\n| `llm_check` | a model answers yes |\n\n`llm_check` is the only leaf that costs a model call, and it runs only after the\ndeterministic part already passed. A watcher guarded by a weekday costs zero tokens six\ndays a week, by construction.\n\n`nouvelle_ligne` deserves a note. `contenu_change` fires when the output differs, which\nincludes something LEAVING. For anything list shaped, a device list, running containers,\nchanged files, what you want is the arrival. The first poll only records a baseline and\nannounces nothing, otherwise everything already present is reported as new the moment\nyou create the watcher.\n\nThe down and up leaves carry memory between polls: `down_depuis_min` tracks how long a\ntarget has been failing, `retour_en_ligne` fires exactly once on recovery. With a\ncooldown, \"nag me every 20 minutes while it is down, tell me once when it is back\" is a\nsingle watcher.\n\n## What it does when it fires\n\nThree behaviours, and the default is the expensive one. Choose deliberately.\n\n| `action` | Cost | Use when |\n|---|---|---|\n| `{\"type\":\"agent\"}` (default) | a full model turn | the answer has to be worked out |\n| `{\"type\":\"notifier\"}` | nothing | the job is just to tell you. The observation IS the message |\n| `{\"type\":\"commande\",\"commande\":\"...\"}` | nothing | the watcher must ACT |\n| `{\"type\":\"aucune\"}` | nothing | it is a pure sensor, feeding a correlation |\n\n`notifier` is right far more often than the default. \"Tell me when the file is gone\"\nneeds no thinking: the sentence is known in advance, and a model asked to write it can\nalso get it wrong.\n\n`commande` is what turns monitoring into automation.\n\n### Transitions or states\n\n`apparu`, `supprime`, `modifie` are TRANSITIONS: true only on the poll where the thing\nhappened, false again immediately after. `existe` and `absent` are STATES: true for as\nlong as the situation lasts.\n\nThe distinction decides what you can combine. \"test.txt is present AND the light is on\"\nneeds a state on the file side, because a transition is false again at the very next\npoll and the two conditions would essentially never be true together.\n\n`absent` is also the one that catches what did NOT happen. Combined with `heure_entre`,\n\"no backup file this morning\" becomes a rule, where no transition can express it:\nnothing happened, so there was nothing to observe.\n\n## Correlation\n\nA watcher publishes its verdict, so another one can read it. This is the difference\nbetween alerting and diagnosing: one signal rarely means anything, two together do.\n\n```json\n{\"op\":\"et\",\"regles\":[\n  {\"op\":\"watcher\",\"nom\":\"site-down\",\"depuis_min\":5},\n  {\"op\":\"watcher\",\"nom\":\"hote-repond\"}]}\n```\n\nThe site has been down for five minutes and the host still answers ping. That is the\napplication, not the network. Alerting on the first leaf alone wakes someone for a cut\ncable.\n\nVerdicts are read from a snapshot taken before each round, never live, so the result\nnever depends on the order watchers happen to be polled in. The cost is one tick of\nlatency on a correlation, which beats an alert that fires differently between two runs.\n\nA watcher referenced but deleted reads as false, never as an error. A correlation whose\npeer is gone degrades quietly instead of breaking an otherwise valid tree forever.\n\nGive the upstream watchers `{\"type\":\"aucune\"}`. They exist to publish a verdict, and\nwithout it each of them also alerts on its own: \"the site is down\" and \"the host\nanswers\" would both wake you alongside the single conclusion you actually asked for.\n\nThe Watchers page draws the dependency graph whenever at least one correlation exists:\nsources on the left, conclusions on the right, a green border on a verdict currently\ntrue.\n\n## Use cases\n\n**A file lands on the desktop**\n\n```json\n{\"watcher_type\":\"file\",\"target\":\"C:\\\\Users\\\\me\\\\Desktop\\\\rapport.pdf\",\n \"regles\":{\"op\":\"apparu\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\n**An error in a log, but not at night**\n\n```json\n{\"watcher_type\":\"log\",\"target\":\"/var/log/app.log\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"contient\",\"motif\":\"ERROR\"},\n   {\"op\":\"heure_entre\",\"de\":\"08:00\",\"a\":\"23:00\"}]}}\n```\n\n**Someone arrives on the home network**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"arp -a\",\n \"regles\":{\"op\":\"nouvelle_ligne\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nFires on an arrival, stays silent on a departure. `arp -a` behaves the same on Windows,\nmacOS and Linux. A full sweep such as `nmap -sn 192.168.1.0/24` is more reliable,\nbecause a sleeping device drops out of the ARP table on its own. Note that recent phones\nrandomise their MAC address per network, so detecting that someone arrived is easy,\nidentifying who is much harder.\n\n**A light left on after midnight, turned off automatically**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"openhue get light \\\"Bureau\\\"\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"contient\",\"motif\":\"[on]\"},\n   {\"op\":\"heure_entre\",\"de\":\"00:30\",\"a\":\"06:00\"}]},\n \"action\":{\"type\":\"commande\",\"commande\":\"openhue set light \\\"Bureau\\\" --off\"}}\n```\n\n**Disk filling up**\n\n```json\n{\"watcher_type\":\"command\",\n \"target\":\"df -h / | tail -1 | awk '{print $5}'\",\n \"regles\":{\"op\":\"contient\",\"motif\":\"9\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nOn Windows, the same idea with the command that fits:\n`Get-PSDrive C | Select-Object -ExpandProperty Free`.\n\n**A container that stopped**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"docker ps --filter name=api --format '{{.Status}}'\",\n \"regles\":{\"op\":\"non\",\"regle\":{\"op\":\"contient\",\"motif\":\"Up\"}},\n \"action\":{\"type\":\"commande\",\"commande\":\"docker start api\"}}\n```\n\n**A light on AND a file present**\n\nTwo watchers. The sensor publishes, the alert correlates.\n\n```json\n{\"name\":\"lumiere-bureau\",\"watcher_type\":\"command\",\n \"target\":\"openhue get light \\\"Bureau\\\"\",\n \"regles\":{\"op\":\"contient\",\"motif\":\"[on]\"},\n \"action\":{\"type\":\"aucune\"}}\n```\n\n```json\n{\"name\":\"alerte-bureau\",\"watcher_type\":\"file\",\n \"target\":\"C:\\Users\\me\\Desktop\\test.txt\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"existe\"},\n   {\"op\":\"watcher\",\"nom\":\"lumiere-bureau\"}]},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nNote `existe` rather than `apparu`: the file has to be a standing condition, not an\nevent, or the two conditions would essentially never be true on the same poll.\n\n**Diagnosing rather than alerting**\n\nThree watchers. `site-down` on the URL, `hote-repond` on a ping command, and a third\ncorrelating both, which is the only one that notifies you. You get \"the application is\nbroken\" instead of two contradictory alarms at three in the morning.\n\n**Something that did NOT happen**\n\nThe most useful watcher in operations is often the one that detects an absence: the\nnightly backup that wrote no file, the sensor that stopped reporting. Watch the target\nfolder and combine `heure_entre` on the morning after with the absence of a fresh file.\n\n## Guardrails\n\nLearned the hard way, enforced server side.\n\n- **Targets are validated.** A file target must be an absolute path, a URL must be well\n  formed. A relative path resolves against the server working directory, not yours, so\n  it would watch nothing forever while reporting itself active.\n- **Duplicates are refused.** Same type, same target, still active: rejected, so a\n  confused model cannot pile up six copies.\n- **Destructive commands are refused.** A watcher runs unattended, every minute,\n  forever. What is merely risky by hand is a standing hazard here, and the same refusal\n  list covers observed commands and action commands.\n- **Correlation cycles are refused at creation**, with the path that closes the loop.\n  A diamond is legitimate and stays allowed: two watchers can share a source.\n- **Intervals have a floor**, so a typo cannot hammer your own services.\n- **A failing target backs off.** The interval doubles per consecutive failure, capped\n  at one hour, and a single success clears it. A site unreachable for three days used to\n  be probed every minute forever.\n\n## Cost\n\nPolling is parallel, so one slow URL no longer holds every other watcher for the length\nof its timeout. A rule tree with no `llm_check`, and an action of `notifier` or\n`commande`, costs zero tokens whatever its complexity and however often it fires.\n\n## The UI\n\nEach watcher card renders the compiled rule tree as a pipeline: condition bubbles,\nand/or branches, the action at the end. Collapsed, a card is a one line summary.\nExpanded, every value is editable in place. What you see is exactly what runs.\n","Architecture":"# Architecture\n\nLaRuche separates the desktop shell, the server node and the terminal client. The node\nis the center of the system: its API, embedded SPA, channel bots, MCP server and\nbackground jobs run in one Rust process. Optional voice services and browser extensions\nconnect to it over local interfaces.\n\n## Rust workspace\n\nThe Cargo workspace contains 17 packages:\n\n| Package | Role |\n|---|---|\n| `laruche-bureau` | Tauri desktop application, bundled-node startup and LAN discovery |\n| `laruche-node` | axum server, API routes, UI, channel bots, MCP and background jobs |\n| `laruche-client` | Shared node client library |\n| `laruche-cli` | Terminal TUI |\n| `laruche-dashboard` | Vanilla JavaScript SPA embedded in the node |\n| `laruche-essaim` | Providers, tools, prompts, sessions, curator, deliberation and LaReine |\n| `laruche-butinage` | ReAct loop, compass, gauge, sentinel, compaction handoff and scouts |\n| `laruche-memoire` | SQLite, FTS5, embeddings, ranking and OKF import/export |\n| `laruche-watchers` | Watcher store and compiled predicate DSL |\n| `miel-protocol` | mDNS discovery, manifests and mesh messages |\n| `laruche-skills` | Skill parsing, validation and storage |\n| `laruche-kanban` | Task board used by missions and automation |\n| `laruche-events` | Shared event types |\n| `laruche-permissions` | Tool approval policy |\n| `laruche-compaction` | Context compaction primitives |\n| `laruche-evals` | End-to-end evaluation runner |\n| `laruche-icones` | Release icon generator, outside default builds |\n\nThe optional `laruche-voix` Python package provides STT and TTS services. The Chrome\nextension lives in `extension-chrome/`; the VS Code extension lives in\n`laruche/laruche-vscode/`.\n\n## Design rules\n\n- **One authoritative interface.** The desktop window and browser both display the SPA\n  served by the node. There is no second frontend to keep synchronized.\n- **A testable engine core.** `laruche-butinage` keeps model-independent loop behavior\n  separate from providers and IO. The eval runner then tests the assembled system.\n- **One hive home.** Memory, sessions, skills, plugins, secrets, settings and journals\n  resolve to one data directory regardless of the launcher.\n- **Live configuration.** Providers, models, context limits, tools, channels, LaReine,\n  MCP and voice can be changed from Settings without restarting the node.\n- **Embedded assets.** The SPA has no CDN dependency and remains available offline.\n- **Optional edges.** Browser control, voice services and remote hive clients attach to\n  the node without duplicating its state.\n\n## How a message flows\n\n1. A message arrives from the SPA, desktop app, TUI, Telegram, Discord, Slack or an API.\n2. `laruche-essaim` resolves the session, provider profile, working directory and\n   channel-specific model.\n3. Context assembly recalls the relevant memory, skills and tool schemas for the intent.\n4. `laruche-butinage` runs the model and tool loop while budgets, anti-loop logic,\n   cancellation and compaction remain active.\n5. Tools execute through one registry. Approval policy, disabled tools and secret\n   masking are enforced at dispatch time.\n6. Screenshots or camera frames returned by tools join the same multimodal transcript\n   as images attached in chat.\n7. If enabled, LaReine judges the draft and can accept it, request a fresh run or ask\n   the user to decide.\n8. The session, activity feed and tool statistics are persisted. Memories used in the\n   answer receive reinforcement, and the curator may later propose a reusable skill.\n\n## Background jobs\n\nThe node owns:\n\n- watcher evaluation and correlated event rules;\n- crons, missions and kanban progression;\n- curator passes and LaReine proposal handling;\n- memory dream proposals and embedding backfill;\n- OKF markdown snapshots committed to `memoire-okf/`;\n- channel delivery and the durable outbox;\n- mDNS announcements and optional mesh synchronization;\n- MCP server and external MCP client connections.\n\nThe desktop application starts or joins a node. It does not duplicate these jobs.\n","LaReine":"# LaReine\n\nLaReine is LaRuche's supervision layer. It can review a finished answer, send the\nworker through a fresh agentic run, gate selected self-modifications and watch a\nplanned task while it is running.\n\nIt sits outside the worker loop. The worker does the task and uses tools. LaReine\nevaluates the result and decides whether it can ship, needs another pass or should be\nflagged for a person.\n\nLaReine is off by default. Its settings are in **Settings > LaReine**.\n\n## Four operating modes\n\nThe mode controls who makes the final supervision decision.\n\n| Mode | Finished answers | Gated proposals |\n|---|---|---|\n| Off | No automatic review. The crown action can still request a one-off review. | If the queue gate is off, writes apply directly. If it is on, every covered write waits for a person. |\n| Autonomous | LaReine approves, requests a rework or reports an explicit escalation on its own. | Safe changes can apply directly. Sensitive changes require enough confidence; uncertain ones remain queued. Critical changes always wait for a person. |\n| Hybrid | Same autonomous loop, but any judge confidence strictly below the configured threshold escalates, even when the verdict says approve. | Same risk policy, with low-confidence sensitive changes explicitly escalated to a person. |\n| Human in the loop | Every reviewed answer is escalated instead of being rewritten automatically. | Every covered proposal waits for a person. |\n\nFor response review, Human in the loop is advisory rather than a blocking publication\ngate. The draft is shown with LaReine's scorecard and warning. It does not wait behind\nan approve button. The proposal queue is the part that provides a durable approve or\nreject gate before a change is applied.\n\nSetting **Max reworks** to `0` disables automatic response review even if the selected\nmode is Autonomous, Hybrid or Human in the loop. Finite values are limited to 10.\nUnlimited is stored as `255`, but the time and stagnation safeguards still apply.\n\n## Three supervision levels\n\n| Level | Scope | Current behavior |\n|---|---|---|\n| Tier 1, responses | Chat answers and background mission results | Runs the judge and, when allowed by the mode, the rework loop. |\n| Tier 2, artifacts | Memory and selected self-created artifacts | Uses a durable proposal queue with risk-based approval. |\n| Tier 3, live supervision | A planned butinage run | Detects a stalled plan, injects corrective nudges and eventually escalates. |\n\nThe controls are independent. Tier 1 also requires an active mode and at least one\nallowed rework. Tier 3 requires an active mode. Tier 2 has a separate **Queue memory\nchanges for review** switch, called `queue_gate` in the settings file.\n\nThe current Tier 2 switch records the intended artifact level, but the live routing is\ndriven by `queue_gate`. Enabling Tier 2 without the queue gate does not hold writes.\n\n## What the judge evaluates\n\nEvery completed review produces a scorecard with five values from 0 to 100:\n\n| Field | Meaning |\n|---|---|\n| Relevance | Does the answer address the actual request? |\n| Methodology | Was the work performed and verified with appropriate tools? |\n| Objective | Is the requested deliverable complete and usable? |\n| Brand conformance | Does the answer follow the configured writing and behavior rules? |\n| Confidence | How certain is the judge about its own assessment? |\n\nThe global quality score is the average of the first four values. Confidence is kept\nseparate because it controls Hybrid escalation rather than answer quality.\n\nThe scorecard also contains a verdict, a reason, an actionable correction instruction\nand the judge's analysis. The verdict is one of `approve`, `revise` or `escalate`.\n\n### The charter\n\nThe rubric comes from the cognitive-memory document `system.prompt_reine`. If that\ndocument is empty or absent, LaRuche uses the charter compiled from\n`skills/lareine-charter/SKILL.md`.\n\nThis makes the reviewer policy editable without rebuilding the application. A team can\nrequire sources, tests, a specific answer structure or its own writing rules. The\ncharter should describe observable criteria. Vague instructions make the scorecard\nless stable.\n\n### Evidence available to LaReine\n\nLaReine does not grade only the final prose. For each draft it receives a bounded view\nof the work that produced it:\n\n- the current request and draft;\n- up to 20 earlier conversation messages, with 4 as the default;\n- the opening request when the recent window no longer reaches it;\n- the tools that were available to the worker;\n- the tool calls made since the last user message;\n- useful call arguments such as a query, URL, path, command or task;\n- short tool-result extracts, source URLs and failed-call counts;\n- the top-level cognitive-memory domains;\n- correction instructions already issued during earlier review rounds.\n\nThis is what makes the methodology score useful. A draft that says tests passed can be\ncompared with the actual trace. A research answer can be checked against the searches,\nsources and failures recorded during the run.\n\nThe evidence view is deliberately capped. Tool evidence gets a shared character budget\nand each result is shortened before it enters the judge prompt. This prevents one large\npage or command output from consuming every later review round.\n\n## Tier 1: review and rework\n\nThe automatic response path runs after the worker has produced an answer:\n\n1. LaReine builds the conversation context and the evidence view.\n2. The judge returns a structured scorecard.\n3. The mode and confidence threshold select approve, revise or escalate.\n4. A revision starts a new worker run with the original request and LaReine's concrete\n   instruction.\n5. The new answer is judged again until it passes or a safeguard stops the loop.\n6. The final answer, verdict and analysis are written back to the session.\n\nA rework is not a paraphrase call. It is a complete agent run with access to the normal\ntools. Read-only tools are encouraged when the problem is missing evidence. The rework\nbrief is scoped to the answer text and explicitly forbids file mutations caused only by\na writing correction.\n\nThe same Tier 1 path can review the result of a background mission. It returns the\nrevised result to the mission instead of treating mission output as a separate,\nunreviewed channel.\n\n### Rework safeguards\n\nSeveral independent limits prevent supervision from becoming an endless loop:\n\n- **Round limit**: 0 to 10 finite reworks, or Unlimited.\n- **Wall-clock budget**: `LARUCHE_REINE_BUDGET_SECS`, 600 seconds by default, covers\n  the complete review and rework sequence.\n- **Stagnation stop**: two consecutive rounds without a better score stop further\n  rework.\n- **Best-draft retention**: if a later draft scores worse, LaRuche can ship the best\n  earlier draft instead.\n- **Provider-error bypass**: a short response that is clearly a provider or connection\n  error is flagged without spending more calls trying to rewrite it.\n- **Failed-rework fallback**: an empty result, a system error or a failed worker run\n  leaves the previous answer intact.\n- **Best effort judge**: provider failures and invalid scorecard output never break the\n  original turn.\n\nUnlimited therefore means no round count limit. It does not disable the time budget,\nstagnation detection or failure fallbacks.\n\n## One-off review from the conversation\n\nWhen automatic supervision is inactive, a crown action is available on assistant\nmessages.\n\nThe first action calls `POST /api/reine/appel`. It is judge-only: LaReine returns the\nverdict, scores, correction and analysis without replacing the answer. It works while\nthe global mode is Off and uses a wider context window of 12 messages.\n\nIf the verdict asks for work, **Send LaRuche back to work** calls\n`POST /api/reine/renvoyer`. That action is explicit because it spends tokens and can\nreplace the answer. It temporarily ensures Autonomous mode, Tier 1, at least one\nrework and at least 12 context messages for that run. The configured judge profile is\nstill used.\n\nBoth endpoints check that the caller may access the session.\n\n## Judge provider\n\nLaReine can use the worker's active model or a separate provider profile. A distinct\njudge is usually more useful because a model tends to repeat or accept its own blind\nspots. A stronger remote model can supervise a smaller local worker, while a small\nlocal judge can provide cheap routine checks.\n\nJudge calls use a low temperature of `0.2` and allow up to 2,048 output tokens so the\nstructured scorecard has room to complete. A separate judge still adds one model call\nper review round, and every requested rework adds a full worker run.\n\n## Tier 2: proposal queue\n\nThe queue is a review boundary for selected changes to LaRuche's own state. Proposals\nare stored in `laruche-reine-queue.json` and remain available after a restart.\n\nCurrent end-to-end coverage includes:\n\n- curator memory additions and updates;\n- whole memory-node deletion requested through the tool;\n- skills created by the agent;\n- duplicate-memory cleanup proposed by the dream pass.\n\nThe proposal model also defines new-tool and mission types, but the generic queue\napprover does not currently apply those two types. They should not be treated as\ncomplete Tier 2 workflows yet.\n\n### Risk policy\n\n| Risk | Examples | Automatic behavior |\n|---|---|---|\n| Safe | New memory information that does not collide with existing state | Can apply automatically in Autonomous and Hybrid modes. |\n| Sensitive | Updating state or creating a skill | Can apply only when the mode and confidence policy allow it. |\n| Critical | Deletion, overwrite or dream deduplication | Never applies automatically. A person must approve it. |\n\nWhen the queue gate is enabled while LaReine is Off, it becomes a pure human gate and\nqueues every covered write. In Human in the loop mode it also queues everything.\n\nFor curator memory writes, the current proposal policy uses an internal confidence\nthreshold of 60. The configurable Hybrid threshold applies to response review; it is\nnot yet passed into this queue decision.\n\nProposals can be approved or rejected individually from the Memory interface. **Apply\nall safe** accepts every pending safe addition. Rejected items remain in the journal\nfor audit. Pending items older than 14 days are marked expired when the queue is listed.\nThe status model also supports obsolete proposals whose target changed after creation.\n\nTurning LaReine or the queue gate off does not delete or auto-apply the backlog. Existing\nproposals remain pending. Only new writes stop being gated when `queue_gate` is off.\n\n## Tier 3: live task supervision\n\nTier 3 watches plan progress inside the butinage loop. It is different from Tier 1:\nit acts while a task is still running rather than judging only the final answer.\n\nThe current policy is deterministic:\n\n1. If no plan exists, supervision stays passive.\n2. After three consecutive passes without a newly completed plan step, LaReine injects\n   an internal corrective message.\n3. The message names the next unfinished step and can include relevant cognitive-memory\n   recall for that step.\n4. Progress resets the stagnation counter.\n5. After two corrective interventions without progress, the run ends with an\n   escalation instead of consuming more passes.\n\nTier 3 is available only when its switch is enabled and the LaReine mode is not Off.\nThe stagnation threshold and intervention count currently use built-in defaults rather\nthan settings exposed in the dashboard.\n\nLaReine and the Vigie solve related but different problems. The Vigie blocks repeated\ntool failures and sterile call patterns. Tier 3 watches whether the declared plan is\nactually advancing, even when individual calls are technically valid.\n\n## Scorecards and training data\n\nEvery completed review appends a numeric record to\n`evals/reine-scorecards.jsonl`. The settings dashboard aggregates:\n\n- review, approve, revise and escalation counts;\n- number of answers actually reworked;\n- average relevance, methodology, objective, brand and confidence scores;\n- average review rounds;\n- the most recent scorecards.\n\nScorecards do not store enough text to train a model. Full-text dataset capture is a\nseparate opt-in setting. When enabled, it records the request, initial draft, released\nanswer, corrections, reasoning and scores in `evals/reine-dataset.jsonl`. The dashboard\ncan export SFT conversations, genuine DPO preference pairs and judge-distillation\nexamples.\n\nSecret values are masked before full-text capture, but this is not a complete privacy\nscrub. See [Training Datasets](Training-Datasets) for the formats, curation workflow and\nsecurity limits.\n\n## Configuration and stored state\n\nThe main settings are persisted in `laruche-reine.json`:\n\n| Setting | Default | Purpose |\n|---|---:|---|\n| `mode` | `off` | Off, Autonomous, Hybrid or Human in the loop |\n| `max_revues` | `0` | Maximum reworks; `255` means Unlimited |\n| `seuil_confiance` | `60` | Hybrid response-escalation threshold |\n| `contexte_messages` | `4` | Earlier messages shown to the judge, capped at 20 |\n| `provider_profile` | worker profile | Optional separate judge profile |\n| `tier_reponse` | `true` | Tier 1 switch |\n| `tier_artefacts` | `false` | Stored Tier 2 intent switch |\n| `tier_supervision` | `false` | Tier 3 switch |\n| `queue_gate` | `false` | Live gate for covered memory and artifact writes |\n| `dataset` | `false` | Full-text training capture |\n\nThe scorecard journal is always written after completed reviews. The full-text dataset\nis not. This separation makes it possible to track quality without retaining entire\nconversations.\n\n## Choosing a mode\n\n- Use **Off** when latency matters and call the crown only on answers worth auditing.\n- Use **Autonomous** when the worker can safely redo routine work without waiting for a\n  person.\n- Use **Hybrid** when autonomous rework is useful but uncertain judgments should be\n  visible to a person.\n- Use **Human in the loop** when every review must be flagged and no response should be\n  rewritten automatically. It is not a strict response-approval gate.\n- Enable the **proposal queue** when memory deletion, generated skills or curator writes\n  need an approve or reject trail.\n- Enable **Tier 3** for long planned tasks where lack of progress matters more than one\n  failed tool call.\n\nFor serious evaluation or dataset collection, use a judge different from the worker,\nkeep the charter concrete and inspect score trends before changing models or thresholds.\n","Cognitive-Memory":"# Cognitive Memory\n\nLaRuche's memory is not a vector store bolted onto a chat log. It is a cognitive map:\nnamed nodes (topics) holding items (facts), stored in SQLite, recalled by hybrid search,\ncurated over time, and versioned in git.\n\n## Recall\n\nSearch fuses two signals:\n\n- **Semantic**: embeddings (default `nomic-embed-text` via Ollama) for meaning-level\n  matches.\n- **Full-text**: SQLite FTS5 for exact terms, names, paths, error strings.\n\nThe working set assembled before each agent run pulls the most relevant facts into\ncontext automatically. Tools also expose explicit recall to the model.\n\n## What keeps the map clean\n\nMemory that only grows becomes noise. Several mechanisms push back:\n\n- **Importance decay**: facts lose weight over time unless something reinforces them.\n- **Write-time supersede**: writing a fact that contradicts or updates an existing one\n  replaces it instead of piling up next to it. The old fact is superseded, not silently\n  destroyed.\n- **LLM arbiter**: contradictions in the ambiguity band (similar but not clearly the\n  same fact) are settled by a small model call, never destructively.\n- **Dream pass**: a periodic consolidation job that surfaces duplicates and merge\n  candidates as proposals you approve or reject. It never deletes on its own.\n\n## Hebbian ranking\n\n\"Neurons that fire together wire together\", applied honestly:\n\n- **Level 1**: recalled facts gain a small amount of weight (access count).\n- **Level 2**: the working-set recall is trace-free; after the answer is produced, only\n  the facts whose content actually shows up in the answer get reinforced. Mere\n  co-occurrence in the context no longer inflates a fact's rank. Recalled noise stays\n  noise.\n\n## Git time travel\n\nOn a schedule (`LARUCHE_OKF_GIT_SECS`, default 30 minutes, `0` disables), the whole map\nis exported as plain markdown (the OKF format) into `memoire-okf/`, a dedicated git\nrepository with its own history, independent from the code repo. Snapshots that change\nnothing produce no commit.\n\nWhat this buys you:\n\n```bash\ncd memoire-okf\ngit log --oneline          # the agent's learning timeline\ngit diff HEAD~5 --stat     # what it learned in the last 5 snapshots\ngit show <sha> -- projets/laruche.md   # a fact's history\n```\n\nRollback is a checkout plus re-import: restore a file from an earlier snapshot and\nimport it back. Surgical, auditable, and it uses tools you already know.\n\n## Hot-editable system prompts\n\nThe agent's own system prompts live in memory as `system.*` entries (identity, behavior,\nplanning, curator, consolidation). Edit them in the Memory tab and the change applies to\nthe next run. Restore-to-default is one click.\n\n## Inspecting everything\n\n`memoire.db` is a normal SQLite file. The Memory tab in the dashboard offers full CRUD\nwith previews of proposed entries. Nothing about what the agent knows is opaque.\n","Butinage-Engine":"# The Butinage Engine\n\nButinage is LaRuche's agent loop. It turns a request into a sequence of model calls,\ntool calls, observations and decisions, then stops with an answer, a clarification or a\nreported blocker. The implementation is built to run with cloud models and local models\nthat may return malformed calls, repeat a failed action or lose track of a long task.\n\n## The ReAct loop\n\nOne run follows this cycle:\n\n1. **Assemble context.** LaRuche combines the stable system prompt, the conversation,\n   the current plan, relevant memory, the available tool schemas and volatile data such\n   as the current time.\n2. **Call the model.** The provider receives the messages and only the tools selected for\n   this request. A model call has its own timeout and retry policy.\n3. **Interpret the turn.** The engine reads native tool calls when the provider supports\n   them. A tolerant parser can recover calls emitted as text by weaker models.\n4. **Validate every call.** Arguments are checked against the tool's JSON Schema before\n   execution. Invalid arguments become an observation the model can correct.\n5. **Run the tools.** Robust profiles can execute independent calls from one turn in\n   parallel. The fragile profile limits the model to one call at a time.\n6. **Observe.** Results, errors and safety decisions are returned to the next model pass.\n   Large observations keep their beginning and end while the middle is elided.\n7. **Choose a bearing.** The Boussole decides whether to continue, land, ask for missing\n   information or accept the collected result.\n8. **Checkpoint or finish.** Continuing runs persist their notebook. Successful runs\n   remove it, reinforce memory that was actually used and store a concise episode.\n\nThis is ReAct in practical form: reason from the current state, act through a tool,\nobserve the result, then reassess. A text answer does not automatically mean the loop is\ncomplete. Completion depends on structured state such as tool calls, stop reason, plan\nprogress, exploration requirements and remaining retries.\n\n## What is sent on each pass\n\nThe system prompt is kept byte-stable so providers can reuse their prefix cache. Data\nthat changes during a run stays in a volatile tail. Providers with strict local chat\ntemplates cannot accept a trailing system message, so LaRuche merges that tail into the\nlast user turn instead.\n\nThe active tool list is also bounded. Dynamic selection matches the request to the tool\nregistry and injects only relevant schemas. On model contexts of 40,000 tokens or less,\ndynamic selection is forced to avoid spending most of the window on tool definitions.\nThis changes what the model can see, not what tools are installed.\n\nThe main chat receives a budgeted working set from cognitive memory before the run.\nScouts and resumed runs can perform their own initial recall so they do not start blind.\n\n## Calls, validation and observations\n\nNative provider calls are preferred. Text fallback exists for models that print a tool\nname and JSON instead of using the provider protocol. Recovery is intentionally bounded:\nmalformed output can trigger a corrective pass, but it cannot cause unlimited retries.\n\nBefore a tool runs, the engine checks:\n\n- that the tool exists in the active registry;\n- that its arguments match the declared schema;\n- that permission and approval rules allow the call;\n- that the Vigie has not blocked an exact repeated dead end;\n- that the run has not been cancelled.\n\nThe default tool timeout is 300 seconds and the default single model-call timeout is 600\nseconds. Individual tools may override the tool limit. Observation size follows the\nmodel context: roughly one quarter of the declared window, clamped between 24,000 and\n400,000 characters. Truncation preserves the head and tail, which usually contain the\nrequest context and the final error or conclusion.\n\n## The Boussole\n\nThe Boussole is the single decision point after a pass. It returns one of four outcomes:\n\n| Decision | Effect |\n|---|---|\n| `Poser` | Land and return the answer or a clean stop reason |\n| `Relancer` | Add one internal corrective instruction and run another pass |\n| `Recolter` | Accept a structured mission result |\n| `Clarifier` | Ask the user for information that is required to continue |\n\nIt operates on facts recorded by the engine, not on keyword guesses in the answer. It\nknows whether tools were called, whether a result was truncated, whether exploration is\ncomplete, whether delegation is available and how many sterile relaunches remain.\n\nThe default sterile relaunch limit is three. Normal assistant text is allowed to finish\na standard turn. The engine does not force every response into another pass just because\nthe global pass ceiling has not been reached.\n\n## The Vigie\n\nThe Vigie watches tool activity for three concrete loop patterns:\n\n- the same tool with the same arguments fails repeatedly;\n- one tool keeps failing even when its arguments change;\n- an idempotent read repeats with the same result and makes no progress.\n\nIt first warns the model. Under strict and robust profiles it can then block the exact\ncall or stop a run in which the same tool keeps failing. A successful call clears the\nrelevant failure counters. Non-idempotent writes are not classified as stagnant merely\nbecause their output text looks alike.\n\nThe counters are stored in the run notebook. Restarting a crashed run does not reset its\nloop history. The Native Tools profile uses warnings without hard Vigie stops because it\ntrusts strong provider-native tool handling.\n\nThe Vigie is separate from LaReine. The Vigie detects mechanical tool loops inside the\nengine. LaReine reviews quality, policy and plan progress at the supervision layer.\n\n## Plans and progress\n\nA model can create or update an itinerary. The engine persists its steps, measures\nprogress between passes and exposes updates to the live activity view. The plan is state,\nnot decorative prose: it supports resume, Tier 3 LaReine supervision and stagnation\ndetection.\n\nThe model can promote a standard run to exploration mode through `research_mode` or a\ndeep-research plan. That promotion is one-way for the current run, so the model cannot\ndrop the exploration requirements to finish early.\n\n## Deep research\n\nExploration mode adds a stricter protocol:\n\n- split the question into at most three or four independent angles;\n- delegate up to four scouts in parallel when delegation is available;\n- use a guardian pass to cross-check the collected reports;\n- verify unstable claims with current web sources;\n- keep a findings ledger and cover a minimum search effort;\n- perform one final self-check before landing.\n\nThe parent run expects 12 weighted web actions by default. A delegated scout counts as\nthree because it performs its own focused searches. Individual scouts use a smaller\nminimum of three web calls. Sub-agents cannot delegate again, which prevents recursive\nfan-out.\n\nThe self-check can bounce a proposed completion once. It asks the model to look for a\nmissing angle, weak evidence or an unsupported conclusion. The next valid completion\nlands, so verification cannot become its own loop.\n\n## Context budget and Escale\n\nThe Jauge tracks input and output tokens across the whole run. A run can have an explicit\ncumulative token budget, or `0` for no additional budget beyond provider and pass limits.\nThe default model context is 128,000 tokens and compaction starts according to the\nconfigured threshold, normally 75 percent in the assembled engine.\n\nWhen the conversation approaches the window, Escale compacts older history while\nkeeping the 12 most recent messages intact by default. The preferred path asks an\nauxiliary model for a dense summary that preserves discoveries, decisions, plan state and\nfailed approaches. If that call fails or returns nothing usable, an extractive fallback\nkeeps the run moving without discarding the history.\n\nSystem prompts, the current user anchor and recent messages remain separate from the\nsummary. Internal nudges used to correct the model are not shown as user messages and are\nnot persisted as part of the conversation.\n\n## Retry and stop conditions\n\nThe defaults are deliberately finite:\n\n| Limit | Default |\n|---|---:|\n| Pass ceiling | 100 |\n| Sterile corrective relaunches | 3 |\n| Rate-limit retries | 3 |\n| Transient retries | 3 |\n| Model call timeout | 600 seconds |\n| Tool call timeout | 300 seconds |\n| Run token budget | Unlimited unless configured |\n\nRate limits and transient provider failures use their own counters. Rejected or blocked\ntool calls cannot consume the entire pass ceiling forever. Near a pass or token limit,\nthe model receives one wind-down instruction so it can summarize the useful result or\nstate the blocker.\n\nA run can finish because the mission completed, the user must clarify something, the\nbudget or pass ceiling was reached, a sterile loop was confirmed, the user stopped it or\na fatal provider error occurred. If the last pass only contained tool calls, the engine\ncan still return the last non-empty assistant text instead of producing a blank answer.\n\n## Cancellation, steering and resume\n\nThe Stop control is cooperative and checked while waiting for the model, between passes\nand around tool execution. A steering message is queued into the next pass boundary, so\nthe user can redirect a live run without throwing away completed work.\n\nAfter each continuing pass, the engine writes a notebook containing history, plan,\nusage, mission mode and Vigie counters. A page reload can reattach to the live job. After\na process interruption, a compatible notebook can resume the run with memory recall and\nthe exploration protocol restored when needed. The notebook is deleted after a clean\nsuccess and retained after an incomplete stop for inspection or continuation.\n\n## Model profiles\n\n| Profile | Intended target | Behavior |\n|---|---|---|\n| Fragile | Small local models | One tool per turn, strict Vigie, tolerant text parsing |\n| Robust | Capable local or remote models | Parallel tools, standard Vigie thresholds |\n| Native Tools | Providers with reliable native calls | Parallel tools, trusted stop reasons, warning-only Vigie |\n\nThe engine stays the same across profiles. Only the rails and the amount of trust change.\n\n## After landing\n\nLaRuche performs two memory operations after a successful answer. First, recalled facts\nare reinforced only when the final answer actually used them. Second, a concise episode\ncan be stored so later runs know what was attempted, what worked and which dead ends to\navoid. These steps happen after completion and do not alter the answer already returned.\n\nLaReine may also review the result, request rework or record a scorecard, depending on\nits configured mode. See [LaReine](LaReine) for the exact supervision semantics.\n\n## Measuring a change to this engine\n\nEverything on this page is a knob someone will eventually want to turn, and a prompt or\na rail is the kind of change that always looks like an improvement to the person who\nmade it. `laruche-evals` replays fixed missions against this engine, with the real\nprovider and the real tools, and judges each run mechanically against a saved baseline.\n\nSee [Evals](Evals) for what it checks and how to read a diff.\n","Automation":"# Automation\n\nThe automation hub gathers everything the hive does on its own: crons, missions, the\nkanban, and [watchers](Watchers). The agent creates all of them through its own tools,\nfrom a plain-language request, with your approval.\n\n## Crons\n\nScheduled prompts. \"Every morning at 9, check these three pages and summarize what\nchanged\" becomes a cron whose payload is an agentic run. Each cron can target a\nspecific channel, so the morning digest lands on Telegram while a weekly report stays\nin the web feed.\n\nTelegram users can inspect and prune from the phone: `/crons`, `/delcron <name|all>`.\n\n## Missions\n\nLong-running goals that survive across days: \"research topic X in depth, iterate daily,\nkeep your notes in memory.\" A mission holds its own state and channel, gets scheduled\nwork, accumulates findings in the cognitive map, and reports on its channel.\n\nA finished mission stops occupying the scheduler; its cron disappears with it.\n\n## Kanban\n\nThe board behind the missions: tasks move through columns, each task can carry its own\nchannel for reporting, and its own profile and model. Useful both as the agent's own\nwork queue and as a shared surface where you drop tasks for the hive.\n\n**Only the Ready column runs.** A task you write, or one the agent creates, lands in\nTriage or Todo and stays there until someone promotes it. Nothing you type is executed\non the spot.\n\nThis is the single most surprising thing about the board, and it is deliberate. Without\nthat gate the dispatcher would take everything: the agent files five follow-ups while\nworking, and five agentic runs start a few seconds later, none of which anybody asked\nfor. Promotion to Ready is the moment a human says yes.\n\nOnce a task is in Ready, the dispatcher picks it up within the poll interval, five\nseconds by default, adjustable in the Kanban tab. One task at a time: a board is a\nqueue, not a fan-out.\n\n## Watchers\n\nEvent-driven rather than time-driven. See [Watchers](Watchers) for the rules, the four\nobservable types, and what a watcher can do when it fires.\n\n### Cron or watcher?\n\nThis is the one choice worth getting right, because the costs are not comparable.\n\nA cron wakes a full agentic run at every tick, whether anything changed or not. A\nwatcher evaluates a compiled rule tree, which costs nothing, and only involves a model\nif the tree explicitly asks for one or if its action is `agent`.\n\nSo: **if you are asking \"has X happened yet\", it is a watcher, not a cron**, even when\nwhat you observe needs a command to answer. Watching a lamp, a service or a disk\nthrough a `command` watcher costs nothing per check; the same thing scheduled as a cron\ncosts a model turn every single time.\n\nReach for a cron when the work itself is the point and its timing is arbitrary: a\nmorning digest, a weekly report, a nightly cleanup. Reach for a watcher when a\ncondition decides.\n\n## How they compose\n\nThe four primitives combine naturally:\n\n- A **watcher** notices the release file appeared, and hands it to the agent.\n- The agent run files a summary in **memory** and adds a follow-up task to the\n  **kanban**.\n- A **cron** picks up the board every morning and sends the digest to Telegram.\n\nNone of this requires you to write configuration. Describe the loop you want; the agent\nassembles it from its own primitives and shows you what it built.\n","Skills-and-Curator":"# Skills and the Curator\n\n## Skills\n\nA skill is a markdown file: instructions, examples, and conventions for a category of\ntask. Skills live on disk, are editable from the UI or any editor, and are selected\ndynamically: the working-set assembly matches the user's intent against the skill\ncatalog and injects only the relevant ones, so the context stays lean.\n\nBuilt-in skills cover things like watcher creation (`watcher-architecte`) and mission\nplanning; your own skills teach the agent your conventions: how you like reports\nformatted, how your homelab is laid out, what \"deploy\" means in your world.\n\n## The curator\n\nThe curator (curateur) is the background component that grows the skill library from\nexperience. After a conversation ends, it can review the transcript and ask: did the\nagent figure out something reusable here? If yes, it drafts a skill, verifies it, and\nproposes it.\n\n### Verified, not vibed\n\nA curator skill proposal is not a summary of the chat. The draft is checked for\nconcrete, reusable instructions, and proposals can be routed through the\n[LaReine](LaReine) proposal queue so you review the full content before anything joins\nthe library. The agent proposes, you dispose.\n\n### Polite by construction\n\nThe curator shares your local model with your live conversations, so it is engineered\nto never get in the way:\n\n- **Single-flight**: at most one curator pass at a time.\n- **Cooldown**: a minimum delay between passes (default 10 minutes,\n  `LARUCHE_CURATEUR_COOLDOWN_SECS`).\n- **Yields to you**: if any chat or agent run is active, the curator waits. Your\n  conversation never lags because the hive is studying its notes.\n\n## Editing and versioning\n\nSkills are plain markdown, so they diff, they version, and they travel. The\n[Miel mesh](Architecture#background-jobs) can federate skills between your nodes with\nprovenance tags, opt-in.\n"}};
/* WIKI-DATA:END */
</script>

<script>
(function () {
  "use strict";

  var doc = document.getElementById("doc");
  var nav = document.getElementById("nav");
  var crumb = document.getElementById("crumb");
  var pager = document.getElementById("pager");
  var side = document.getElementById("side");
  var scrim = document.getElementById("scrim");

  // Flat reading order, used for the previous/next pager.
  var FLAT = [];
  WIKI.sections.forEach(function (s) {
    s.pages.forEach(function (p) { FLAT.push({ slug: p.slug, title: p.title, section: s.label }); });
  });
  var KNOWN = {};
  FLAT.forEach(function (p, i) { KNOWN[p.slug] = i; });

  /* ── Markdown, limited on purpose to what wiki/ actually uses:
        headings, lists, tables, fenced code, blockquotes, bold,
        inline code, links. Everything is escaped before formatting. ── */

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function anchorId(t) {
    return t.toLowerCase().replace(/`/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  }

  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]*)\]\(([^)]+)\)/g, function (_, txt, href) {
      if (/^(https?:|mailto:)/i.test(href)) {
        return '<a href="' + href + '" target="_blank" rel="noopener">' + txt + "</a>";
      }
      if (href.charAt(0) === "#") return '<a href="' + href + '">' + txt + "</a>";
      var bits = href.split("#");
      var page = bits[0];
      if (!Object.prototype.hasOwnProperty.call(KNOWN, page)) {
        // Keep the label visible rather than offering a link that leads nowhere.
        return '<a class="dead" title="This page does not exist yet">' + txt + "</a>";
      }
      return '<a href="#/' + page + (bits[1] ? "#" + bits[1] : "") + '">' + txt + "</a>";
    });
    return s.replace(/\u0000C(\d+)\u0000/g, function (_, i) { return "<code>" + codes[i] + "</code>"; });
  }

  function listItems(lines, start) {
    var items = [], i = start;
    var ordered = /^\s*\d+\.\s/.test(lines[start]);
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) {
        if (i + 1 < lines.length && /^\s*(?:[-*]|\d+\.)\s/.test(lines[i + 1])) { i++; continue; }
        break;
      }
      var m = l.match(/^(\s*)(?:[-*]|\d+\.)\s+(.*)$/);
      if (m) { items.push({ indent: m[1].length, text: m[2] }); i++; continue; }
      if (items.length && /^\s+\S/.test(l)) {           // wrapped continuation line
        items[items.length - 1].text += " " + l.trim(); i++; continue;
      }
      break;
    }
    return { items: items, next: i, ordered: ordered };
  }

  function renderItems(items, ordered) {
    if (!items.length) return "";
    var min = items.reduce(function (a, x) { return Math.min(a, x.indent); }, Infinity);
    var html = ordered ? "<ol>" : "<ul>";
    var k = 0;
    while (k < items.length) {
      var body = inline(esc(items[k].text));
      k++;
      var kids = [];
      while (k < items.length && items[k].indent > min) { kids.push(items[k]); k++; }
      html += "<li>" + body + (kids.length ? renderItems(kids, false) : "") + "</li>";
    }
    return html + (ordered ? "</ol>" : "</ul>");
  }

  function tableAt(lines, start) {
    var rows = [], i = start;
    while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
    if (rows.length < 2 || !/^[\s|:\-]+$/.test(rows[1])) return null;
    var cut = function (r) {
      return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    };
    var html = '<div class="tw"><table><thead><tr>';
    cut(rows[0]).forEach(function (h) { html += "<th>" + inline(esc(h)) + "</th>"; });
