<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>LaRuche Wiki</title>
<meta name="description" content="Documentation for LaRuche: installation, the butinage engine, cognitive memory, watchers, voice, MCP and the full configuration reference.">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="laruche.png">
<link rel="icon" type="image/png" href="laruche.png?v=2">
<style id="feuille">
/* ===================================================================
   LaRuche Wiki. Same tokens as the dashboard (app.css) and the landing
   page. The whole corpus is embedded at build time by
   scripts/build_wiki.py, so this file makes no request of any kind.
   =================================================================== */
:root {
  --amber:#f59e0b; --amber-light:#fbbf24; --amber-dim:#b45309; --amber-glow:rgba(245,158,11,0.15);
  --bg:#09090b; --bg-card:rgba(24,24,27,.85); --bg-panel:#111113; --bg-input:rgba(39,39,42,.6);
  --bg-hover:rgba(245,158,11,0.08);
  --border:#2a2a2e; --border-light:#3a3a3e;
  --text:#fafafa; --text-dim:#a1a1aa; --text-muted:#52525b;
  --green:#22c55e; --blue:#3b82f6; --purple:#a855f7; --cyan:#06b6d4;
  --radius:8px;
  --font:'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'Cascadia Code','JetBrains Mono','Fira Code', ui-monospace, Consolas, monospace;
  --transition-fast:0.15s ease;
  --side:274px;
}
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.7;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  overscroll-behavior-y:contain; }
a { color:var(--amber); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--amber); outline-offset:3px; border-radius:4px; }
::selection { background:var(--amber-glow); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--border-light); }

/* ── Top bar, same as the landing page ─────────────────────────────── */
.topbar { position:sticky; top:0; z-index:60; border-bottom:1px solid var(--border);
  background:rgba(9,9,11,.86); backdrop-filter:blur(10px); }
.topbar .inner { display:flex; align-items:center; gap:14px; height:56px; padding-inline:clamp(14px,3vw,24px); }
.brand { display:flex; align-items:center; gap:10px; font-weight:650; color:var(--text); }
.brand:hover { text-decoration:none; }
.brand svg, .brand img { display:block; border-radius:7px; object-fit:contain; }
.brand .tag { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--amber); border:1px solid var(--border); border-radius:5px; padding:2px 7px; }
.spacer { flex:1; }
.topbar .lnk { padding:6px 12px; border:1px solid var(--border); border-radius:var(--radius);
  font-size:13px; color:var(--text-dim); transition:border-color var(--transition-fast), color var(--transition-fast); }
.topbar .lnk:hover { border-color:var(--amber-dim); color:var(--amber); text-decoration:none; }
/* L'interrupteur de l'abeille. Meme boite que les liens voisins, l'emoji tient
   lieu d'etiquette. Eteint, il reste lisible mais cesse de se presenter comme
   actif: c'est un reglage, pas une decoration. */
.topbar .bascule-abeille { background: none; cursor: pointer; font-family: inherit;
  font-size: 15px; line-height: 1; padding: 5px 9px; }
.topbar .bascule-abeille.eteinte { opacity: .4; filter: grayscale(1); }
.topbar .bascule-abeille.eteinte:hover { opacity: .75; }
/* Sous 560px la barre n'a plus la place de tout porter, et elle debordait deja
   avant l'interrupteur. Le lien Home fait double emploi avec le logo, qui mene
   a l'accueil, et la puce WIKI avec le titre de la page. */
@media (max-width:560px) {
  .topbar .inner { gap:10px; }
  .topbar .lnk[href="index.html"], .brand .tag { display:none; }
}
.burger { display:none; background:none; border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text-dim); padding:6px 10px; cursor:pointer; font:inherit; font-size:13px; }

/* ── Honeycomb loader, verbatim from app.css ───────────────────────── */
@keyframes pulse-hex { 0%,100% { opacity:.2; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
.honeycomb-loader { display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; }
.honeycomb-loader .hexagon { background:var(--amber);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  position:absolute; animation:pulse-hex 1.5s infinite ease-in-out; }
.honeycomb-loader.hc-sm { width:30px; height:30px; }
.honeycomb-loader.hc-sm .hexagon { width:8px; height:9px; }
.hc-sm .hx1{top:3px;left:11px;animation-delay:0s} .hc-sm .hx2{top:8px;left:4px;animation-delay:.2s}
.hc-sm .hx3{top:8px;left:18px;animation-delay:.4s} .hc-sm .hx4{top:13px;left:11px;animation-delay:.6s}
.hc-sm .hx5{top:18px;left:4px;animation-delay:.8s} .hc-sm .hx6{top:18px;left:18px;animation-delay:1s}
.hc-sm .hx7{top:23px;left:11px;animation-delay:1.2s}

/* ── Shell ─────────────────────────────────────────────────────────── */
.wrap { display:grid; grid-template-columns:var(--side) minmax(0,1fr); align-items:start; }
@media (max-width:900px) { .wrap { grid-template-columns:minmax(0,1fr); } }

aside { position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  border-right:1px solid var(--border); background:var(--bg-panel); padding:18px 0 40px; }
@media (max-width:900px) {
  aside { position:fixed; top:56px; left:0; width:min(320px,86vw); z-index:55;
    transform:translateX(-102%); transition:transform .2s ease; box-shadow:0 0 60px rgba(0,0,0,.6); }
  aside.open { transform:none; }
  .burger { display:inline-block; }
}
.search { padding:0 16px 14px; }
.search input { width:100%; padding:8px 11px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-input); color:var(--text); font:inherit; font-size:13px; }
.search input::placeholder { color:var(--text-muted); }
.search input:focus { outline:none; border-color:var(--amber-dim); }
.nav-sec { margin-bottom:18px; }
.nav-sec h4 { margin:0 16px 6px; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-muted); font-weight:500; }
.nav-sec a { display:block; padding:6px 16px 6px 16px; font-size:13.5px; color:var(--text-dim);
  border-left:2px solid transparent; transition:background var(--transition-fast), color var(--transition-fast); }
.nav-sec a:hover { background:var(--bg-hover); color:var(--text); text-decoration:none; }
.nav-sec a.on { color:var(--amber); border-left-color:var(--amber); background:var(--bg-hover); font-weight:600; }
.nav-empty { padding:6px 16px; font-size:13px; color:var(--text-muted); }

main { min-width:0; padding:34px clamp(18px,4vw,56px) 90px; max-width:900px; }
.crumb { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:14px; }
.crumb b { color:var(--amber); font-weight:600; }

/* ── Rendered markdown ─────────────────────────────────────────────── */
.doc h1 { font-size:clamp(27px,4vw,38px); line-height:1.15; letter-spacing:-.02em; margin:0 0 20px; }
.doc h2 { font-size:23px; letter-spacing:-.01em; margin:44px 0 12px; padding-bottom:8px;
  border-bottom:1px solid var(--border); scroll-margin-top:76px; }
.doc h3 { font-size:17px; margin:30px 0 10px; color:var(--text); scroll-margin-top:76px; }
.doc h4 { font-size:15px; margin:22px 0 8px; color:var(--text-dim); scroll-margin-top:76px; }
.doc p { margin:0 0 15px; color:var(--text-dim); max-width:74ch; }
.doc ul, .doc ol { margin:0 0 15px; padding-left:22px; color:var(--text-dim); max-width:74ch; }
.doc li { margin-bottom:5px; }
.doc li > ul, .doc li > ol { margin:5px 0 0; }
.doc strong { color:var(--text); font-weight:650; }
.doc code { font-family:var(--mono); font-size:.87em; background:var(--bg-input);
  border:1px solid var(--border); border-radius:5px; padding:1px 5px; color:var(--amber-light); }
.doc pre { margin:0 0 18px; padding:14px 16px; background:var(--bg-panel); border:1px solid var(--border);
  border-radius:var(--radius); overflow-x:auto; }
.doc pre code { background:none; border:0; padding:0; color:var(--text-dim); font-size:12.8px; line-height:1.7; }
.doc blockquote { margin:0 0 18px; padding:12px 16px; border-left:3px solid var(--amber-dim);
  background:var(--bg-card); border-radius:0 var(--radius) var(--radius) 0; color:var(--text-dim); }
.doc blockquote p:last-child { margin-bottom:0; }
.doc hr { border:0; border-top:1px solid var(--border); margin:32px 0; }
.doc .tw { overflow-x:auto; margin:0 0 20px; border:1px solid var(--border); border-radius:var(--radius); }
.doc table { border-collapse:collapse; width:100%; font-size:13.5px; }
.doc th, .doc td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
.doc thead th { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-muted); font-weight:400; white-space:nowrap; }
.doc tbody td { color:var(--text-dim); }
.doc tbody tr:last-child td { border-bottom:0; }
.doc a.dead { color:var(--text-muted); cursor:not-allowed; text-decoration:line-through; }

.pager { display:flex; gap:12px; justify-content:space-between; margin-top:54px;
  padding-top:22px; border-top:1px solid var(--border); font-size:13.5px; }
.pager a { display:inline-flex; flex-direction:column; gap:2px; padding:10px 14px;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-card);
  color:var(--text); max-width:47%; }
.pager a:hover { border-color:var(--amber-dim); text-decoration:none; }
.pager span { font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-muted); }
.pager .next { margin-left:auto; text-align:right; }
.wiki-footer { margin-top:34px; padding-top:20px; border-top:1px solid var(--border);
  font-size:13px; color:var(--text-muted); }
.wiki-footer a { color:var(--text-dim); }
.wiki-footer a:hover { color:var(--amber); text-decoration:none; }

.scrim { display:none; }
@media (max-width:900px) {
  .scrim.on { display:block; position:fixed; inset:56px 0 0; background:rgba(0,0,0,.55); z-index:54; }
}

/* ── Full-text search: modal, results, match highlighting ──────────── */
.search-trigger { width:100%; display:flex; align-items:center; gap:8px; padding:8px 11px;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-input);
  color:var(--text-muted); font:inherit; font-size:13px; cursor:pointer; text-align:left;
  transition:border-color var(--transition-fast), color var(--transition-fast); }
.search-trigger:hover { border-color:var(--amber-dim); color:var(--text-dim); }
.search-trigger .kbd { margin-left:auto; font-family:var(--mono); font-size:10.5px;
  border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text-muted); }

#search-modal { position:fixed; inset:0; z-index:200; display:none; }
#search-modal.open { display:block; }
#search-modal .veil { position:absolute; inset:0; background:rgba(0,0,0,.66); backdrop-filter:blur(3px); }
#search-modal .panel { position:relative; margin:min(12vh,90px) auto 0; width:min(680px,92vw);
  background:var(--bg-panel); border:1px solid var(--border-light); border-radius:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden; }
#modal-search-input { width:100%; padding:16px 18px; border:0; border-bottom:1px solid var(--border);
  background:transparent; color:var(--text); font:inherit; font-size:16px; }
#modal-search-input:focus { outline:none; }
#modal-search-input::placeholder { color:var(--text-muted); }
#modal-search-results { max-height:min(56vh,460px); overflow-y:auto; }
.search-result-item { display:block; width:100%; padding:11px 18px; border:0; border-left:2px solid transparent;
  background:none; text-align:left; font:inherit; color:var(--text-dim); cursor:pointer;
  border-bottom:1px solid var(--border); }
.search-result-item:last-child { border-bottom:0; }
.search-result-item .where { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
.search-result-item .where b { color:var(--amber); font-weight:600; }
.search-result-item .line { font-size:13.5px; line-height:1.55; color:var(--text-dim);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.search-result-item mark { background:rgba(34,197,94,.22); color:var(--text); border-radius:3px; padding:0 2px; }
.search-result-item:hover, .search-result-item.active { background:var(--bg-hover); border-left-color:var(--amber); }
.search-result-item.active .line { color:var(--text); }
.search-foot { display:flex; gap:16px; align-items:center; padding:9px 18px; border-top:1px solid var(--border);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
.search-foot .count { margin-left:auto; }
.search-empty { padding:26px 18px; color:var(--text-muted); font-size:14px; text-align:center; }

@keyframes highlight-pulse { 0%,100% { background:rgba(34,197,94,.20); } 50% { background:rgba(34,197,94,.42); } }
mark.search-match { background:rgba(34,197,94,.20); color:inherit; border-radius:4px; padding:0 2px;
  animation:highlight-pulse 1.5s ease-in-out; }
mark.search-match.current { background:rgba(34,197,94,.45); box-shadow:0 0 0 2px rgba(34,197,94,.35); }

#clear-highlight-btn { position:fixed; right:22px; bottom:22px; z-index:70;
  display:inline-flex; align-items:center; gap:8px; padding:9px 15px;
  border:1px solid var(--border-light); border-radius:999px; background:var(--bg-panel);
  color:var(--text-dim); font:inherit; font-size:13px; cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.5); transition:opacity .3s, transform .3s; }
#clear-highlight-btn:hover { border-color:var(--amber-dim); color:var(--amber); }
#clear-highlight-btn.hidden { opacity:0; transform:translateY(10px); pointer-events:none; }
/* La fleche de retour en haut occupe deja ce coin quand la page est descendue. */
html.lr-haut-visible #clear-highlight-btn { bottom:74px; }
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation:none !important; transition-duration:.001ms !important; }
  html { scroll-behavior:auto; }
}
/* ── L'abeille de LaRuche ───────────────────────────────────────────────
   Le meme dessin que dans l'application et sur la page d'accueil. Elle se pose
   sur les titres et les blocs de code, et ne vole que par moments. */
.bee { width:51px; height:33px; position:relative; animation:bee-float .8s infinite;
  transform:translate(-50%,-50%); left:50%; top:50%;
  filter:drop-shadow(0 0 4px rgba(234,179,8,.45)); }
@keyframes bee-float { 0%,100%{top:46%} 50%{top:50%} }
.bee--wings { width:15px; height:15px; background:#fff; opacity:.8; position:absolute;
  top:-6px; left:9px; z-index:99; border-radius:50%; animation:bee-fly-lw .15s infinite; }
.bee--wings::before { content:''; position:absolute; width:15px; height:15px; background:#fff;
  opacity:.8; border-radius:50%; top:1px; left:17px; animation:bee-fly-rw .15s infinite; }
@keyframes bee-fly-lw { 0%,100%{top:-6px;left:9px} 25%{top:-9px} 50%{top:-12px;left:11px} 75%{top:-9px} }
@keyframes bee-fly-rw { 0%,100%{top:1px;left:17px} 25%{top:-1px} 50%{left:14px;top:-2px} 75%{top:-1px} }
.bee--body { position:absolute; top:0; }
.bee--body span { position:absolute; border-radius:50%; width:15px; height:15px; background:#000; }
.bee--body span:first-child::after { content:''; position:absolute; left:5px; border-radius:50%;
  width:15px; height:15px; background:#eab308; }
.bee--body span:last-child { left:9px; }
.bee--body span:last-child::after { content:''; position:absolute; left:6px; border-radius:50%;
  width:15px; height:15px; background:#eab308; }
.bee--head { width:32px; height:32px; background:#000; border-radius:50%; position:relative;
  margin-left:20px; top:-1px; z-index:99; }
.bee--head-eyes { background:#fff; width:5px; height:3px; position:absolute; top:8px; left:12px;
  border-bottom-left-radius:100%; border-bottom-right-radius:100%; }
.bee--head-eyes::before { content:''; position:absolute; top:0; left:8px; width:5px; height:3px;
  background:#fff; border-bottom-left-radius:100%; border-bottom-right-radius:100%; }
.bee--head-antennas { width:3px; height:8px; background:#000; position:absolute; left:3px; top:-4px;
  border-radius:30px; transform:rotate(-50deg); animation:bee-la .3s infinite; }
.bee--head-antennas::before { content:''; position:absolute; left:5px; top:1px; width:3px; height:10px;
  background:#000; border-radius:30px; transform:rotate(-180deg); animation:bee-ra .5s infinite; }
@keyframes bee-la { 0%,100%{transform:rotate(-50deg);left:3px} 25%{transform:rotate(-35deg);left:5px}
  50%{transform:rotate(-15deg);left:5px} 75%{transform:rotate(-35deg);left:4px} }
@keyframes bee-ra { 0%,100%{transform:rotate(-170deg);left:5px} 25%{transform:rotate(-168deg);left:5px}
  50%{transform:rotate(-165deg);left:4px} 75%{transform:rotate(-168deg);left:5px} }

.abeille-titre { position:fixed; left:0; top:0; width:51px; height:33px; margin:0;
  z-index:60; pointer-events:none; will-change:transform; }
.abeille-titre .bee { position:absolute; left:0; top:0; transform:none; animation:bee-float .8s infinite ease-in-out; }
.abeille-titre .bee > *, .abeille-titre .bee--body > span { display:block; }
@media (max-width:720px) { .abeille-titre { display:none; } }
@media (prefers-reduced-motion:reduce) { .abeille-titre, .abeille-titre .bee, .abeille-titre .bee * { animation:none !important; } }
</style>
</head>
<body>

<div id="vue" data-routeur="fragment">

<header class="topbar">
  <div class="inner">
    <button class="burger" id="burger" type="button" aria-label="Open the navigation">Menu</button>
    <a class="brand" href="index.html">
      <div class="honeycomb-loader hc-sm" aria-hidden="true">
        <div class="hexagon hx1"></div><div class="hexagon hx2"></div><div class="hexagon hx3"></div>
        <div class="hexagon hx4"></div><div class="hexagon hx5"></div><div class="hexagon hx6"></div>
        <div class="hexagon hx7"></div>
      </div>
      LaRuche <span class="tag">Wiki</span>
    </a>
    <span class="spacer"></span>
    <a class="lnk" href="index.html">Home</a>
    <a class="lnk" href="https://github.com/infinition/LaRuche">GitHub</a>
    <button class="lnk bascule-abeille" id="bascule-abeille" type="button"
            aria-pressed="true" title="Hide the bee" aria-label="Hide the bee">&#128029;</button>
  </div>
</header>

<div class="wrap">
  <aside id="side">
    <div class="search">
      <button class="search-trigger" id="open-search" type="button">
        <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.4 9.4 13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Search the wiki
        <span class="kbd">Ctrl K</span>
      </button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <article class="doc" id="doc"></article>
    <div class="pager" id="pager"></div>
    <footer class="wiki-footer"><a href="https://www.buymeacoffee.com/infinition">Support LaRuche</a></footer>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<button id="clear-highlight-btn" class="hidden" type="button">
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  Clear highlights
</button>

<div id="search-modal" role="dialog" aria-modal="true" aria-label="Search the wiki">
  <div class="veil" data-close></div>
  <div class="panel">
    <input id="modal-search-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search every page, then jump to the line">
    <div id="modal-search-results"></div>
    <div class="search-foot">
      <span>Enter to open</span><span>Up and down to move</span><span>Esc to close</span>
      <span class="count" id="search-count"></span>
    </div>
  </div>
</div>

<script>
/* WIKI-DATA:BEGIN */
var WIKI = {"sections":[{"label":"Overview","pages":[{"slug":"Home","title":"LaRuche Wiki"},{"slug":"FAQ","title":"FAQ"},{"slug":"Security","title":"Security"}]},{"label":"Getting started","pages":[{"slug":"Installation","title":"Installation"},{"slug":"Desktop-App","title":"Desktop App"},{"slug":"Quick-Start","title":"Quick Start"},{"slug":"Local-Models","title":"Local Models"}]},{"label":"Concepts","pages":[{"slug":"Architecture","title":"Architecture"},{"slug":"Butinage-Engine","title":"The Butinage Engine"},{"slug":"Cognitive-Memory","title":"Cognitive Memory"},{"slug":"LaReine","title":"LaReine"},{"slug":"Table-Ronde","title":"Table Ronde"},{"slug":"Watchers","title":"Watchers"},{"slug":"Automation","title":"Automation"},{"slug":"Skills-and-Curator","title":"Skills and the Curator"}]},{"label":"Guides","pages":[{"slug":"Computer-and-Browser","title":"Computer and Browser"},{"slug":"Chrome-Extension","title":"Chrome Extension"},{"slug":"Training-Datasets","title":"Training Datasets"},{"slug":"Voice","title":"Voice"},{"slug":"Telegram","title":"Telegram"},{"slug":"MCP","title":"MCP"},{"slug":"Secrets","title":"Secrets"},{"slug":"Troubleshooting","title":"When something does not work"}]},{"label":"Reference","pages":[{"slug":"Configuration","title":"Configuration"},{"slug":"Providers-and-Profiles","title":"Providers and profiles"},{"slug":"Tools","title":"Tools"},{"slug":"Evals","title":"Knowing whether an engine change helped"},{"slug":"Brand-Glossary","title":"Brand Glossary"}]}],"pages":{"Home":"# LaRuche Wiki\n\n**[infinition.github.io/LaRuche](https://infinition.github.io/LaRuche/)**\n\nWelcome to the hive. LaRuche is a local-first AI agent with a desktop application, a\nserver node and a lightweight LAN client. Its main systems are written in Rust: the\nagent engine, cognitive memory, automation, supervision, native computer control and\nthe Miel mesh.\n\n## Current inventory\n\n| Area | Included |\n|---|---|\n| Rust workspace | 17 packages |\n| Default node registry | 89 tools |\n| Bundled skill library | 38 skills |\n| Executables | `laruche`, `laruche-node`, `laruche-cli` |\n| Optional companions | Python voice service, Chrome extension, VS Code extension |\n| Cargo test inventory | 741 tests |\n\nPlugins and MCP servers can add tools at runtime. The Capabilities page in a running\nnode shows the effective registry after feature flags, disabled tools and extensions\nhave been applied.\n\n## Getting started\n\n- [Installation](Installation) - installers, portable builds, source and Docker\n- [Desktop App](Desktop-App) - full application, LAN client and the three executables\n- [Quick Start](Quick-Start) - first boot, onboarding, first conversations\n- [Local Models](Local-Models) - llama.cpp, Ollama, cloud providers, embeddings\n\n## Concepts\n\n- [Architecture](Architecture) - the workspace, the crates, how a request flows\n- [Butinage Engine](Butinage-Engine) - the ReAct loop and its safety rails\n- [Cognitive Memory](Cognitive-Memory) - recall, decay, supersede, hebbian ranking, git time travel\n- [LaReine](LaReine) - autonomous, hybrid and human supervision, rework, live intervention and proposal gates\n- [Table Ronde](Table-Ronde) - multi-agent debate, specialist teams, tools and arbitration\n- [Watchers](Watchers) - event reflexes with compiled rules\n- [Skills and the Curator](Skills-and-Curator) - the skill library and how it grows itself\n- [Automation](Automation) - crons, missions, kanban\n\n## Guides\n\n- [Telegram](Telegram) - connect the bot, commands, voice messages\n- [Voice](Voice) - local TTS and STT, wake word, call mode\n- [Secrets](Secrets) - the vault, substitution, output masking\n- [MCP](MCP) - LaRuche as an MCP client and as an MCP server\n- [Computer and Browser](Computer-and-Browser) - desktop control, Chrome, images and camera\n- [Chrome Extension](Chrome-Extension) - installation, visible control, recording and security\n- [Training Datasets](Training-Datasets) - SFT, DPO pairs and judge distillation from LaReine reviews\n\n## Reference\n\n- [Configuration](Configuration) - every environment variable and setting\n- [Tools](Tools) - the complete built-in tool registry\n- [Brand Glossary](Brand-Glossary) - what the French words mean\n- [Security](Security) - the threat model and the defaults\n- [FAQ](FAQ) - common questions\n\n## Where things live\n\n| Thing | Location |\n|---|---|\n| Web UI | http://localhost:8419 |\n| Desktop application | `laruche` in a portable archive, or an installed application |\n| Server | `laruche-node`, serving the UI and API on port 8419 |\n| Memory database | `memoire.db` in the hive data directory |\n| Memory time-travel repo | `memoire-okf/` (dedicated git repository) |\n| Skills | markdown files in the hive data directory, editable from the UI or on disk |\n| Roadmap | `ROADMAP.md` in the repository |\n","FAQ":"# FAQ\n\n## Does it need the cloud?\n\nNo. With llama.cpp or Ollama, a local embedding model and local speech backends, the\nengine, memory, automation and voice run on your machine. Telegram, cloud models,\nhosted search APIs and hosted speech backends are optional network services.\n\n## What hardware do I need?\n\nThe node itself is a lightweight Rust binary; the real cost is your model server. A\n7B/8B model on 8 to 12 GB of VRAM is enough for chat, watchers, and Telegram. Bigger\nmodels make longer agentic missions noticeably better. See\n[Local Models](Local-Models).\n\n## How is this different from other agent frameworks?\n\nDifferent bets. Those projects are strong at what they do; LaRuche invests in\nsubsystems that matter when an agent runs 24/7 on your own hardware:\n\n- **A Rust node with an embedded interface**, no Node.js or Python runtime for the core,\n  plus desktop and terminal entry points.\n- **A cognitive memory** with decay, supersede, hebbian ranking, and git time travel,\n  not a chat log with embeddings.\n- **A built-in supervisor** (LaReine) that judges answers against a charter, can force\n  redos, and routes self-modifications through a proposal queue.\n- **Watchers with compiled rules** that cost zero tokens until their deterministic\n  conditions pass.\n- **A two-way secrets firewall**: names in, values substituted at execution, exact\n  values masked in outputs.\n\n## Which models work best?\n\nAnything with decent instruction following. The engine's schema validation and tolerant\nparsing were built precisely so mid-size local models can do real tool work. Native\nAnthropic, Codex and OpenAI-compatible tool calling are supported. Local compatible\nservers include llama.cpp, LM Studio and vLLM.\n\n## Can I read what the agent knows?\n\nYes, all of it. `memoire.db` is plain SQLite, the Memory tab offers full CRUD, and the\nOKF export in `memoire-okf/` is markdown under git. `git log` in that folder is your\nagent's learning history.\n\n## Can I undo something it learned?\n\nYes. Facts are superseded rather than destroyed, the dream pass only ever proposes\ncleanups, and the git time travel lets you restore any earlier state of any part of the\nmap: checkout the file from the snapshot you want and re-import it.\n\n## Does the curator slow down my chats?\n\nNo. It is single-flight, has a cooldown, and yields whenever a chat or agent run is\nactive. Your live conversation always has priority on the model.\n\n## Is my API key safe if I use a cloud provider?\n\nThe key lives in the encrypted vault and is substituted into requests at execution\ntime. The model, the context, and the session files only ever see `@@KEY_NAME` or\n`[SECRET:KEY_NAME]`. See [Secrets](Secrets).\n\n## What is the license?\n\nMPL-2.0. Use it, modify it, embed it; changes to MPL-licensed files must stay open.\n\n## Why the French names?\n\nBecause it is a hive and hives deserve poetry. The [Brand Glossary](Brand-Glossary)\ntranslates everything.\n","Security":"# Security\n\nLaRuche's security model starts from an honest premise: the model will eventually do\nsomething wrong. A confused local model, a prompt injection in a fetched page, a\nhallucinated command. The defenses are structural, not prompt-based.\n\n## Network posture\n\n- **Loopback by default.** The node binds `127.0.0.1`; other machines cannot reach it\n  unless you set `LARUCHE_BIND_LAN` explicitly.\n- **Strict CORS** on the API.\n- **Auth guard** on every mutating route.\n- **Mesh is opt-in.** The Miel protocol announces nothing until you enable it, and\n  federation carries provenance tags.\n- **HTTPS available** (`LARUCHE_HTTPS` self-signed, or bring your own certificate) for\n  LAN access, required by browsers for the microphone.\n\n## Execution posture\n\n- **Approval gates.** Shell, Python, destructive file operations, and other sensitive\n  tools require a human click in a popup before running. The permission engine\n  (`laruche-permissions`) decides what is gated.\n- **Server-side validation.** Tool arguments are validated against JSON Schemas before\n  execution; watcher targets are validated for existence and well-formedness on the\n  server, not trusted from the model.\n- **Timeouts and budgets** bound what any single run can consume.\n- **Computer control stays visible.** A halo marks automated actions, held inputs are\n  released after a timeout, and `Ctrl+Alt+Shift+H` stops control immediately.\n- **Browser consent stays human.** The extension reports consent overlays but does not\n  accept them. Cookie names and sizes can be inspected; values are not returned.\n\n## How the gate actually decides\n\nThe order in `approbation.rs` is fixed, and worth knowing because a decision made early\nis never revisited:\n\n1. **A user deny rule blocks, always.** This is the hard floor. Autonomous mode does not\n   lift it, and the reason travels back to the model so it changes approach instead of\n   rephrasing the same call.\n2. **An already approved pattern runs.** That is what approving a pattern means.\n3. **The security reviewer rules**, when a verdict is available. It can allow or refuse.\n4. **Otherwise a human is asked**, whenever one is reachable. The popup refuses by\n   default after 180 seconds.\n\n`pre_tool` hooks can block before any of this. See [Configuration](Configuration).\n\n## Limits\n\nThese are the places where the model above stops holding. They are written down because\nyou need them to decide what to turn on, not because they are theoretical.\n\n- **`Auto` mode allows everything that is not explicitly denied.** Deny rules and the\n  approval popup are what the other modes rely on; `Auto` keeps only the deny rules.\n- **In an autonomous context, an unresolved call runs by default.** When no human is\n  reachable (cron, watcher, scout) and the reviewer returned no verdict, LaRuche allows\n  the call rather than stalling the run. Set `approbation_stricte` to reverse it and fail\n  closed instead.\n- **The blocked command list is a substring match, not a boundary.** Eleven patterns are\n  refused outright, `rm -rf /` and `mkfs` among them. They are matched with a lowercase\n  `contains`, so an equivalent command written differently goes straight through:\n  `Remove-Item -Recurse -Force C:\\` matches none of them. The real barrier is the\n  reviewer plus the popup. Treat the list as a guard against the obvious.\n- **Deferred execution is still execution.** `plugin_create` writes a manifest whose\n  `command` field is a shell template run later, and `mcp_add` registers a\n  `{command, args}` launched at the next start. Neither runs anything at the moment of\n  the call, which makes them look like file writes. Judge them like `shell_exec`.\n- **Browser control inherits your logged-in sessions.** That is the point of driving your\n  own Chrome, and it is also the widest surface: `eval` runs arbitrary JavaScript in the\n  page, and keystrokes go through the DevTools Input domain, so what reaches the site is\n  indistinguishable from a human typing. See [Computer and Browser](Computer-and-Browser).\n- **The sandbox is opt-in.** Tools run in the node's own process with your user's rights.\n  `ESSAIM_SANDBOX_DOCKER=1` puts shell execution in a container when Docker is present;\n  without it, execution is bare on the host.\n\n## Data posture\n\n- **Secrets never enter the context.** Names in, values substituted at execution time,\n  and exact values masked to `[SECRET:NAME]` in every tool output before it returns to\n  the loop. See [Secrets](Secrets).\n- **Sanitized rendering.** Chat output is sanitized with a vendored DOMPurify before it\n  touches the DOM, so a malicious page quoted by the agent cannot script your dashboard.\n- **No CDN.** All web assets ship inside the binary; the UI makes no third-party\n  requests.\n- **Local by default.** With a local model and local speech backends, conversation\n  content stays on the machine. Cloud model, search, speech and messaging providers\n  receive only the requests sent to those services, and keys stay in the vault.\n\n## Self-modification posture\n\nThe agent can improve itself, under review: skill proposals and memory changes can\nroute through the [LaReine](LaReine) proposal queue, pull-request style, and the\nmemory's git time travel ([Cognitive Memory](Cognitive-Memory)) makes any accepted\nchange auditable and reversible after the fact.\n\n## Reporting\n\nFound something? Please open a private security advisory on GitHub rather than a\npublic issue.\n","Brand-Glossary":"# Brand Glossary\n\nThe hive speaks French. The brand vocabulary is part of LaRuche's identity and stays\nFrench in the code, the UI, and the docs; everything else is English. Here is the\ndecoder ring.\n\n| Term | Literal meaning | In LaRuche |\n|---|---|---|\n| **LaRuche** | the hive | The project and the node itself |\n| **butinage** | bees foraging | The agentic ReAct loop, the engine |\n| **butiner** | to forage | To run an agentic mission |\n| **essaim** | swarm | The agent layer (crate `laruche-essaim`) |\n| **abeille** | bee | An agent working inside the hive |\n| **éclaireuse** | scout bee | A parallel sub-agent for research fan-out |\n| **escale** | stopover | Context compaction mid-run |\n| **boussole** | compass | The engine's planning state |\n| **jauge** | gauge | The token budget accountant |\n| **vigie** | lookout | The anti-loop sentinel, also the watchers UI |\n| **curateur** | curator | The background component that grows the skill library |\n| **LaReine** | the queen | The built-in supervisor and judge |\n| **table ronde** | round table | Structured multi-agent deliberation with an arbiter |\n| **Miel** | honey | The mesh protocol between nodes |\n| **nectar** / **Source** | nectar / source | Memory content and its store |\n\nPublic documentation says **tool** for a callable capability and **abeille** for an\nagent. Some older Rust identifiers, including `AbeilleRegistry`, predate that\ndistinction. Keep compatibility when changing code, but do not copy the old naming into\nnew UI text or documentation. The codebase and docs do not use em dashes.\n","Tools":"# Tools\n\nLaRuche registers 89 built-in tools in a default node build. `computer` and `camera`\nare present when default features are enabled. Plugins and MCP servers can add more at\nruntime. The Capabilities page shows the exact registry for the running node.\n\nA tool is a callable capability. An abeille is an agent. Older Rust type names such as\n`AbeilleRegistry` remain in the code for compatibility, but they do not define the\npublic vocabulary.\n\nTool arguments are checked against JSON Schema before execution. Disabled tools are\nblocked at dispatch, sensitive operations use the approval policy, and every result\npasses through secret masking.\n\n## Files, execution and runtime\n\n| Tool | Purpose |\n|---|---|\n| `file_read` | Read a file with bounded output. |\n| `read_extract` | Extract the relevant content from a large text or document. |\n| `file_list` | List files and directories. |\n| `file_write` | Create or replace a file, subject to approval. |\n| `file_edit` | Replace a precise block inside an existing file. |\n| `file_search` | Search names and file content. |\n| `shell_exec` | Run a shell command with live, bounded output. |\n| `execute_code` | Run a Python snippet with a timeout. |\n| `todo` | Maintain the current run's task list. |\n| `math_eval` | Evaluate a mathematical expression. |\n| `lsp` | Query a language server for symbols, definitions and diagnostics. |\n| `task_complete` | Mark a long-running task as complete. |\n| `system_info` | Read node, operating system and resource information. |\n\n## Web, browser and media\n\n| Tool | Purpose |\n|---|---|\n| `web_search` | Search through configured providers or free fallbacks. |\n| `web_fetch` | Fetch pages and PDFs with pagination, structured data, `focus` and `probe`. |\n| `web_deep_search` | Run bounded parallel research with scout agents. |\n| `web_discover` | Enumerate hidden site surfaces through links, sitemaps and certificate logs. |\n| `image_search` | Search for images. |\n| `media_present` | Present image, audio or video output in the conversation. |\n| `browser` | Control a persistent browser session through the DOM and Chrome DevTools Protocol. |\n| `computer` | Control desktop applications through accessibility refs or screen coordinates. |\n| `camera` | List cameras or capture one still frame. |\n| `file_watch` | Check whether a file changed after a given timestamp. |\n\n### `browser`\n\n`browser` keeps one session open across calls. It has four connection modes:\n\n| Mode | Behavior |\n|---|---|\n| `auto` | Use the Chrome extension when connected, otherwise launch a managed browser. |\n| `extension` | Require the user's current Chrome, open tabs and signed-in sessions. |\n| `launch` | Start a browser with LaRuche's persistent profile. |\n| `attach` | Connect to an existing remote-debugging port. |\n\nIts actions are:\n\n`navigate`, `read`, `find`, `overlays`, `click`, `right_click`, `double_click`,\n`middle_click`, `drag`, `fill`, `upload`, `key`, `hover`, `scroll`, `wait`, `eval`,\n`screenshot`, `console`, `network`, `back`, `forward`, `cookies`, `download`, `tabs`,\n`open_tab`, `select`, `resize`, `dialog` and `close`.\n\n`read` returns page text and numbered element refs. `find` limits that map to matching\ncontent. `overlays` identifies what covers the page, including consent banners and\nmodal walls. The tool crosses same-origin frames and shadow DOM, handles real mouse\nevents, waits on text or selectors, manages tabs and dialogs, inspects console and\nnetwork logs, and emulates mobile or tablet viewports with touch input.\n\nCookie names and sizes can be inspected, never values. Consent is never accepted\nautomatically. A visible amber frame, action panel and animated cursor can be disabled\nfor clean screenshots or faster runs.\n\n### Chrome extension\n\nThe dedicated Manifest V3 extension is in `extension-chrome/`. See\n[Chrome Extension](Chrome-Extension) for installation and the full security model. It connects to\n`/ws/navigateur` on the local node and gives `browser` access to the Chrome instance the\nuser already has open. This preserves active tabs and authenticated sessions without\ncopying cookies into LaRuche.\n\nThe extension also supports explicit page or note capture into cognitive memory,\ndownloads, tab capture, desktop capture and showcase recording. It does not send data\nto a third-party service. Keep it disabled when the node is not running because its\nbridge is intentionally local and trusts the configured node port.\n\n### `computer`\n\n`computer` is the native desktop tool. Its actions are:\n\n`windows`, `focus_window`, `read`, `find`, `focus`, `screens`, `screenshot`,\n`cursor_position`, `mouse_move`, `left_click`, `right_click`, `middle_click`,\n`double_click`, `triple_click`, `left_click_drag`, `mouse_down`, `mouse_up`, `scroll`,\n`fill`, `type`, `key`, `key_down`, `key_up`, `release_all`, `wait`, `read_clipboard`,\n`write_clipboard`, `move_window`, `minimize_window`, `maximize_window`,\n`restore_window` and `close_window`.\n\nOn Windows, `read` uses UI Automation and returns numbered refs for controls. This is\nthe preferred path because it does not require vision or screen coordinates. Pixel\ncontrol remains available for canvas, games and applications without useful\naccessibility metadata. Multi-monitor coordinates, mixed DPI, minimized windows and\nelevated applications are handled explicitly.\n\nLaRuche refuses to control its own windows. A halo shows active control, human pointer\nmovement interrupts an automated sequence, held inputs are released after a timeout,\nand `Ctrl+Alt+Shift+H` is the global stop shortcut.\n\n### `camera`\n\n`camera` has two actions: `list` and `capture`. A capture returns one still frame and\nimmediately releases the device. There is no continuous camera mode and no video\nrecording. Each capture requires approval.\n\n## Git and workspaces\n\n| Tool | Purpose |\n|---|---|\n| `git_status` | Read repository status. |\n| `git_diff` | Read a bounded diff and summary. |\n| `git_log` | Read commit history. |\n| `git_commit` | Stage and commit selected work. |\n| `git_worktree_enter` | Create or enter an isolated git worktree. |\n| `git_worktree_exit` | Leave and clean up the active task worktree. |\n\n## Cognitive memory and skills\n\n| Tool | Purpose |\n|---|---|\n| `memory_search` | Run hybrid semantic and full-text recall. |\n| `memory_write` | Add a fact to cognitive memory. |\n| `memory_update_item` | Update a memory item. |\n| `memory_delete` | Delete a memory item. |\n| `memory_move_item` | Move an item to another node. |\n| `memory_review` | Review pending memory changes. |\n| `memory_list_proposed` | List proposed items. |\n| `memory_stats` | Read memory statistics. |\n| `memory_mutations` | Read the mutation history. |\n| `memory_tree` | Browse the node tree. |\n| `memory_read_node` | Read one node and its items. |\n| `memory_grep` | Search raw memory content. |\n| `memory_doctor` | Diagnose memory structure and indexes. |\n| `memory_delete_node` | Delete a node. |\n| `memory_create_node` | Create a node. |\n| `memory_update_node` | Rename or update a node. |\n| `memory_suggest_nodes` | Suggest destinations for uncategorized items. |\n| `memory_consolidate` | Merge related items with model-assisted review. |\n| `skill_list` | List skills stored in cognitive memory. |\n| `skill_view` | Read one skill. |\n| `skill_create` | Propose or create a skill. |\n| `skill_patch` | Update a skill. |\n| `skill_delete` | Delete a skill. |\n\n## Automation, channels and history\n\n| Tool | Purpose |\n|---|---|\n| `cron_create` | Create or update a scheduled prompt. |\n| `cron_list` | List scheduled prompts and mission schedules. |\n| `cron_delete` | Delete a cron. |\n| `mission_create` | Create a persistent long-running goal. |\n| `mission_list` | List missions. |\n| `mission_delete` | Delete a mission. |\n| `run_now` | Force an eligible scheduled item to run now. |\n| `watcher_create` | Create a watcher with a validated compiled rule. |\n| `watcher_list` | List watchers and their state. |\n| `watcher_delete` | Delete a watcher. |\n| `kanban_create` | Add a kanban task. |\n| `kanban_list` | List kanban tasks. |\n| `calendar_add` | Add a calendar event. |\n| `calendar_list` | List calendar events. |\n| `mesh_send` | Send a message to another hive. |\n| `session_search` | Search saved conversations. |\n\n## Run control and agent coordination\n\n| Tool | Purpose |\n|---|---|\n| `run_script` | Execute an approved sequence of registered tool calls. |\n| `tool_search` | Search the live registry for a tool. |\n| `tool_call` | Call a tool by name through the normal dispatcher. |\n| `delegate` | Send a bounded subtask to a scout agent. |\n| `mixture_of_agents` | Ask several model profiles and combine their answers. |\n| `spawn_specialist` | Start a named specialist agent. |\n| `clarify` | Ask the user a question during a run. |\n| `research_mode` | Declare deep-research mode to the engine. |\n| `plan_mode` | Create or update long-run planning state. |\n| `finding` | Record a verified finding in the run ledger. |\n\nThe [Table Ronde](Table-Ronde) uses the same model profiles and a mission-specific\nwhitelist of registered tools through dedicated API routes. It adds a constitution,\nspecialist pool, live rounds, disagreement tracking, arbitration and debate history. It\nis an interface-level workflow, not one extra tool name in the default registry.\n\n## Skills, plugins and MCP management\n\n| Tool | Purpose |\n|---|---|\n| `skill_file_write` | Write a supporting file inside a skill. |\n| `skill_file_read` | Read a supporting skill file. |\n| `skill_file_delete` | Delete a supporting skill file. |\n| `skill_file_list` | List files belonging to a skill. |\n| `plugin_create` | Create a JSON tool plugin. |\n| `plugin_list` | List installed plugins. |\n| `plugin_delete` | Delete a plugin and remove its tools. |\n| `reload_plugins` | Reload tool plugins from disk. |\n| `mcp_add` | Add an external MCP server. |\n| `mcp_remove` | Remove an MCP server. |\n| `mcp_list` | List configured MCP servers. |\n\nTools provided by connected MCP servers join the registry dynamically and therefore do\nnot appear in the fixed list above. MCP resources are available through dynamically\nregistered resource tools when a server exposes them.\n","Evals":"# Knowing whether an engine change helped\n\nPrompts and loops are the easiest part of an agent to change and the hardest part to\njudge. A new system prompt always looks better on the three examples you happen to try,\nbecause those are the examples you had in mind while writing it. Two weeks later nobody\ncan say whether the engine got better or whether the person judging it got used to it.\n\n`laruche-evals` exists so that this question has an answer. It replays a fixed set of\nmissions against the real butinage engine, with the real provider and the real tools,\nand judges each run against hard checks. No model rates the output prose. The verdict\nis mechanical, and therefore comparable across weeks.\n\n## What it runs\n\nThe mission set lives in `laruche/evals/missions.json`. Each entry is a mission\nstatement plus the expectations that a correct run must satisfy. Missions are\ndeliberately ordinary: they exercise the loop, not the corner cases. The point is\nregression, not benchmarking.\n\n```bash\ncargo run -p laruche-evals -- --missions evals/missions.json\n```\n\nUseful flags:\n\n| Flag | Effect |\n|---|---|\n| `--only <substring>` | Run the missions whose id contains this |\n| `--repeat N` | Run each mission N times, to see variance rather than one draw |\n| `--judge` | Add a model-based judgement on top of the hard checks |\n| `--save-baseline` | Record this run as the reference for later comparisons |\n\nThe provider comes from the environment: `RUCHE_PROVIDER`, `RUCHE_MODEL`,\n`RUCHE_API_KEY`, `RUCHE_API_BASE`, `OLLAMA_URL`, `RUCHE_CONTEXT_MAX`, `RUCHE_AUX_MODEL`.\nPoint it at whatever you actually ship on.\n\n## What it checks\n\nThese are the checks that catch real regressions, in the order they usually fire:\n\n- **Terminal reason.** How the run ended: an answer, a clarification, a reported\n  blocker, a sterile loop, an exhausted budget. A change that turns answers into\n  budget exhaustion is a regression even if every answer it still produces is good.\n- **Mission mode.** The run must stay in the mode it was given. An engine that quietly\n  promotes a question into a full mission burns money nobody approved.\n- **Web effort.** How much of the run went to the outside world. Both directions matter:\n  a research mission that never searched, and a trivial question that searched nine\n  times.\n- **Scout fan-out.** How many parallel explorations were opened.\n- **Pass count.** The number of loop iterations. This is the first number that moves\n  when a prompt change makes the model less decisive.\n- **Files produced.** For missions whose deliverable is a file, the file must exist and\n  be non-empty.\n- **Forbidden resignation phrasing.** A run that ends with \"I cannot help with that\" or\n  its many variants fails, even when it terminated cleanly. An agent that gives up\n  politely is not an agent that succeeded, and this is exactly the failure that reads\n  as success in a transcript.\n\n## Reading the result\n\nThe harness prints a markdown table, writes the runs as JSONL, and diffs against the\nsaved baseline. The diff is the part that matters: a table on its own tells you how\ntoday went, the diff tells you what your change did.\n\nThree readings, and only three:\n\n- **No movement.** Your change is neutral on this mission set. That is a real result,\n  and usually the honest one for a prompt tweak.\n- **A check flips.** Something got better or worse in a way you can name. Follow the\n  check, not the totals.\n- **Pass count or web effort drifts without any check flipping.** The cheapest kind of\n  regression, and the one that never gets noticed without measurement: same answers,\n  more money.\n\nVariance is real. A single run of a single mission proves nothing on a temperature above\nzero. Use `--repeat` before concluding anything from a small difference, and re-baseline\ndeliberately rather than after every green run.\n\n## When to reach for it\n\nAny change to the loop, the system prompts, the tool descriptions, the compaction, the\nbudgets or the supervision. Those are the places where an improvement and a regression\nlook identical from the outside, which is the whole reason this harness exists.\n\nNot needed for a UI change, a new tool, or a bug fix with a unit test. Those have\ncheaper ways to be verified, and the eval run costs real provider tokens.\n\nThe harness is excluded from the default build: `cargo build` at the workspace root does\nnot compile it. It runs when you ask for it.\n","Configuration":"# Configuration\n\nTwo layers: supported environment variables set at launch, and the Settings UI for\neverything that can change live. Internal diagnostics and test-only variables are not\npart of this user-facing reference.\n\n## Environment variables\n\n### Core\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_PORT` | `8419` | Web UI and API port |\n| `LARUCHE_DATA_DIR` | OS user data directory | Hive home for memory, sessions, skills and configuration |\n| `LARUCHE_MEMOIRE_BACKEND` | `sqlite` | Memory backend: `sqlite`, `native`, `sidecar` |\n| `LARUCHE_BIND_LAN` | off | Bind beyond loopback. Off means the node is unreachable from other machines. |\n| `LARUCHE_NO_BROWSER` | off | Do not open the system browser when the node starts |\n\n### Desktop application\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_URL` | `http://127.0.0.1:8419` | Explicit node for the desktop application |\n| `LARUCHE_SANS_NOEUD` | off | Client-only mode. Never start or locate a local node. |\n| `LARUCHE_DECOUVRIR` | off | Print hives found over mDNS and exit without opening a window. |\n\n### TLS\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_HTTPS` | off | Serve HTTPS with a self-signed certificate (needed for the microphone from other devices) |\n| `LARUCHE_TLS_CERT` / `LARUCHE_TLS_KEY` | none | Use your own certificate and key |\n\n### Memory\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_EMBED_URL` | local Ollama | Embedding endpoint for semantic recall |\n| `LARUCHE_EMBED_MODEL` | `nomic-embed-text` | Embedding model |\n| `LARUCHE_OKF_GIT_SECS` | `1800` | Interval for git time-travel snapshots of the memory, `0` disables |\n| `LARUCHE_MEMOIRE_ARBITRE` | on | Set to `0` to disable the LLM contradiction arbiter |\n| `LARUCHE_TRASH_TTL_SECS` | built-in default | Retention for automatically purged memory trash |\n\n### Web search\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_TAVILY_KEY` | none | Tavily API key |\n| `LARUCHE_BRAVE_KEY` | none | Brave Search API key |\n| `LARUCHE_SEARXNG_URL` | none | A SearXNG instance |\n\nWith none set, the search tools fall back to free scrapers. A key improves reliability.\n\n### Background components\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_CURATEUR_COOLDOWN_SECS` | `600` | Minimum delay between curator passes |\n| `LARUCHE_REINE_BUDGET_SECS` | set in Settings | Time cap for LaReine judging and redo loops |\n| `LARUCHE_DREAM_INTERVAL_SECS` | built-in default | Interval between memory dream passes |\n\n### Providers\n\nThe preferred path is a profile in Settings. Environment variables remain useful for\nheadless deployments:\n\n| Variable | Purpose |\n|---|---|\n| `LARUCHE_PROVIDER` | Provider family |\n| `LARUCHE_MODEL` | Default model |\n| `LARUCHE_API_KEY` | Provider key |\n| `LARUCHE_API_BASE` | Provider endpoint |\n| `LARUCHE_OLLAMA_URL` | Ollama endpoint |\n| `LARUCHE_OPENAI_ENDPOINTS` | Additional OpenAI-compatible endpoints |\n| `LARUCHE_VISION` | `0` never sends images to the model, `1` sends them even after a provider refused |\n\nSee [Providers and profiles](Providers-and-Profiles) for what a profile actually is, why\nthe active model is a pair rather than a name, and how a peer hive becomes a provider.\n\n## Settings UI\n\nAll live, no restart:\n\n- **General**: generation parameters (max passes, temperature, max tokens, dynamic tool\n  limit), context and compaction thresholds, curator and agent reactions.\n- **Providers**: model endpoints, context sizes, per-channel model assignment.\n- **LaReine**: Autonomous, Hybrid and Human in the loop modes, response and live-task\n  supervision, judge provider, context window, rework limit, confidence threshold,\n  proposal queue, scorecards, training capture and SFT, DPO or judge exports. See the\n  [LaReine guide](LaReine) for the exact mode and tier behavior.\n- **Secrets**: the vault ([Secrets](Secrets)).\n- **MCP**: external servers ([MCP](MCP)).\n- **Channels**: Telegram, Discord, Slack tokens and options.\n- **Voice**: backends, voice, wake word ([Voice](Voice)).\n- **Tools and permissions**: approval mode, disabled tools, dynamic selection and the\n  visible computer-control halo.\n- **Help**: the installed version, the Miel protocol version, an update check against\n  the published releases, and links to the wiki and the repository.\n\n## System prompts\n\nThe agent's system prompts are memory entries (`system.*`): identity, behavior,\nplanning, curator, consolidation. Edit them in the Memory tab; restore-to-default is\none click. See [Cognitive Memory](Cognitive-Memory).\n","Providers-and-Profiles":"# Providers and profiles\n\nMost confusion about \"which model am I actually talking to\" comes from one idea that is\nnever stated: **the active model is a pair, not a name**. A model name alone means\nnothing, because the same name can be served by your machine, by a hosted API and by\nanother hive on your network, with different keys and different limits.\n\nThat pair is a **profile** plus a **model**.\n\n## What a profile is\n\nA profile is one endpoint you can reach, described once. It lives in\n`provider-profiles.json` next to the rest of your configuration, and it holds:\n\n| Field | Meaning |\n|---|---|\n| `provider` | The dialect to speak: `openai`, `anthropic`, `ollama`, `codex`, `miel` |\n| `base_url` | Where to send the request |\n| `api_key` | The key, or a vault reference like `${DEEPSEEK}` |\n| `models` | The model names this endpoint serves |\n| `max_context_length` | The window, used for the context gauge |\n| `visibility` | Whether other hives may use this profile through the mesh |\n\nTwo profiles can serve a model with the same name. That is not a conflict, it is the\nnormal case: `llama3.2` on your machine and `llama3.2` on the workstation in the other\nroom are two different things, and the pair is what tells them apart.\n\nThe key deserves its own note. Store it as a vault reference rather than a literal, and\nthe value never sits in plain text in the configuration file. Substitution happens at\nthe moment the request is built, at one single point that every provider call goes\nthrough. See [Secrets](Secrets).\n\n## Where the active pair is used\n\nThe pair chosen in the status bar is the default for the chat and for anything that does\nnot override it. Several things override it, deliberately:\n\n- **A kanban task** can carry its own profile and model, set when the task is created.\n- **A cron or a mission** can pin a model, so a scheduled job does not silently change\n  behaviour when you switch the model you are chatting with.\n- **A specialist at the round table** can be given its own profile. This is the most\n  important override in the whole system, and it has its own reason: see\n  [Table-Ronde](Table-Ronde).\n- **Auxiliary runs** (the curator, the scouts) use the lighter model configured for\n  them, not the main one.\n\n## A hive as a provider\n\nEvery LaRuche node exposes an OpenAI-compatible endpoint, so another hive on the network\nis reachable exactly like any hosted API. A profile of provider type `miel`, or a model\naddressed as `peer:<host>:<port>`, points at that hive.\n\nOne behaviour is worth knowing before you rely on it. If the peer does not answer, the\ncall falls back to the local provider rather than failing: a hive is a machine that can\nbe asleep, unplugged or rebooting, and a scheduled task must not die because the box\nnext door went off. **The fallback is announced in the response.** Silently substituting\na model is worse than a clean failure, because the answer then gets attributed to the\nwrong model.\n\n## Vision is a property of the endpoint, not of the model\n\nA model's datasheet can say it accepts images while the endpoint you actually call\nrefuses them, or accepts them only on a different model id. Observed on a provider that\ndocuments 32 MiB per image and rejects a 200 KB screenshot on its non-vision id.\n\nSo LaRuche does not guess from the name. Images are sent, and if the provider refuses,\nthe refusal is read: an explicit \"this model does not support image\" drops images for\nthat model, while a vaguer complaint about `image_url` first retries with a smaller\nimage, because an undocumented size limit explains the same error. The model gets its\nchance back after ten minutes rather than being written off for the session. Set\n`LARUCHE_VISION=0` to stop sending images entirely, or `=1` to force them.\n\nImages are resized before sending, to 1280 px on the long side and about 150 KB. Very\nlittle is lost by this: vision models tile an image into patches of a few hundred pixels\nand never see the full resolution, and some providers bill a flat token count per image\nwhatever its size. The number 150 KB is not derived from any published limit, because\npublished limits turned out not to predict what endpoints accept. It sits below the\nlargest image observed to go through.\n\n## Practical notes\n\n- **An empty key field means unchanged.** The API never returns a key in clear, so the\n  Settings form cannot show it back and posts it empty when you have not touched it.\n  Saving a profile to add a model therefore keeps the key it already had.\n- **A model that vanishes from the list** usually means its endpoint stopped answering.\n  The status bar rescans every few seconds, and the entry at the bottom of the model\n  menu forces a scan immediately.\n- **Changing the active pair is live.** No restart, and the running engine follows.\n","Voice":"# Voice\n\nLaRuche can speak and listen through local or remote speech backends. Whisper provides\nthe optional local transcription service. Synthesis can stay local with Kokoro,\nVoicebox or Voxtral, use the operating system, or call a service that exposes the\nOpenAI speech format.\n\n## What it feels like\n\n- **Streamed speech**: the reply starts being spoken at the first complete sentence,\n  while the model is still generating the rest. No wait-for-the-full-answer pause.\n- **Call mode**: a full-screen call UI in the web app for hands-free back-and-forth.\n- **Barge-in**: interrupt the hive mid-sentence by speaking; it stops and listens.\n- **Wake word**: hands-free activation when enabled.\n- **Telegram voice notes**: send one, get transcribed and answered; replies can come\n  back as audio.\n\n## Backends\n\n| Component | Local options | Other options |\n|---|---|---|\n| TTS | Kokoro, Voicebox, Voxtral, pyttsx3 | Edge TTS or any OpenAI-compatible speech endpoint |\n| STT | Whisper sidecar | Native transcription from a multimodal model |\n\nVoicebox can use a cloned voice profile. Backend choice, voice, speed, external STT\npreference and Telegram voice replies persist across restarts.\n\n## Setup\n\n1. Install and start the optional Python service from `laruche/laruche-voix` when using\n   Whisper or a bundled TTS backend.\n2. Open **Settings > Voice** and select the backend, voice and speed. Status indicators\n   probe the configured service.\n3. Test from the microphone button in chat or the call screen.\n\n## Microphone from another device\n\nBrowsers only expose the microphone on secure origins. On `localhost` you are fine; to\ntalk to the hive from your phone or another machine on the LAN, enable HTTPS:\n\n| Variable | Effect |\n|---|---|\n| `LARUCHE_HTTPS` | Serve with a self-signed certificate |\n| `LARUCHE_TLS_CERT` / `LARUCHE_TLS_KEY` | Use your own certificate instead |\n| `LARUCHE_BIND_LAN` | Required to expose the node beyond loopback at all |\n\nAccept the self-signed certificate once on the device and the call screen works from\nanywhere in the house.\n","Telegram":"# Telegram\n\nTelegram is LaRuche's most mature remote channel: full agent runs from your phone,\npersistent per-channel memory, voice messages in both directions, and notifications\nfrom crons and watchers.\n\n## Setup\n\n1. Create a bot with [@BotFather](https://t.me/BotFather) and copy the token.\n2. In **Settings > Channels**, paste the token and enable Telegram. No restart needed.\n3. Message your bot. The first chat can be bound as home with `/sethome`, so crons and\n   watchers know where to notify you.\n\nStore the token as a secret (see [Secrets](Secrets)) rather than pasting it into chats.\n\n## What works\n\n- **Full agentic runs**: the same engine as the web UI, tools included. Ask for\n  research, file checks, scheduled jobs, from the phone.\n- **Per-channel memory**: the Telegram channel has its own persistent conversation\n  identity, distinct from your web sessions.\n- **Voice both ways**: send a voice message, it is transcribed locally (Whisper) and\n  answered; the answer can come back as synthesized speech (see [Voice](Voice)).\n- **Notifications**: crons and watchers deliver to your home chat, respecting\n  night-silence windows if the watcher's rules include one.\n- **Per-channel model**: assign a smaller, faster model to Telegram in Settings if you\n  want snappier phone replies.\n\n## Commands\n\n| Command | Effect |\n|---|---|\n| `/help` | List commands |\n| `/status` | Node status |\n| `/crons` | List scheduled jobs |\n| `/delcron <name|all>` | Remove a cron |\n| `/sethome` | Bind this chat as the notification home |\n| `/clear` | Clear the channel conversation |\n\n## Discord and Slack\n\nBoth are wired in the channels layer with the same per-channel memory model. Telegram\nis the reference implementation and the most battle-tested.\n","Troubleshooting":"# When something does not work\n\nSymptoms first. Each one below has been seen, and the cause is rarely where the message\npoints.\n\n## The agent says it cannot see an image\n\nThe picture is displayed next to the message, so it clearly arrived. What failed is the\nleg between LaRuche and the provider.\n\nThree causes, in order of likelihood:\n\n- **The model id has no vision, even though the family does.** Providers often ship\n  vision as a separate id. Check the exact id in the status bar against the provider's\n  own list.\n- **The provider refused the image and LaRuche stopped sending them.** A status line in\n  the chat says so, with the refusal text. The model gets another chance after ten\n  minutes, or immediately after a restart.\n- **The image was too large for the endpoint.** Documented limits and enforced limits\n  differ. LaRuche already resizes to 1280 px and about 150 KB, and shrinks further after\n  a first refusal.\n\n`LARUCHE_VISION=1` forces images through if you believe a refusal was misread.\n\n## A tool screenshot is described wrongly, or not at all\n\nTool captures (`browser`, `computer`, `camera`) travel to the model as a user message\nplaced after the tool observation. Only the last three images of a conversation are\nre-sent: a browser run takes one capture per step, and re-sending twenty of them at\nevery iteration costs a fortune for images the model already used. Older ones leave a\nline saying they existed, so the model does not describe what it no longer has.\n\nIf the model is describing the page correctly without seeing it, that is expected: the\naccessibility tree carries the text, and it is usually the better source.\n\n## The build fails with \"access denied\" on the executable\n\nThe application is running and holds its own binary. Close LaRuche and build again. On\nWindows an open Explorer window on `target/release` can hold it too.\n\n## A provider profile lost its key\n\nFixed, but if you are on an older build: saving a profile posted an empty key field and\nthe empty value overwrote the stored key. Re-enter the key once. Current builds treat an\nempty field as unchanged.\n\n## A kanban task never runs\n\nIt is waiting in Triage or Todo, and that is by design. **Only the Ready column is\npicked up.** Drag the task into Ready and it starts within the poll interval, five\nseconds by default, adjustable in the Kanban tab. Without that gate, the dispatcher\nwould empty the whole board a few seconds after the agent filled it.\n\n## Nothing happens when I click a link in the desktop application\n\nFixed in current builds. `target=\"_blank\"` does nothing in a webview: there is no tab to\nopen and no browser around it. Links are now handed to the system browser through the\nnode. If you are on an older build, copy the address instead.\n\n## The context gauge shows numbers that do not match what I am looking at\n\nThe gauge is shared between the chat and the round table because they live in the same\npage. On the round table it now shows the debate's own token consumption against the\nengine budget, which is a per-debate ceiling and not a context window. If the two ever\ndisagree again, trust the tab you are on.\n\n## The microphone transcribes the assistant's own voice\n\nSpeech recognition opens its own microphone and cannot apply echo cancellation to what\nthe speakers are playing. LaRuche only opens it once the voice has really finished,\ncounting queued sentences and in-flight requests, not just audible sound, and after a\nshort silence. Interruption is detected on a separate echo-cancelled stream.\n\nA headset removes the problem entirely and costs nothing.\n\n## The agent stops after a few passes\n\nLook at the terminal reason rather than the last message. A sterile loop, an exhausted\ntoken budget and a clean answer all end the run, and they mean different things. The\npass ceiling and the budgets are in Settings, under generation.\n\n## A model disappeared from the list\n\nIts endpoint stopped answering. The list rescans every few seconds; the entry at the\nbottom of the model menu forces a scan immediately. A local server that has just started\nappears within one cycle.\n\n## A peer hive answers with the wrong model\n\nIt did not answer at all. An unreachable peer falls back to the local provider so a\nscheduled task survives a machine being asleep, and the fallback is stated in the\nresponse. If it happens constantly, the usual cause is a hive listening only on\n`127.0.0.1`: it must be started with `LARUCHE_BIND_LAN=1` to accept connections from the\nnetwork.\n\n## Where to look next\n\n- The **Console** panel in the dashboard carries client-side errors and the reason a\n  fallback was taken.\n- The **Feed** carries the structured event stream: tool calls, approvals, memory\n  writes.\n- A refused provider request is dumped to a temporary file whose path appears in the\n  error message. That file is the exact body that was sent, which settles most\n  arguments about who is at fault.\n","Training-Datasets":"# Training Datasets\n\nLaRuche can turn completed LaReine reviews into training data. This is more useful than\na plain conversation export because a supervised review can preserve four related\nobjects at once: the request, the first draft, the answer eventually released and the\njudge's explanation.\n\nCapture is off by default. It starts only after an administrator enables **Collect\nreviews as training data** in **Settings > LaReine** and saves the configuration. It is\nnot retroactive.\n\n## What one review records\n\nEach completed review appends one JSON object to\n`evals/reine-dataset.jsonl` inside the hive data directory.\n\n| Field | Content |\n|---|---|\n| `ts` | UTC capture time |\n| `mode` | LaReine mode used for the review |\n| `rounds` | Number of review rounds |\n| `paire_preference` | Whether the record contains a genuine rejected and chosen pair |\n| `prompt` | User request |\n| `rejected` | Initial draft reviewed by LaReine |\n| `chosen` | Best answer released after review |\n| `critique` | Concrete correction instructions returned to the worker |\n| `reasoning` | Judge analysis |\n| `scores` | Relevance, methodology, objective, brand and confidence scores |\n| `avis` | `approve`, `revise` or `escalate` |\n\nThe raw journal is intentionally richer than any one trainer format. Keep it as the\nsource dataset and derive narrower exports from it.\n\n## Three export formats\n\nThe LaReine settings page provides three download buttons. The endpoint is also\navailable to an authenticated administrator at\n`GET /api/reine/dataset?format=sft|dpo|judge`.\n\n### SFT\n\nSFT exports every valid request and accepted answer using the common chat format:\n\n```json\n{\"messages\":[{\"role\":\"user\",\"content\":\"...\"},{\"role\":\"assistant\",\"content\":\"...\"}]}\n```\n\nUse it to fine-tune a model toward the answers LaReine allowed through. A review does\nnot need a rejected draft to become an SFT example.\n\n### DPO preference pairs\n\nDPO exports only reviews that produced a real revision:\n\n```json\n{\"prompt\":\"...\",\"chosen\":\"...\",\"rejected\":\"...\"}\n```\n\nThe rejected and chosen answers come from the same request. Records where LaReine\naccepted the first draft, or where both answers are identical, are excluded. This shape\ncan feed preference-training pipelines such as DPO or ORPO after any adapter-specific\nconversion required by the trainer.\n\n### Judge distillation\n\nThe judge export turns the request and reviewed draft into a user message. LaReine's\nverdict, scores, reasoning and critique become the assistant message:\n\n```json\n{\"messages\":[{\"role\":\"user\",\"content\":\"Request:\\n...\\n\\nDraft answer:\\n...\"},{\"role\":\"assistant\",\"content\":\"verdict: revise\\nscores: ...\\n...\"}]}\n```\n\nThis format is designed to distil LaReine's reviewing behavior into a smaller model.\nThat smaller model can then score drafts without paying the latency and cost of the\nlarger judge on every turn.\n\n## A practical collection workflow\n\n1. Run the worker model you want to improve.\n2. Configure LaReine with a stronger and, when possible, different model profile.\n3. Enable dataset capture and let normal reviewed work accumulate.\n4. Inspect the raw JSONL regularly. Remove private, low-value, ambiguous and duplicate\n   examples.\n5. Export the format that matches the training objective.\n6. Create train and validation splits outside LaRuche.\n7. Evaluate the resulting model on held-out tasks before replacing the current model.\n\nThe relationship between worker and judge matters. Training a model on judgments from\na model with the same weaknesses can reinforce those weaknesses. The cleanest signal\nusually comes from a judge that is stronger than the target model.\n\n## Security and data quality\n\nEvery text field passes through LaRuche's secret masker before it is written. Exact\nvalues stored in the vault are replaced with `[SECRET:NAME]`. The export endpoint is\nrestricted to administrators.\n\nThis is not a complete privacy scrub. Personal data, proprietary text, copyrighted\nmaterial, transformed secrets and sensitive tool output can still be present. Review\nthe JSONL before copying it to another machine or uploading it to a training service.\n\nLaRuche does not deduplicate, balance, tokenize or split the dataset. It also does not\ntrain a model itself. It captures high-value supervision events and converts them into\nportable JSONL; dataset curation and training remain explicit downstream steps.\n\n## Files and naming\n\n- Raw capture: `evals/reine-dataset.jsonl`\n- Numeric quality journal: `evals/reine-scorecards.jsonl`\n- SFT download: `laruche-sft-N.jsonl`\n- Preference download: `laruche-dpo-N.jsonl`\n- Judge download: `laruche-judge-N.jsonl`\n\n`N` is the number of exported records after format-specific filtering. The scorecard\njournal is useful for trends and model comparisons, but it does not contain enough text\nto train a model.\n","Computer-and-Browser":"# Computer and Browser\n\nLaRuche can act on the desktop, the user's Chrome session and visual inputs. These are\nseparate capabilities with separate boundaries.\n\nThese are also the tools that reach furthest outside the agent loop. Read the\n[limits of the approval gate](Security#limits) before enabling autonomous runs that can\nuse them.\n\n## Native computer control\n\nThe `computer` tool is implemented in Rust. It can:\n\n- capture one monitor, every monitor, or a named window;\n- inspect the Windows UI Automation accessibility tree and address elements by ref;\n- move, resize, minimize, maximize, restore and close windows;\n- click, double-click, right-click, drag, scroll and hold mouse buttons;\n- type text, press shortcuts and read or write the text clipboard;\n- find an element, wait for a state and release any held input.\n\nA visible halo marks automated actions. LaRuche reports when Windows elevation blocks\ninput instead of pretending the action succeeded. `Ctrl+Alt+Shift+H` is checked during\ninput and stops control immediately. Held buttons and keys are also released\nautomatically after a timeout.\n\nThe tool is included in default desktop builds. Headless builds can omit GUI control\nwith `--no-default-features`.\n\n## Chrome extension\n\nThe extension in `extension-chrome/` connects the node to Chrome over a local WebSocket.\nThis uses the browser and sessions the user already has open instead of launching a\ntemporary profile.\n\nThe `browser` tool can read the page, including same-origin frames and shadow DOM,\nidentify overlays, click with real mouse events, fill forms, upload and download files,\nmanage tabs, inspect cookie names and sizes, answer JavaScript dialogs and resize the\nviewport with touch emulation.\n\nConsent banners are identified but never accepted on the user's behalf. Cookie values\nare not returned to the model.\n\nThe extension can also save the current page or a note into cognitive memory and record\na browser showcase when explicitly started by the user.\n\n## Images and camera\n\nChat accepts images through the file picker, paste and drag-and-drop. Screenshots\nreturned by tools and frames captured by the `camera` tool follow the same multimodal\npath to a vision-capable model.\n\nPNG and JPEG inputs are resized before they exceed provider request limits. Recent\nimages remain available on later turns so a follow-up question can still refer to what\nwas shown.\n\nCamera support is compiled by default and can be omitted with `--no-default-features`\nfor a smaller headless build.\n\n## Approval and safety\n\nReading page or screen state and acting on it do not share one blanket approval. The\nregistry evaluates the actual tool and operation. The global tool-permission mode,\ndisabled-tool list and approval prompts apply to computer and browser actions exactly\nas they do to shell or file writes.\n","Chrome-Extension":"# Chrome Extension\n\nThe LaRuche extension lets `browser` control the Chrome instance the user already has\nopen, including its tabs and signed-in sessions. Without it, `browser` remains available\nin `launch` mode with a separate persistent profile.\n\nChrome 136 no longer honors a remote debugging port on the default profile. The\nextension is the supported path to the user's normal browsing session.\n\n## Install\n\nTwo sources, one procedure. Download\n[`laruche-extension-chrome.zip`](https://github.com/infinition/LaRuche/releases/latest/download/laruche-extension-chrome.zip)\nfrom the latest release and unzip it. From a clone, use `extension-chrome/` directly.\n\nA release carries one archive only, and it is the one to load by hand. The Chrome\nWeb Store submission is built by the same workflow but stays out of the release:\nthe Store forbids the manifest `key`, and an archive without it gets an id derived\nfrom the folder path, which the node refuses. Two archives side by side only made\nit harder to tell which one to install.\n\n1. Open `chrome://extensions`.\n2. Enable developer mode.\n3. Choose **Load unpacked** and select the folder.\n4. Confirm the extension id is `ahgfjacmpohglimmcfnlbeccdghpkboo`.\n5. Open the LaRuche popup, set the node port if it is not 8419, then enable browser\n   control.\n\nThere is no `.crx` on purpose. Since Chrome 33, a packaged extension dragged into\n`chrome://extensions` is refused on Windows and macOS: only the Web Store installs. A\n`.crx` in a release would be a file nobody can open, and shipping it would mean\npublishing the signing key, with which
