var WIKI = {"sections":[{"label":"Overview","pages":[{"slug":"Home","title":"LaRuche Wiki"},{"slug":"FAQ","title":"FAQ"},{"slug":"Security","title":"Security"}]},{"label":"Getting started","pages":[{"slug":"Installation","title":"Installation"},{"slug":"Quick-Start","title":"Quick Start"},{"slug":"Local-Models","title":"Local Models"}]},{"label":"Concepts","pages":[{"slug":"Architecture","title":"Architecture"},{"slug":"Butinage-Engine","title":"The Butinage Engine"},{"slug":"Cognitive-Memory","title":"Cognitive Memory"},{"slug":"LaReine","title":"LaReine"},{"slug":"Watchers","title":"Watchers"},{"slug":"Automation","title":"Automation"},{"slug":"Skills-and-Curator","title":"Skills and the Curator"}]},{"label":"Guides","pages":[{"slug":"Voice","title":"Voice"},{"slug":"Telegram","title":"Telegram"},{"slug":"MCP","title":"MCP"},{"slug":"Secrets","title":"Secrets"}]},{"label":"Reference","pages":[{"slug":"Configuration","title":"Configuration"},{"slug":"Tools","title":"Tools"},{"slug":"Brand-Glossary","title":"Brand Glossary"}]}],"pages":{"Home":"# LaRuche Wiki\n\nWelcome to the hive. LaRuche is a self-hosted AI agent node written in Rust: one binary,\nfully local, with a real agent engine, a cognitive memory, a built-in supervisor, and\nevent reflexes.\n\n## Getting started\n\n- [Installation](Installation) - build from source, Windows launcher, Docker\n- [Quick Start](Quick-Start) - first boot, onboarding, first conversations\n- [Local Models](Local-Models) - llama.cpp, Ollama, cloud providers, embeddings\n\n## Concepts\n\n- [Architecture](Architecture) - the workspace, the crates, how a request flows\n- [Butinage Engine](Butinage-Engine) - the ReAct loop and its safety rails\n- [Cognitive Memory](Cognitive-Memory) - recall, decay, supersede, hebbian ranking, git time travel\n- [LaReine](LaReine) - the built-in supervisor, redo loop, proposal queue, scorecards\n- [Watchers](Watchers) - event reflexes with compiled rules\n- [Skills and the Curator](Skills-and-Curator) - the skill library and how it grows itself\n- [Automation](Automation) - crons, missions, kanban\n\n## Guides\n\n- [Telegram](Telegram) - connect the bot, commands, voice messages\n- [Voice](Voice) - local TTS and STT, wake word, call mode\n- [Secrets](Secrets) - the vault, substitution, output masking\n- [MCP](MCP) - LaRuche as an MCP client and as an MCP server\n\n## Reference\n\n- [Configuration](Configuration) - every environment variable and setting\n- [Tools](Tools) - the built-in abeilles by category\n- [Brand Glossary](Brand-Glossary) - what the French words mean\n- [Security](Security) - the threat model and the defaults\n- [FAQ](FAQ) - common questions\n\n## Where things live\n\n| Thing | Location |\n|---|---|\n| Web UI | http://localhost:8419 |\n| Memory database | `memoire.db` (SQLite, next to the binary) |\n| Memory time-travel repo | `memoire-okf/` (dedicated git repository) |\n| Skills | markdown files, editable from the UI or on disk |\n| Roadmap | `ROADMAP.md` in the repository |\n","FAQ":"# FAQ\n\n## Does it need the cloud?\n\nNo. With llama.cpp or Ollama plus the optional local embedding model, everything runs\non your machine: the engine, the memory, voice, watchers, Telegram excepted (Telegram\nis, by nature, a cloud service). Cloud model providers are supported but never required.\n\n## What hardware do I need?\n\nThe node itself is a lightweight Rust binary; the real cost is your model server. A\n7B/8B model on 8 to 12 GB of VRAM is enough for chat, watchers, and Telegram. Bigger\nmodels make longer agentic missions noticeably better. See\n[Local Models](Local-Models).\n\n## How is this different from other agent frameworks?\n\nDifferent bets. Those projects are strong at what they do; LaRuche invests in\nsubsystems that matter when an agent runs 24/7 on your own hardware:\n\n- **One Rust binary**, no Node or Python runtime for the core, low idle footprint.\n- **A cognitive memory** with decay, supersede, hebbian ranking, and git time travel,\n  not a chat log with embeddings.\n- **A built-in supervisor** (LaReine) that judges answers against a charter, can force\n  redos, and routes self-modifications through a proposal queue.\n- **Watchers with compiled rules** that cost zero tokens until their deterministic\n  conditions pass.\n- **A two-way secrets firewall**: names in, values substituted at execution, exact\n  values masked in outputs.\n\n## Which models work best?\n\nAnything with decent instruction following. The engine's schema validation and tolerant\nparsing were built precisely so mid-size local models can do real tool work. Native\nAnthropic and OpenAI-compatible tool calling are both supported.\n\n## Can I read what the agent knows?\n\nYes, all of it. `memoire.db` is plain SQLite, the Memory tab offers full CRUD, and the\nOKF export in `memoire-okf/` is markdown under git. `git log` in that folder is your\nagent's learning history.\n\n## Can I undo something it learned?\n\nYes. Facts are superseded rather than destroyed, the dream pass only ever proposes\ncleanups, and the git time travel lets you restore any earlier state of any part of the\nmap: checkout the file from the snapshot you want and re-import it.\n\n## Does the curator slow down my chats?\n\nNo. It is single-flight, has a cooldown, and yields whenever a chat or agent run is\nactive. Your live conversation always has priority on the model.\n\n## Is my API key safe if I use a cloud provider?\n\nThe key lives in the encrypted vault and is substituted into requests at execution\ntime. The model, the context, and the session files only ever see `@@KEY_NAME` or\n`[SECRET:KEY_NAME]`. See [Secrets](Secrets).\n\n## What is the license?\n\nMPL-2.0. Use it, modify it, embed it; changes to MPL-licensed files must stay open.\n\n## Why the French names?\n\nBecause it is a hive and hives deserve poetry. The [Brand Glossary](Brand-Glossary)\ntranslates everything.\n","Security":"# Security\n\nLaRuche's security model starts from an honest premise: the model will eventually do\nsomething wrong. A confused local model, a prompt injection in a fetched page, a\nhallucinated command. The defenses are structural, not prompt-based.\n\n## Network posture\n\n- **Loopback by default.** The node binds `127.0.0.1`; other machines cannot reach it\n  unless you set `LARUCHE_BIND_LAN` explicitly.\n- **Strict CORS** on the API.\n- **Auth guard** on every mutating route.\n- **Mesh is opt-in.** The Miel protocol announces nothing until you enable it, and\n  federation carries provenance tags.\n- **HTTPS available** (`LARUCHE_HTTPS` self-signed, or bring your own certificate) for\n  LAN access, required by browsers for the microphone.\n\n## Execution posture\n\n- **Approval gates.** Shell, Python, destructive file operations, and other sensitive\n  abeilles require a human click in a popup before running. The permission engine\n  (`laruche-permissions`) decides what is gated.\n- **Server-side validation.** Tool arguments are validated against JSON Schemas before\n  execution; watcher targets are validated for existence and well-formedness on the\n  server, not trusted from the model.\n- **Timeouts and budgets** bound what any single run can consume.\n\n## Data posture\n\n- **Secrets never enter the context.** Names in, values substituted at execution time,\n  and exact values masked to `[SECRET:NAME]` in every tool output before it returns to\n  the loop. See [Secrets](Secrets).\n- **Sanitized rendering.** Chat output is sanitized with a vendored DOMPurify before it\n  touches the DOM, so a malicious page quoted by the agent cannot script your dashboard.\n- **No CDN.** All web assets ship inside the binary; the UI makes no third-party\n  requests.\n- **Local by default.** With a local model, no conversation content leaves the machine\n  at all. With cloud providers, only what you send them leaves, and your keys stay in\n  the vault.\n\n## Self-modification posture\n\nThe agent can improve itself, under review: skill proposals and memory changes can\nroute through the [LaReine](LaReine) proposal queue, pull-request style, and the\nmemory's git time travel ([Cognitive Memory](Cognitive-Memory)) makes any accepted\nchange auditable and reversible after the fact.\n\n## Reporting\n\nFound something? Please open a private security advisory on GitHub rather than a\npublic issue.\n","Brand-Glossary":"# Brand Glossary\n\nThe hive speaks French. The brand vocabulary is part of LaRuche's identity and stays\nFrench in the code, the UI, and the docs; everything else is English. Here is the\ndecoder ring.\n\n| Term | Literal meaning | In LaRuche |\n|---|---|---|\n| **LaRuche** | the hive | The project and the node itself |\n| **butinage** | bees foraging | The agentic ReAct loop, the engine |\n| **butiner** | to forage | To run an agentic mission |\n| **essaim** | swarm | The agent layer (crate `laruche-essaim`) |\n| **abeille** | bee | A tool the agent can call |\n| **éclaireuse** | scout bee | A parallel sub-agent for research fan-out |\n| **escale** | stopover | Context compaction mid-run |\n| **boussole** | compass | The engine's planning state |\n| **jauge** | gauge | The token budget accountant |\n| **vigie** | lookout | The anti-loop sentinel, also the watchers UI |\n| **curateur** | curator | The background component that grows the skill library |\n| **LaReine** | the queen | The built-in supervisor and judge |\n| **Miel** | honey | The mesh protocol between nodes |\n| **nectar** / **Source** | nectar / source | Memory content and its store |\n\nTwo naming rules for contributors: identifiers that carry brand vocabulary keep it\n(`butiner()`, `AbeilleRegistry`), and no em dashes anywhere in the codebase or docs.\n","Tools":"# Tools\n\nTools are called **abeilles** (bees) in the hive. Around 90 are built in, plus whatever\nyou add through [MCP](MCP). The agent does not see all of them at once: dynamic\nselection matches the conversation's intent against the registry and injects only the\nrelevant ones, keeping the context lean for small models.\n\nSensitive tools sit behind approval gates ([Security](Security)); every tool's output\npasses through the secrets mask ([Secrets](Secrets)).\n\n## Web\n\n- Search across providers (Tavily, Brave, SearXNG, free scrapers as fallback)\n- Fetch with pagination for long pages and PDF text extraction\n- Parallel deep search: fan out sub-agent scouts over a research question\n\n## Files\n\n- Read, write, edit, search, list, within the workspace\n- Sensitive paths and destructive writes go through approval\n\n## Execution\n\n- Shell commands (approval-gated)\n- Python execution (approval-gated)\n\n## Memory\n\n- Recall (semantic + full-text), write, update, supersede\n- Node and item CRUD, importance management\n\n## Scheduling and automation\n\n- Create, list, delete crons\n- Create and manage missions and kanban tasks\n- Create watchers through the compiled rules DSL, with server-side target validation\n\n## Communication\n\n- Send messages to channels (Telegram, feed)\n- Voice synthesis for spoken replies\n\n## Sub-agents\n\n- Spawn eclaireuses (scout sub-agents) with their own budget slice and mission\n\n## Skills\n\n- Consult and propose skills (proposals can route through the LaReine queue)\n\n## MCP\n\n- Every tool exposed by servers connected in Settings > MCP\n\nThe authoritative list is in the app itself: the Capabilities tab shows every\nregistered abeille with its schema, and the same registry backs the MCP server\nendpoint.\n","Configuration":"# Configuration\n\nTwo layers: environment variables set at launch (the launcher-level knobs), and the\nSettings UI for everything else, editable live with no restart.\n\n## Environment variables\n\n### Core\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_PORT` | `8419` | Web UI and API port |\n| `LARUCHE_MEMOIRE_BACKEND` | `sqlite` | Memory backend: `sqlite`, `native`, `sidecar` |\n| `LARUCHE_BIND_LAN` | off | Bind beyond loopback. Off means the node is unreachable from other machines. |\n\n### TLS\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_HTTPS` | off | Serve HTTPS with a self-signed certificate (needed for the microphone from other devices) |\n| `LARUCHE_TLS_CERT` / `LARUCHE_TLS_KEY` | none | Use your own certificate and key |\n\n### Memory\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_EMBED_URL` | local Ollama | Embedding endpoint for semantic recall |\n| `LARUCHE_EMBED_MODEL` | `nomic-embed-text` | Embedding model |\n| `LARUCHE_OKF_GIT_SECS` | `1800` | Interval for git time-travel snapshots of the memory, `0` disables |\n\n### Web search\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_TAVILY_KEY` | none | Tavily API key |\n| `LARUCHE_BRAVE_KEY` | none | Brave Search API key |\n| `LARUCHE_SEARXNG_URL` | none | A SearXNG instance |\n\nWith none set, the search tools fall back to free scrapers. A key improves reliability.\n\n### Background components\n\n| Variable | Default | Purpose |\n|---|---|---|\n| `LARUCHE_CURATEUR_COOLDOWN_SECS` | `600` | Minimum delay between curator passes |\n| `LARUCHE_REINE_BUDGET_SECS` | set in Settings | Time cap for LaReine judging and redo loops |\n\n## Settings UI\n\nAll live, no restart:\n\n- **General**: generation parameters (max passes, temperature, max tokens, dynamic tool\n  limit), context and compaction thresholds, curator toggle.\n- **Providers**: model endpoints, context sizes, per-channel model assignment.\n- **LaReine**: on/off, the charter, thresholds, budget, the proposal queue.\n- **Secrets**: the vault ([Secrets](Secrets)).\n- **MCP**: external servers ([MCP](MCP)).\n- **Channels**: Telegram, Discord, Slack tokens and options.\n- **Voice**: backends, voice, wake word ([Voice](Voice)).\n\n## System prompts\n\nThe agent's system prompts are memory entries (`system.*`): identity, behavior,\nplanning, curator, consolidation. Edit them in the Memory tab; restore-to-default is\none click. See [Cognitive Memory](Cognitive-Memory).\n","Voice":"# Voice\n\nLaRuche speaks and listens, locally. No cloud speech APIs are involved: Whisper handles\ntranscription and Kokoro handles synthesis, both running on your machine through small\nPython sidecars managed by the node.\n\n## What it feels like\n\n- **Streamed speech**: the reply starts being spoken at the first complete sentence,\n  while the model is still generating the rest. No wait-for-the-full-answer pause.\n- **Call mode**: a full-screen call UI in the web app for hands-free back-and-forth.\n- **Barge-in**: interrupt the hive mid-sentence by speaking; it stops and listens.\n- **Wake word**: hands-free activation when enabled.\n- **Telegram voice notes**: send one, get transcribed and answered; replies can come\n  back as audio.\n\n## Backends\n\n| Component | Default | Alternative |\n|---|---|---|\n| TTS | Kokoro (fast, good quality, multilingual) | Voicebox backend with a cloned voice |\n| STT | Whisper | |\n\nThe cloned-voice backend lets the Reine speak with a voice you provide. Backend choice,\nvoice, speed, and wake word are all in **Settings > Voice** and persist across restarts.\n\n## Setup\n\n1. Open **Settings > Voice** and enable the components you want. The node manages the\n   Python sidecars; the status indicators probe them for real.\n2. Test from the microphone button in chat or the call screen.\n\n## Microphone from another device\n\nBrowsers only expose the microphone on secure origins. On `localhost` you are fine; to\ntalk to the hive from your phone or another machine on the LAN, enable HTTPS:\n\n| Variable | Effect |\n|---|---|\n| `LARUCHE_HTTPS` | Serve with a self-signed certificate |\n| `LARUCHE_TLS_CERT` / `LARUCHE_TLS_KEY` | Use your own certificate instead |\n| `LARUCHE_BIND_LAN` | Required to expose the node beyond loopback at all |\n\nAccept the self-signed certificate once on the device and the call screen works from\nanywhere in the house.\n","Telegram":"# Telegram\n\nTelegram is LaRuche's most mature remote channel: full agent runs from your phone,\npersistent per-channel memory, voice messages in both directions, and notifications\nfrom crons and watchers.\n\n## Setup\n\n1. Create a bot with [@BotFather](https://t.me/BotFather) and copy the token.\n2. In **Settings > Channels**, paste the token and enable Telegram. No restart needed.\n3. Message your bot. The first chat can be bound as home with `/sethome`, so crons and\n   watchers know where to notify you.\n\nStore the token as a secret (see [Secrets](Secrets)) rather than pasting it into chats.\n\n## What works\n\n- **Full agentic runs**: the same engine as the web UI, tools included. Ask for\n  research, file checks, scheduled jobs, from the phone.\n- **Per-channel memory**: the Telegram channel has its own persistent conversation\n  identity, distinct from your web sessions.\n- **Voice both ways**: send a voice message, it is transcribed locally (Whisper) and\n  answered; the answer can come back as synthesized speech (see [Voice](Voice)).\n- **Notifications**: crons and watchers deliver to your home chat, respecting\n  night-silence windows if the watcher's rules include one.\n- **Per-channel model**: assign a smaller, faster model to Telegram in Settings if you\n  want snappier phone replies.\n\n## Commands\n\n| Command | Effect |\n|---|---|\n| `/help` | List commands |\n| `/status` | Node status |\n| `/crons` | List scheduled jobs |\n| `/delcron <name|all>` | Remove a cron |\n| `/sethome` | Bind this chat as the notification home |\n| `/clear` | Clear the channel conversation |\n\n## Discord and Slack\n\nBoth are wired in the channels layer with the same per-channel memory model. Telegram\nis the reference implementation and the most battle-tested.\n","Secrets":"# Secrets\n\nThe secrets vault exists for one reason: your API keys, tokens, and passwords should\nnever enter a model's context. Not the local model's, not a cloud model's, not the\nsession file's. LaRuche enforces this in both directions.\n\n## Storing a secret\n\n**Settings > Secrets**: give it a name (`TAVILY_KEY`, `HOMELAB_SSH_PASS`), paste the\nvalue once. Values are encrypted at rest and never displayed again.\n\n## Using a secret: `@@NAME`\n\nReference a secret by name anywhere: in chat, in a cron payload, in a watcher action,\nin a tool argument. Autocomplete for `@@` works across the UI.\n\n> \"Call the staging API with the header `Authorization: Bearer @@STAGING_TOKEN` and\n> tell me the status.\"\n\nThe model sees the literal text `@@STAGING_TOKEN` and passes it along in its tool call.\nSubstitution happens at execution time, inside the tool runner, after the model has\nalready committed its arguments. The value exists only in the actual HTTP request or\nshell command.\n\n## The way back is guarded too\n\nSubstitution alone is not enough: a tool's output can echo the secret (a debug page\nprinting headers, `env` in a shell, an error message quoting the request). LaRuche\nmasks tool outputs before they return to the loop: any exact occurrence of a stored\nsecret value becomes `[SECRET:NAME]`.\n\nSo even in the worst case, the model's context and the session file contain the\nplaceholder, never the value.\n\n## What this enables\n\n- Give a **local** model the ability to use your paid cloud APIs without ever holding\n  the keys.\n- Let the agent run authenticated shell commands while keeping credentials out of chat\n  history.\n- Share a screen or a session export without scrubbing it first.\n\n## Limits worth knowing\n\nMasking matches exact values. A tool that re-encodes a secret (base64, URL-encoding)\nbefore printing it would slip past the filter. Treat the vault as a strong seatbelt,\nnot diplomatic immunity: prefer scoped, revocable tokens where the service offers them.\n","MCP":"# MCP\n\nLaRuche sits on both sides of the Model Context Protocol: it consumes external MCP\nservers as extra tools, and it exposes itself as an MCP server so other agents can use\nthe hive.\n\n## LaRuche as an MCP client\n\nAdd servers in **Settings > MCP**. Their tools join the abeille registry and become\navailable to the agent alongside the built-ins, subject to the same approval gates and\nthe same secrets masking on outputs.\n\nDynamic tool selection applies too: MCP tools are matched against the conversation's\nintent like any other tool, so connecting a large server does not flood every context.\n\n## LaRuche as an MCP server\n\nThe node exposes an MCP endpoint at `POST /mcp`. Any MCP-capable client (Claude Code,\nan IDE, another agent framework) can connect and use the hive's capabilities:\n\n- query the cognitive memory,\n- trigger agentic runs,\n- reach the tools you choose to expose.\n\nThis turns LaRuche into infrastructure: a persistent memory and automation node that\nyour other AI tooling talks to.\n\n## A concrete pattern\n\nRun LaRuche 24/7 on a homelab box. Connect your laptop's coding agent to it over MCP.\nThe coding agent now has a durable, searchable memory that survives its own sessions,\nplus scheduled jobs and watchers on a machine that never sleeps, without giving up its\nown workflow.\n","Installation":"# Installation\n\nLaRuche is a single Rust binary. There is no Node, no Python, no runtime to install for\nthe core (the optional voice sidecars use Python, see [Voice](Voice)).\n\n## Prerequisites\n\n- [Rust](https://rustup.rs/) stable, to build from source\n- `git`, used for cloning and for the memory time-travel feature\n- A model server (see [Local Models](Local-Models)):\n  - [llama.cpp](https://github.com/ggerganov/llama.cpp) in server mode, or\n  - [Ollama](https://ollama.com), or\n  - any OpenAI-compatible or Anthropic API endpoint\n- Optional but recommended for semantic memory recall:\n\n```bash\nollama pull nomic-embed-text\n```\n\n## From source (Linux, macOS, Windows)\n\n```bash\ngit clone https://github.com/infinition/laruche\ncd laruche/laruche\ncargo run --release -p laruche-node\n```\n\nThen open http://localhost:8419.\n\nThe first build takes a few minutes; after that, incremental builds are fast. The web\ndashboard is compiled into the binary, so there is no separate frontend build step and\nthe UI works offline.\n\n## Windows launcher\n\n`lancer_butinage.bat` at the repository root builds the node, starts it, waits for the\nserver to answer, and opens the browser. It is the recommended entry point on Windows.\n\n## Docker\n\n```bash\ncd laruche\ndocker compose up\n```\n\nThe compose file builds the binary in a multi-stage image and exposes port 8419.\n\n## Data on disk\n\nLaRuche keeps its state next to the binary, in plain inspectable formats:\n\n| File / folder | Content |\n|---|---|\n| `memoire.db` | The cognitive memory (SQLite, readable with any SQLite tool) |\n| `memoire-okf/` | Periodic markdown exports of the memory, versioned in their own git repo |\n| session files | Chat history per session |\n| skills | Markdown skill files |\n\nBack up `memoire.db` and you have backed up the agent's brain.\n\n## Updating\n\n```bash\ngit pull\ncargo run --release -p laruche-node\n```\n\nThe SQLite schema migrates automatically on startup.\n\n## Next step\n\nContinue with the [Quick Start](Quick-Start).\n","Local-Models":"# Local Models\n\nLaRuche is designed local-first, and specifically for the reality of local models: they\nare slower, they misformat tool calls, and they have small contexts. The engine is built\naround those constraints instead of pretending they do not exist.\n\n## Supported providers\n\n| Provider | Notes |\n|---|---|\n| llama.cpp (server mode) | The reference local setup. OpenAI-compatible endpoint. |\n| Ollama | Works out of the box, also used for embeddings. |\n| Any OpenAI-compatible API | LM Studio, vLLM, TGI, OpenRouter, DeepSeek, etc. |\n| Anthropic API | Native support for the Anthropic message format and tool calling. |\n\nProviders are configured in **Settings > Providers**, live, no restart. You can define\nseveral and assign a different model per channel: a big cloud model for deep missions,\na small local one for Telegram quick replies, for example.\n\n## Tool calling with imperfect models\n\nThe engine uses native tool calling when the provider supports it, and falls back to\ntolerant text parsing when the model emits tool calls as text. Every tool call is\nvalidated client-side against the tool's JSON Schema before execution; invalid arguments\nare returned to the model as a corrective message it can act on, instead of crashing the\nrun. See [Butinage Engine](Butinage-Engine).\n\nIn practice this means 7B-class models can drive real multi-step tool work.\n\n## Embeddings\n\nSemantic memory recall needs an embedding model:\n\n```bash\nollama pull nomic-embed-text\n```\n\nConfiguration:\n\n| Variable | Default |\n|---|---|\n| `LARUCHE_EMBED_URL` | the local Ollama endpoint |\n| `LARUCHE_EMBED_MODEL` | `nomic-embed-text` |\n\nWithout embeddings, memory recall falls back to full-text search only. Everything still\nworks; recall is just less clever about synonyms and phrasing.\n\n## Context size\n\nSet the context window per provider in Settings so the gauge (the engine's token\naccountant) can budget correctly. When a run approaches the limit, the engine performs\nan escale: an LLM-driven compaction that summarizes the conversation so far and\ncontinues with the summary. Long missions survive small contexts this way.\n\n## Practical picks\n\n- **Small and fast (8 to 12 GB VRAM)**: a 7B/8B instruct model in llama.cpp. Good for\n  chat, Telegram, watchers with `llm_check` leaves.\n- **Balanced (16 to 24 GB)**: a 12B to 32B model. Comfortable for real agentic missions.\n- **Hybrid**: local model as default plus a cloud key for the heavy channels. The\n  secrets vault keeps the key out of the model's sight ([Secrets](Secrets)).\n","Quick-Start":"# Quick Start\n\nYou have built and started the node ([Installation](Installation)) and the UI is open\nat http://localhost:8419. Here is the first hour.\n\n## First boot\n\nThe onboarding checklist walks you through the essentials:\n\n1. **Model provider**: point LaRuche at your llama.cpp server, Ollama, or a cloud\n   endpoint. The check probes the endpoint for real; a green checkmark means a model\n   actually answered.\n2. **Embeddings**: optional, enables semantic memory recall. `nomic-embed-text` via\n   Ollama is the default expectation.\n3. **Voice**: optional, can be set up later from Settings.\n\nEverything in onboarding can be changed later, live, in **Settings**. Nothing requires\na restart.\n\n## First conversation\n\nJust talk. The agent has its tools from the first message: web search and fetch, file\naccess, shell and Python behind approval gates, memory, scheduling.\n\nSome things to try:\n\n> \"What can you do?\"\n\n> \"Search the web for the latest release of X and summarize the changelog.\"\n\n> \"Remember that my home server is at 192.168.1.40 and runs the staging site.\"\n\n> \"Every morning at 9, check these three pages and tell me what changed.\"\n\n> \"Watch the folder `deploys/` and tell me when a file named release.zip appears.\"\n\nThe last two create a cron and a watcher through the agent's own tools. You will see\nthe approval popup for anything sensitive; nothing destructive happens without you.\n\n## The dashboard\n\n- **Chat**: sessions persist, agent runs survive a page refresh, live steering lets you\n  redirect a run in progress.\n- **Memory**: browse and edit the cognitive map directly, including the `system.*`\n  entries that are the agent's hot-editable system prompts.\n- **Automation**: crons, watchers, missions, kanban, all in one hub.\n- **Settings**: providers and per-channel models, context sizes, the curator, LaReine,\n  secrets, MCP servers, channels, voice. All live.\n\n## Where to go next\n\n- Connect [Telegram](Telegram) so the hive reaches your phone.\n- Read about the [Cognitive Memory](Cognitive-Memory) to understand what the agent\n  remembers and why.\n- Turn on [LaReine](LaReine) to get supervised, reviewed answers.\n- Build your first real [watcher](Watchers).\n","Watchers":"# Watchers\n\nA watcher is a standing condition. It observes something, decides whether that means\nanything, and reacts. The design goal is blunt: **watching must cost nothing while\nnothing is happening.**\n\nThat single constraint explains every decision below. A cron wakes a model on every\ntick to look at something that did not change. A watcher evaluates a compiled rule tree\ninstead, and never involves a model unless the tree explicitly asks for one.\n\n## Three questions\n\nEvery watcher answers three separate questions, and they are worth keeping apart.\n\n| Question | Field | Answers |\n|---|---|---|\n| What do I observe? | `watcher_type` + `target` | a file, a page, a log, a command |\n| Does it mean anything? | `regles` | a rule tree, evaluated for free |\n| What do I do about it? | `action` | reason, notify, or act |\n\nYou describe it in plain language:\n\n> \"If it is Tuesday or Thursday and my local site has been down for 10 minutes, send me\n> a Telegram message every 20 minutes until it comes back.\"\n\nThe agent compiles that once, through its `watcher-design` skill, into a deterministic\npredicate tree. At runtime the scheduler evaluates the tree. No model is involved.\n\n## What you can observe\n\n| `watcher_type` | Observes | Rules it can satisfy |\n|---|---|---|\n| `file` | the lifecycle AND the presence of a path. Carries NO text | `apparu`, `supprime`, `modifie`, `existe`, `absent`, `taille_depasse_mo` |\n| `log` | new lines appended to a growing file | `contient`, `contenu_change`, `nouvelle_ligne` |\n| `url` | reachability and page text | `est_down`, `down_depuis_min`, `retour_en_ligne`, `status_http`, `contient`, `contenu_change` |\n| `command` | the output and exit code of a shell command | `contient`, `contenu_change`, `nouvelle_ligne`, `code_retour` |\n\nThe `command` type is what makes everything else reachable. A lamp, a service, a\ncontainer, free disk space: none of those is a file or a page, and all of them answer\nto a CLI. The command is re-run at every poll, through PowerShell on Windows and `sh`\non macOS and Linux.\n\nA rule that does not match its type is false at every poll. `contient` on a `file`\nwatcher reads an observation that carries no text, so the watcher reports itself active\nand never fires. Creation refuses that combination rather than letting it ship.\n\n## Rules\n\nOne JSON object tagged by `op`, nesting through `regles` arrays. Combinators are `et`,\n`ou`, `non`.\n\n| Rule | True when |\n|---|---|\n| `jour_semaine` | today is in the given set |\n| `heure_entre` | local time is inside a window, end excluded |\n| `plage_date` | the date is inside a range |\n| `apparu` / `supprime` / `modifie` | the watched file appeared, was deleted, changed |\n| `existe` / `absent` | the watched path is there right now, or is not |\n| `contenu_change` | the observed content differs from last time |\n| `nouvelle_ligne` | a line appeared that was NOT in the previous poll |\n| `contient` | fresh content contains a pattern |\n| `taille_depasse_mo` | the file passed a size |\n| `est_down` / `down_depuis_min` / `retour_en_ligne` | a target is down, has been for N minutes, just came back |\n| `status_http` | the last status is in the list |\n| `code_retour` | the command exited with one of those codes |\n| `watcher` | ANOTHER watcher currently holds a true verdict |\n| `llm_check` | a model answers yes |\n\n`llm_check` is the only leaf that costs a model call, and it runs only after the\ndeterministic part already passed. A watcher guarded by a weekday costs zero tokens six\ndays a week, by construction.\n\n`nouvelle_ligne` deserves a note. `contenu_change` fires when the output differs, which\nincludes something LEAVING. For anything list shaped, a device list, running containers,\nchanged files, what you want is the arrival. The first poll only records a baseline and\nannounces nothing, otherwise everything already present is reported as new the moment\nyou create the watcher.\n\nThe down and up leaves carry memory between polls: `down_depuis_min` tracks how long a\ntarget has been failing, `retour_en_ligne` fires exactly once on recovery. With a\ncooldown, \"nag me every 20 minutes while it is down, tell me once when it is back\" is a\nsingle watcher.\n\n## What it does when it fires\n\nThree behaviours, and the default is the expensive one. Choose deliberately.\n\n| `action` | Cost | Use when |\n|---|---|---|\n| `{\"type\":\"agent\"}` (default) | a full model turn | the answer has to be worked out |\n| `{\"type\":\"notifier\"}` | nothing | the job is just to tell you. The observation IS the message |\n| `{\"type\":\"commande\",\"commande\":\"...\"}` | nothing | the watcher must ACT |\n| `{\"type\":\"aucune\"}` | nothing | it is a pure sensor, feeding a correlation |\n\n`notifier` is right far more often than the default. \"Tell me when the file is gone\"\nneeds no thinking: the sentence is known in advance, and a model asked to write it can\nalso get it wrong.\n\n`commande` is what turns monitoring into automation.\n\n### Transitions or states\n\n`apparu`, `supprime`, `modifie` are TRANSITIONS: true only on the poll where the thing\nhappened, false again immediately after. `existe` and `absent` are STATES: true for as\nlong as the situation lasts.\n\nThe distinction decides what you can combine. \"test.txt is present AND the light is on\"\nneeds a state on the file side, because a transition is false again at the very next\npoll and the two conditions would essentially never be true together.\n\n`absent` is also the one that catches what did NOT happen. Combined with `heure_entre`,\n\"no backup file this morning\" becomes a rule, where no transition can express it:\nnothing happened, so there was nothing to observe.\n\n## Correlation\n\nA watcher publishes its verdict, so another one can read it. This is the difference\nbetween alerting and diagnosing: one signal rarely means anything, two together do.\n\n```json\n{\"op\":\"et\",\"regles\":[\n  {\"op\":\"watcher\",\"nom\":\"site-down\",\"depuis_min\":5},\n  {\"op\":\"watcher\",\"nom\":\"hote-repond\"}]}\n```\n\nThe site has been down for five minutes and the host still answers ping. That is the\napplication, not the network. Alerting on the first leaf alone wakes someone for a cut\ncable.\n\nVerdicts are read from a snapshot taken before each round, never live, so the result\nnever depends on the order watchers happen to be polled in. The cost is one tick of\nlatency on a correlation, which beats an alert that fires differently between two runs.\n\nA watcher referenced but deleted reads as false, never as an error. A correlation whose\npeer is gone degrades quietly instead of breaking an otherwise valid tree forever.\n\nGive the upstream watchers `{\"type\":\"aucune\"}`. They exist to publish a verdict, and\nwithout it each of them also alerts on its own: \"the site is down\" and \"the host\nanswers\" would both wake you alongside the single conclusion you actually asked for.\n\nThe Watchers page draws the dependency graph whenever at least one correlation exists:\nsources on the left, conclusions on the right, a green border on a verdict currently\ntrue.\n\n## Use cases\n\n**A file lands on the desktop**\n\n```json\n{\"watcher_type\":\"file\",\"target\":\"C:\\\\Users\\\\me\\\\Desktop\\\\rapport.pdf\",\n \"regles\":{\"op\":\"apparu\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\n**An error in a log, but not at night**\n\n```json\n{\"watcher_type\":\"log\",\"target\":\"/var/log/app.log\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"contient\",\"motif\":\"ERROR\"},\n   {\"op\":\"heure_entre\",\"de\":\"08:00\",\"a\":\"23:00\"}]}}\n```\n\n**Someone arrives on the home network**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"arp -a\",\n \"regles\":{\"op\":\"nouvelle_ligne\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nFires on an arrival, stays silent on a departure. `arp -a` behaves the same on Windows,\nmacOS and Linux. A full sweep such as `nmap -sn 192.168.1.0/24` is more reliable,\nbecause a sleeping device drops out of the ARP table on its own. Note that recent phones\nrandomise their MAC address per network, so detecting that someone arrived is easy,\nidentifying who is much harder.\n\n**A light left on after midnight, turned off automatically**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"openhue get light \\\"Bureau\\\"\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"contient\",\"motif\":\"[on]\"},\n   {\"op\":\"heure_entre\",\"de\":\"00:30\",\"a\":\"06:00\"}]},\n \"action\":{\"type\":\"commande\",\"commande\":\"openhue set light \\\"Bureau\\\" --off\"}}\n```\n\n**Disk filling up**\n\n```json\n{\"watcher_type\":\"command\",\n \"target\":\"df -h / | tail -1 | awk '{print $5}'\",\n \"regles\":{\"op\":\"contient\",\"motif\":\"9\"},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nOn Windows, the same idea with the command that fits:\n`Get-PSDrive C | Select-Object -ExpandProperty Free`.\n\n**A container that stopped**\n\n```json\n{\"watcher_type\":\"command\",\"target\":\"docker ps --filter name=api --format '{{.Status}}'\",\n \"regles\":{\"op\":\"non\",\"regle\":{\"op\":\"contient\",\"motif\":\"Up\"}},\n \"action\":{\"type\":\"commande\",\"commande\":\"docker start api\"}}\n```\n\n**A light on AND a file present**\n\nTwo watchers. The sensor publishes, the alert correlates.\n\n```json\n{\"name\":\"lumiere-bureau\",\"watcher_type\":\"command\",\n \"target\":\"openhue get light \\\"Bureau\\\"\",\n \"regles\":{\"op\":\"contient\",\"motif\":\"[on]\"},\n \"action\":{\"type\":\"aucune\"}}\n```\n\n```json\n{\"name\":\"alerte-bureau\",\"watcher_type\":\"file\",\n \"target\":\"C:\\Users\\me\\Desktop\\test.txt\",\n \"regles\":{\"op\":\"et\",\"regles\":[\n   {\"op\":\"existe\"},\n   {\"op\":\"watcher\",\"nom\":\"lumiere-bureau\"}]},\n \"action\":{\"type\":\"notifier\"}}\n```\n\nNote `existe` rather than `apparu`: the file has to be a standing condition, not an\nevent, or the two conditions would essentially never be true on the same poll.\n\n**Diagnosing rather than alerting**\n\nThree watchers. `site-down` on the URL, `hote-repond` on a ping command, and a third\ncorrelating both, which is the only one that notifies you. You get \"the application is\nbroken\" instead of two contradictory alarms at three in the morning.\n\n**Something that did NOT happen**\n\nThe most useful watcher in operations is often the one that detects an absence: the\nnightly backup that wrote no file, the sensor that stopped reporting. Watch the target\nfolder and combine `heure_entre` on the morning after with the absence of a fresh file.\n\n## Guardrails\n\nLearned the hard way, enforced server side.\n\n- **Targets are validated.** A file target must be an absolute path, a URL must be well\n  formed. A relative path resolves against the server working directory, not yours, so\n  it would watch nothing forever while reporting itself active.\n- **Duplicates are refused.** Same type, same target, still active: rejected, so a\n  confused model cannot pile up six copies.\n- **Destructive commands are refused.** A watcher runs unattended, every minute,\n  forever. What is merely risky by hand is a standing hazard here, and the same refusal\n  list covers observed commands and action commands.\n- **Correlation cycles are refused at creation**, with the path that closes the loop.\n  A diamond is legitimate and stays allowed: two watchers can share a source.\n- **Intervals have a floor**, so a typo cannot hammer your own services.\n- **A failing target backs off.** The interval doubles per consecutive failure, capped\n  at one hour, and a single success clears it. A site unreachable for three days used to\n  be probed every minute forever.\n\n## Cost\n\nPolling is parallel, so one slow URL no longer holds every other watcher for the length\nof its timeout. A rule tree with no `llm_check`, and an action of `notifier` or\n`commande`, costs zero tokens whatever its complexity and however often it fires.\n\n## The UI\n\nEach watcher card renders the compiled rule tree as a pipeline: condition bubbles,\nand/or branches, the action at the end. Collapsed, a card is a one line summary.\nExpanded, every value is editable in place. What you see is exactly what runs.\n","Architecture":"# Architecture\n\nLaRuche is a Rust workspace compiled into a single process. The web dashboard, the API,\nthe channel bots, the MCP server, and every background job run inside one binary.\n\n## Crates\n\n| Crate | Role |\n|---|---|\n| `laruche-node` | axum HTTP server: API routes, web UI, channel bots, MCP server, background jobs (curator, dream, OKF git snapshots, watchers scheduler) |\n| `laruche-essaim` | Agent layer: the tool registry (abeilles), providers, prompt assembly, working-set recall, curator, LaReine judge and live loop |\n| `laruche-butinage` | The pure ReAct core: engine loop, compass (planning), gauge (token budget), sentinel (anti-loop), escale (compaction), eclaireuses (sub-agents). No IO, heavily tested. |\n| `laruche-memoire` | The cognitive map: SQLite + FTS5 + embeddings, decay, supersede, hebbian ranking, dream pass, OKF markdown export/import |\n| `laruche-watchers` | Event watchers and the compiled rules DSL |\n| `miel-protocol` | Mesh: mDNS discovery, node manifests, federation |\n| `laruche-dashboard` | Web SPA in vanilla JS, compiled into the binary, works offline |\n| `laruche-evals` | Evals harness: fixed missions replayed against the real engine, scored baselines |\n| `laruche-cli` | Terminal TUI with five views and a slash palette |\n| `laruche-skills` | Skill store: markdown skills, dynamic selection by intent |\n| `laruche-kanban` | Kanban board backing the missions |\n| `laruche-permissions` | The permission engine behind the approval gates |\n| `laruche-voix` | Voice: TTS/STT orchestration, streaming, wake word |\n\n## Design rules\n\n- **The core is pure.** `laruche-butinage` has no IO. Every engine behavior (anti-loop,\n  budget, compaction triggering, sub-agent fan-out) is testable without a model or a\n  network. The evals harness then validates the assembled system against real models.\n- **One process, plain storage.** SQLite for memory, markdown for skills and exports,\n  JSONL for journals. Everything on disk is human-readable.\n- **Live configuration.** Providers, models, context sizes, the curator, LaReine,\n  channels: all editable at runtime through Settings, no restart.\n- **The UI is embedded.** No CDN, no external assets, the dashboard works with the\n  network cable unplugged.\n\n## How a chat message flows\n\n1. The message arrives through a channel (web UI, Telegram, TUI, voice, MCP).\n2. `laruche-essaim` assembles the context: system prompts from memory (`system.*`\n   entries), the working set recalled from the cognitive map, the dynamically selected\n   tools and skills for this intent.\n3. `laruche-butinage` runs the ReAct loop: the model reasons, calls tools, the sentinel\n   watches for loops, the gauge watches the budget, the escale compacts if needed.\n4. Tool calls execute through the abeille registry, behind approval gates for the\n   sensitive ones, with secrets substituted in and masked out.\n5. If LaReine is on, the draft answer is judged against the charter; it may be sent\n   back for a redo before you ever see it.\n6. Memories actually used in the answer get hebbian reinforcement; the session is\n   persisted; the curator may later mine the finished conversation for a new skill.\n\n## Background jobs\n\nAll spawned by `laruche-node` at startup, all polite about resources:\n\n- **Watchers scheduler**: evaluates compiled rules on their intervals.\n- **Curator**: reviews finished conversations, proposes skills. Single-flight, cooldown,\n  yields whenever a chat or agent run is active.\n- **Dream pass**: memory consolidation proposals.\n- **OKF git snapshots**: periodic memory export committed to `memoire-okf/`.\n- **Mesh announcer**: mDNS presence, when enabled.\n","LaReine":"# LaReine\n\nLaReine (\"the queen\") is LaRuche's built-in supervisor: a judge that reviews the agent's\nanswers before you see them, with the authority to send the agent back to work.\n\n## Why a supervisor\n\nAgents fail in a specific way: they produce confident answers built on skipped work.\nThe tool call that was never made, the page that was never fetched, the \"I checked and\neverything is fine\" that checked nothing. A judge that only reads the final answer\ncannot catch this. LaReine can, because it sees the run, not just the prose.\n\n## How judging works\n\n1. The agent produces a draft answer.\n2. LaReine scores it against **the charter**, an editable document describing what a\n   good answer looks like (grounding, methodology, completeness, tone).\n3. The **methodology score is grounded in facts**: LaReine sees which tools were\n   actually called during the run. An answer claiming research that never happened\n   scores accordingly.\n4. Based on the verdict, LaReine either releases the answer, escalates to you with its\n   concerns, or sends the agent back.\n\n## The redo loop\n\nA redo is a fresh agentic run with LaReine's critique injected, not a rephrase of the\nsame text. Two guards keep this honest:\n\n- **Best-draft anti-regression**: LaRuche keeps the best-scoring draft across retries.\n  If redo number 2 is worse than redo number 1, you get redo number 1. Quality never\n  goes backward because the judge asked for more.\n- **Budget**: `LARUCHE_REINE_BUDGET_SECS` caps the total time spent on judging and\n  redoing, so supervision never turns a quick question into a ten-minute wait.\n\n## The proposal queue\n\nSelf-modification goes through review. When the agent (or the curator, or the dream\npass) wants to change its own equipment: a new skill, a memory edit, a deletion, the\nchange can be routed into a durable proposal queue instead of applying silently.\n\nIt works like a pull request: the proposal shows the full content, you approve or\nreject, and the queue survives restarts. The agent proposes, you dispose.\n\n## Scorecards\n\nEvery verdict is appended to a JSONL scorecard journal and surfaced in the dashboard\n(`/api/reine/scorecards`): scores over time, redo rates, escalations. You can literally\nwatch answer quality as a time series, and see whether a model change or a charter edit\nmade things better.\n\n## Configuration\n\nEverything is in **Settings > LaReine**: on/off, the charter text, thresholds, the\nbudget. The charter is yours to write; the defaults are a starting point, not a rule.\n","Cognitive-Memory":"# Cognitive Memory\n\nLaRuche's memory is not a vector store bolted onto a chat log. It is a cognitive map:\nnamed nodes (topics) holding items (facts), stored in SQLite, recalled by hybrid search,\ncurated over time, and versioned in git.\n\n## Recall\n\nSearch fuses two signals:\n\n- **Semantic**: embeddings (default `nomic-embed-text` via Ollama) for meaning-level\n  matches.\n- **Full-text**: SQLite FTS5 for exact terms, names, paths, error strings.\n\nThe working set assembled before each agent run pulls the most relevant facts into\ncontext automatically. Tools also expose explicit recall to the model.\n\n## What keeps the map clean\n\nMemory that only grows becomes noise. Several mechanisms push back:\n\n- **Importance decay**: facts lose weight over time unless something reinforces them.\n- **Write-time supersede**: writing a fact that contradicts or updates an existing one\n  replaces it instead of piling up next to it. The old fact is superseded, not silently\n  destroyed.\n- **LLM arbiter**: contradictions in the ambiguity band (similar but not clearly the\n  same fact) are settled by a small model call, never destructively.\n- **Dream pass**: a periodic consolidation job that surfaces duplicates and merge\n  candidates as proposals you approve or reject. It never deletes on its own.\n\n## Hebbian ranking\n\n\"Neurons that fire together wire together\", applied honestly:\n\n- **Level 1**: recalled facts gain a small amount of weight (access count).\n- **Level 2**: the working-set recall is trace-free; after the answer is produced, only\n  the facts whose content actually shows up in the answer get reinforced. Mere\n  co-occurrence in the context no longer inflates a fact's rank. Recalled noise stays\n  noise.\n\n## Git time travel\n\nOn a schedule (`LARUCHE_OKF_GIT_SECS`, default 30 minutes, `0` disables), the whole map\nis exported as plain markdown (the OKF format) into `memoire-okf/`, a dedicated git\nrepository with its own history, independent from the code repo. Snapshots that change\nnothing produce no commit.\n\nWhat this buys you:\n\n```bash\ncd memoire-okf\ngit log --oneline          # the agent's learning timeline\ngit diff HEAD~5 --stat     # what it learned in the last 5 snapshots\ngit show <sha> -- projets/laruche.md   # a fact's history\n```\n\nRollback is a checkout plus re-import: restore a file from an earlier snapshot and\nimport it back. Surgical, auditable, and it uses tools you already know.\n\n## Hot-editable system prompts\n\nThe agent's own system prompts live in memory as `system.*` entries (identity, behavior,\nplanning, curator, consolidation). Edit them in the Memory tab and the change applies to\nthe next run. Restore-to-default is one click.\n\n## Inspecting everything\n\n`memoire.db` is a normal SQLite file. The Memory tab in the dashboard offers full CRUD\nwith previews of proposed entries. Nothing about what the agent knows is opaque.\n","Butinage-Engine":"# The Butinage Engine\n\nButinage is French for what bees do: foraging, flower to flower. It is LaRuche's name\nfor the agentic loop, and the engine is the part of the system that took the most\nhardening, because it has to work with local models that misformat, repeat themselves,\nand run out of context.\n\n## The loop\n\nA ReAct cycle: the model reasons, decides on tool calls, the engine executes them and\nfeeds results back, until the model produces a final answer or a limit is hit. Parallel\ntool calls in a single pass are supported and encouraged in the prompt.\n\n## The rails\n\nEvery rail exists because a real failure demanded it:\n\n- **Compass (boussole)**: lightweight planning state that keeps long missions oriented,\n  so the model does not forget the goal at step 14.\n- **Gauge (jauge)**: token accounting per run. Budgets for the run, for sub-agents, for\n  tool outputs. When the context approaches the provider's limit, the gauge triggers\n  the escale.\n- **Sentinel (vigie)**: anti-loop detection. A model calling the same tool with the same\n  arguments again, or oscillating between two states, gets interrupted with a corrective\n  nudge instead of burning the budget.\n- **Escale**: LLM-driven compaction. The conversation so far is summarized and the run\n  continues on the summary. Long missions survive small contexts.\n- **Schema validation**: every tool call is validated against the tool's JSON Schema\n  client-side, before execution. Invalid arguments come back to the model as a\n  corrective message it can fix, not as a crash.\n- **Tolerant parsing**: native tool calling when the provider supports it, text-format\n  fallbacks when the model emits tool calls as prose or malformed JSON.\n- **Per-tool timeouts** and **cooperative cancellation**: a stuck fetch does not stick\n  the run, and the stop button actually stops things.\n\n## Live steering\n\nYou can talk to a run in progress. A steering message is injected into the loop at the\nnext pass boundary: \"actually, focus on the second option\" redirects the mission without\nkilling it. Runs survive a page refresh; the web UI reattaches to the live run.\n\n## Eclaireuses (scouts)\n\nFor research fan-out, the engine spawns parallel sub-agents, each with its own budget\nslice and a narrowed mission, each able to recall from memory. Their reports are merged\nback into the parent run. This is how \"research everything about X\" becomes ten focused\nreads instead of one shallow one.\n\n## Evals\n\n`laruche-evals` replays fixed missions against the real assembled engine and scores the\noutcomes. It exists so that engine changes are measured, not vibed. Baselines live with\nthe repo; regressions in tool-call success, loop rate, or budget burn show up as numbers.\n","Automation":"# Automation\n\nThe automation hub gathers everything the hive does on its own: crons, missions, the\nkanban, and [watchers](Watchers). The agent creates all of them through its own tools,\nfrom a plain-language request, with your approval.\n\n## Crons\n\nScheduled prompts. \"Every morning at 9, check these three pages and summarize what\nchanged\" becomes a cron whose payload is an agentic run. Each cron can target a\nspecific channel, so the morning digest lands on Telegram while a weekly report stays\nin the web feed.\n\nTelegram users can inspect and prune from the phone: `/crons`, `/delcron <name|all>`.\n\n## Missions\n\nLong-running goals that survive across days: \"research topic X in depth, iterate daily,\nkeep your notes in memory.\" A mission holds its own state and channel, gets scheduled\nwork, accumulates findings in the cognitive map, and reports on its channel.\n\nA finished mission stops occupying the scheduler; its cron disappears with it.\n\n## Kanban\n\nThe board behind the missions: tasks move through columns, each task can carry its own\nchannel for reporting. Useful both as the agent's own work queue and as a shared\nsurface where you drop tasks for the hive.\n\n## Watchers\n\nEvent-driven rather than time-driven. See [Watchers](Watchers) for the rules, the four\nobservable types, and what a watcher can do when it fires.\n\n### Cron or watcher?\n\nThis is the one choice worth getting right, because the costs are not comparable.\n\nA cron wakes a full agentic run at every tick, whether anything changed or not. A\nwatcher evaluates a compiled rule tree, which costs nothing, and only involves a model\nif the tree explicitly asks for one or if its action is `agent`.\n\nSo: **if you are asking \"has X happened yet\", it is a watcher, not a cron**, even when\nwhat you observe needs a command to answer. Watching a lamp, a service or a disk\nthrough a `command` watcher costs nothing per check; the same thing scheduled as a cron\ncosts a model turn every single time.\n\nReach for a cron when the work itself is the point and its timing is arbitrary: a\nmorning digest, a weekly report, a nightly cleanup. Reach for a watcher when a\ncondition decides.\n\n## How they compose\n\nThe four primitives combine naturally:\n\n- A **watcher** notices the release file appeared, and hands it to the agent.\n- The agent run files a summary in **memory** and adds a follow-up task to the\n  **kanban**.\n- A **cron** picks up the board every morning and sends the digest to Telegram.\n\nNone of this requires you to write configuration. Describe the loop you want; the agent\nassembles it from its own primitives and shows you what it built.\n","Skills-and-Curator":"# Skills and the Curator\n\n## Skills\n\nA skill is a markdown file: instructions, examples, and conventions for a category of\ntask. Skills live on disk, are editable from the UI or any editor, and are selected\ndynamically: the working-set assembly matches the user's intent against the skill\ncatalog and injects only the relevant ones, so the context stays lean.\n\nBuilt-in skills cover things like watcher creation (`watcher-architecte`) and mission\nplanning; your own skills teach the agent your conventions: how you like reports\nformatted, how your homelab is laid out, what \"deploy\" means in your world.\n\n## The curator\n\nThe curator (curateur) is the background component that grows the skill library from\nexperience. After a conversation ends, it can review the transcript and ask: did the\nagent figure out something reusable here? If yes, it drafts a skill, verifies it, and\nproposes it.\n\n### Verified, not vibed\n\nA curator skill proposal is not a summary of the chat. The draft is checked for\nconcrete, reusable instructions, and proposals can be routed through the\n[LaReine](LaReine) proposal queue so you review the full content before anything joins\nthe library. The agent proposes, you dispose.\n\n### Polite by construction\n\nThe curator shares your local model with your live conversations, so it is engineered\nto never get in the way:\n\n- **Single-flight**: at most one curator pass at a time.\n- **Cooldown**: a minimum delay between passes (default 10 minutes,\n  `LARUCHE_CURATEUR_COOLDOWN_SECS`).\n- **Yields to you**: if any chat or agent run is active, the curator waits. Your\n  conversation never lags because the hive is studying its notes.\n\n## Editing and versioning\n\nSkills are plain markdown, so they diff, they version, and they travel. The\n[Miel mesh](Architecture#background-jobs) can federate skills between your nodes with\nprovenance tags, opt-in.\n"}};
/* WIKI-DATA:END */
</script>

<script>
(function () {
  "use strict";

  var doc = document.getElementById("doc");
  var nav = document.getElementById("nav");
  var crumb = document.getElementById("crumb");
  var pager = document.getElementById("pager");
  var side = document.getElementById("side");
  var scrim = document.getElementById("scrim");

  // Flat reading order, used for the previous/next pager.
  var FLAT = [];
  WIKI.sections.forEach(function (s) {
    s.pages.forEach(function (p) { FLAT.push({ slug: p.slug, title: p.title, section: s.label }); });
  });
  var KNOWN = {};
  FLAT.forEach(function (p, i) { KNOWN[p.slug] = i; });

  /* ── Markdown, limited on purpose to what wiki/ actually uses:
        headings, lists, tables, fenced code, blockquotes, bold,
        inline code, links. Everything is escaped before formatting. ── */

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function anchorId(t) {
    return t.toLowerCase().replace(/`/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  }

  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]*)\]\(([^)]+)\)/g, function (_, txt, href) {
      if (/^(https?:|mailto:)/i.test(href)) {
        return '<a href="' + href + '" target="_blank" rel="noopener">' + txt + "</a>";
      }
      if (href.charAt(0) === "#") return '<a href="' + href + '">' + txt + "</a>";
      var bits = href.split("#");
      var page = bits[0];
      if (!Object.prototype.hasOwnProperty.call(KNOWN, page)) {
        // Keep the label visible rather than offering a link that leads nowhere.
        return '<a class="dead" title="This page does not exist yet">' + txt + "</a>";
      }
      return '<a href="#/' + page + (bits[1] ? "#" + bits[1] : "") + '">' + txt + "</a>";
    });
    return s.replace(/\u0000C(\d+)\u0000/g, function (_, i) { return "<code>" + codes[i] + "</code>"; });
  }

  function listItems(lines, start) {
    var items = [], i = start;
    var ordered = /^\s*\d+\.\s/.test(lines[start]);
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) {
        if (i + 1 < lines.length && /^\s*(?:[-*]|\d+\.)\s/.test(lines[i + 1])) { i++; continue; }
        break;
      }
      var m = l.match(/^(\s*)(?:[-*]|\d+\.)\s+(.*)$/);
      if (m) { items.push({ indent: m[1].length, text: m[2] }); i++; continue; }
      if (items.length && /^\s+\S/.test(l)) {           // wrapped continuation line
        items[items.length - 1].text += " " + l.trim(); i++; continue;
      }
      break;
    }
    return { items: items, next: i, ordered: ordered };
  }

  function renderItems(items, ordered) {
    if (!items.length) return "";
    var min = items.reduce(function (a, x) { return Math.min(a, x.indent); }, Infinity);
    var html = ordered ? "<ol>" : "<ul>";
    var k = 0;
    while (k < items.length) {
      var body = inline(esc(items[k].text));
      k++;
      var kids = [];
      while (k < items.length && items[k].indent > min) { kids.push(items[k]); k++; }
      html += "<li>" + body + (kids.length ? renderItems(kids, false) : "") + "</li>";
    }
    return html + (ordered ? "</ol>" : "</ul>");
  }

  function tableAt(lines, start) {
    var rows = [], i = start;
    while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
    if (rows.length < 2 || !/^[\s|:\-]+$/.test(rows[1])) return null;
    var cut = function (r) {
      return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    };
    var html = '<div class="tw"><table><thead><tr>';
    cut(rows[0]).forEach(function (h) { html += "<th>" + inline(esc(h)) + "</th>"; });
    html += "</tr></thead><tbody>";
    for (var r = 2; r < rows.length; r++) {
      html += "<tr>";
      cut(rows[r]).forEach(function (c) { html += "<td>" + inline(esc(c)) + "</td>"; });
      html += "</tr>";
    }
    return { html: html + "</tbody></table></div>", next: i };
  }

  function render(md) {
    var fences = [];
    md = md.replace(/```([\w-]*)\r?\n([\s\S]*?)```/g, function (_, lang, code) {
      fences.push(code.replace(/\n$/, "")); return "\u0000F" + (fences.length - 1) + "\u0000";
    });

    var lines = md.split(/\r?\n/), out = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      var f = line.match(/^\u0000F(\d+)\u0000$/);
      if (f) { out.push("<pre><code>" + esc(fences[+f[1]]) + "</code></pre>"); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length, txt = h[2].replace(/\s+#+\s*$/, "");
        out.push("<h" + lvl + ' id="' + anchorId(txt) + '">' + inline(esc(txt)) + "</h" + lvl + ">");
        i++; continue;
      }

      if (/^\s*---+\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      if (/^\s*\|/.test(line)) {
        var t = tableAt(lines, i);
        if (t) { out.push(t.html); i = t.next; continue; }
      }

      if (/^\s*(?:[-*]|\d+\.)\s/.test(line)) {
        var l = listItems(lines, i);
        out.push(renderItems(l.items, l.ordered));
        i = l.next; continue;
      }

      if (/^\s*>/.test(line)) {
        var buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
        }
        out.push("<blockquote>" + render(buf.join("\n")) + "</blockquote>");
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim()
             && !/^(#{1,6})\s/.test(lines[i]) && !/^\s*\|/.test(lines[i])
             && !/^\s*(?:[-*]|\d+\.)\s/.test(lines[i]) && !/^\s*>/.test(lines[i])
             && !/^\u0000F\d+\u0000$/.test(lines[i]) && !/^\s*---+\s*$/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      if (para.length) out.push("<p>" + inline(esc(para.join(" "))) + "</p>");
    }
    return out.join("\n");
  }

  /* ── Navigation ──────────────────────────────────────────────────── */

  function buildNav(filter) {
    var f = (filter || "").trim().toLowerCase();
    nav.innerHTML = "";
    var shown = 0;
    WIKI.sections.forEach(function (s) {
      var hits = s.pages.filter(function (p) {
        if (!f) return true;
        return p.title.toLowerCase().indexOf(f) >= 0
            || p.slug.toLowerCase().indexOf(f) >= 0
            || (WIKI.pages[p.slug] || "").toLowerCase().indexOf(f) >= 0;
      });
      if (!hits.length) return;
      shown += hits.length;
      var box = document.createElement("div");
      box.className = "nav-sec";
      var h = document.createElement("h4");
      h.textContent = s.label;
      box.appendChild(h);
      hits.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#/" + p.slug;
        a.textContent = p.title;
        a.dataset.slug = p.slug;
        box.appendChild(a);
      });
      nav.appendChild(box);
    });
    if (!shown) {
      var e = document.createElement("div");
      e.className = "nav-empty";
      e.textContent = "Nothing matches that.";
      nav.appendChild(e);
    }
    markActive(currentSlug);
  }

  function markActive(slug) {
    Array.prototype.forEach.call(nav.querySelectorAll("a"), function (a) {
      a.classList.toggle("on", a.dataset.slug === slug);
    });
  }

  /* ── Routing ─────────────────────────────────────────────────────── */

  var currentSlug = "";

  function show(slug, anchor) {
    if (!Object.prototype.hasOwnProperty.call(WIKI.pages, slug)) slug = FLAT.length ? FLAT[0].slug : "";
    currentSlug = slug;
    var meta = FLAT[KNOWN[slug]] || { title: slug, section: "" };

    document.title = /LaRuche Wiki/i.test(meta.title) ? meta.title : meta.title + " · LaRuche Wiki";
    crumb.innerHTML = meta.section ? esc(meta.section) + " / <b>" + esc(meta.title) + "</b>" : "<b>" + esc(meta.title) + "</b>";
    doc.innerHTML = render(WIKI.pages[slug] || "");
    // Re-rendering wiped any previous marks, so the clear button must go with them.
    clearBtn.classList.add("hidden");

    var i = KNOWN[slug], prev = FLAT[i - 1], next = FLAT[i + 1];
    pager.innerHTML = "";
    if (prev) {
      pager.insertAdjacentHTML("beforeend",
        '<a href="#/' + prev.slug + '"><span>Previous</span>' + esc(prev.title) + "</a>");
    }
    if (next) {
      pager.insertAdjacentHTML("beforeend",
        '<a class="next" href="#/' + next.slug + '"><span>Next</span>' + esc(next.title) + "</a>");
    }

    markActive(slug);
    side.classList.remove("open");
    scrim.classList.remove("on");

    // A search result asked for this page: highlight its term and land on the
    // exact occurrence that was clicked, not merely on the page.
    if (pending) {
      var want = pending; pending = null;
      applyHighlight(want.q, want.ordinal);
      return;
    }

    if (anchor) {
      var el = document.getElementById(anchor);
      if (el) { el.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, "");
    var bits = h.split("#");
    show(decodeURIComponent(bits[0] || "") || (FLAT.length ? FLAT[0].slug : ""), bits[1] || "");
  }

  /* ── Full-text search ───────────────────────────────────────────────
     Same surface as the AcidWiki search it replaces: #search-modal,
     #modal-search-input, #modal-search-results, .search-result-item.active,
     mark.search-match, #clear-highlight-btn.

     The index is built from the RENDERED text nodes of every page rather
     than from the markdown source, and the highlighter walks the live DOM
     with the exact same traversal. That is what makes "jump to the line"
     land on the right occurrence: a result's ordinal is the same number on
     both sides. Indexing the source instead would drift as soon as a line
     contains syntax that renders away, such as backticks or link targets.
     ── */

  var BLOCKISH = " P LI H1 H2 H3 H4 H5 H6 TD TH PRE BLOCKQUOTE UL OL TABLE THEAD TBODY TR DIV ";
  var UNIT_SEL = "p,li,h1,h2,h3,h4,h5,h6,td,th,pre,blockquote";

  // Text nodes that belong to this block: its own, plus those inside inline
  // children, but never those of a nested block (they are visited separately).
  function ownTextNodes(el) {
    var out = [];
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3) { out.push(n); continue; }
      if (n.nodeType !== 1 || BLOCKISH.indexOf(" " + n.nodeName + " ") >= 0) continue;
      var w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT, null), t;
      while ((t = w.nextNode())) out.push(t);
    }
    return out;
  }

  function collect(root) {
    var chunks = [], owners = [], units = [];
    Array.prototype.forEach.call(root.querySelectorAll(UNIT_SEL), function (el) {
      var kids = ownTextNodes(el);
      if (!kids.length) return;
      var joined = kids.map(function (n) { return n.nodeValue; }).join("").replace(/\s+/g, " ").trim();
      if (!joined) return;
      var ui = units.push(joined) - 1;
      kids.forEach(function (n) { chunks.push(n.nodeValue); owners.push(ui); });
    });
    return { chunks: chunks, owners: owners, units: units };
  }

  var INDEX = [];
  (function buildSearchIndex() {
    var tmp = document.createElement("div");
    FLAT.forEach(function (p) {
      tmp.innerHTML = render(WIKI.pages[p.slug] || "");
      var c = collect(tmp);
      INDEX.push({
        slug: p.slug, title: p.title, titleLower: p.title.toLowerCase(),
        section: p.section, chunks: c.chunks, owners: c.owners, units: c.units
      });
    });
    tmp.innerHTML = "";
  })();

  var LIMIT = 40, PER_PAGE = 4;

  function performSearch(query) {
    var out = [], q = query.trim().toLowerCase();
    if (q.length < 2) return out;
    INDEX.forEach(function (p) {
      var ordinal = 0, kept = 0;
      for (var i = 0; i < p.chunks.length; i++) {
        var low = p.chunks[i].toLowerCase(), pos = low.indexOf(q);
        while (pos >= 0) {
          if (kept < PER_PAGE && out.length < LIMIT) {
            out.push({ slug: p.slug, title: p.title, section: p.section,
                       ordinal: ordinal, unit: p.units[p.owners[i]] });
            kept++;
          }
          ordinal++;
          pos = low.indexOf(q, pos + q.length);
        }
      }
      // A page whose title matches but whose body does not still belongs here.
      if (!kept && p.titleLower.indexOf(q) >= 0 && out.length < LIMIT) {
        out.push({ slug: p.slug, title: p.title, section: p.section,
                   ordinal: -1, unit: p.units[0] || "" });
      }
    });
    return out;
  }

  // Escaped snippet, trimmed around the first hit, every hit wrapped.
  function snippet(unit, query) {
    var q = query.trim(), ql = q.toLowerCase(), low = unit.toLowerCase();
    var first = low.indexOf(ql);
    var start = first > 70 ? first - 60 : 0;
    var raw = unit.slice(start, start + 340);
    var lowr = raw.toLowerCase(), html = start ? "… " : "", last = 0;
    var p = ql ? lowr.indexOf(ql) : -1;
    while (p >= 0) {
      html += esc(raw.slice(last, p)) + "<mark>" + esc(raw.substr(p, q.length)) + "</mark>";
      last = p + q.length;
      p = lowr.indexOf(ql, last);
    }
    return html + esc(raw.slice(last));
  }

  var modal = document.getElementById("search-modal");
  var input = document.getElementById("modal-search-input");
  var list = document.getElementById("modal-search-results");
  var countEl = document.getElementById("search-count");
  var clearBtn = document.getElementById("clear-highlight-btn");
  var results = [], active = -1, pending = null;

  function renderResults() {
    list.innerHTML = "";
    if (!results.length) {
      list.innerHTML = '<div class="search-empty">' +
        (input.value.trim().length < 2 ? "Type at least two characters." : "Nothing matches that.") + "</div>";
      countEl.textContent = "";
      return;
    }
    results.forEach(function (r, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "search-result-item" + (i === active ? " active" : "");
      b.innerHTML = '<div class="where">' + (r.section ? esc(r.section) + " / " : "") +
                    "<b>" + esc(r.title) + "</b></div>" +
                    '<div class="line">' + snippet(r.unit, input.value) + "</div>";
      b.addEventListener("click", function () { goTo(r); });
      list.appendChild(b);
    });
    countEl.textContent = results.length + (results.length === LIMIT ? "+ hits" : " hits");
  }

  function setActive(i) {
    if (!results.length) return;
    active = (i + results.length) % results.length;
    var items = list.querySelectorAll(".search-result-item");
    Array.prototype.forEach.call(items, function (el, k) { el.classList.toggle("active", k === active); });
    if (items[active]) items[active].scrollIntoView({ block: "nearest" });
  }

  function goTo(r) {
    closeSearch();
    pending = { q: input.value.trim(), ordinal: r.ordinal };
    if (r.slug === currentSlug) { show(r.slug, ""); }
    else if (location.hash === "#/" + r.slug) { route(); }
    else { location.hash = "#/" + r.slug; }
  }

  function clearHighlights() {
    Array.prototype.forEach.call(doc.querySelectorAll("mark.search-match"), function (m) {
      var t = document.createTextNode(m.textContent);
      m.parentNode.replaceChild(t, m);
    });
    doc.normalize();
    clearBtn.classList.add("hidden");
  }

  function applyHighlight(query, ordinal) {
    clearHighlights();
    var q = (query || "").trim();
    if (!q) { window.scrollTo(0, 0); return; }
    var ql = q.toLowerCase(), seen = 0, target = null;

    Array.prototype.forEach.call(doc.querySelectorAll(UNIT_SEL), function (el) {
      ownTextNodes(el).forEach(function (node) {
        var txt = node.nodeValue, low = txt.toLowerCase(), pos = low.indexOf(ql);
        if (pos < 0) return;
        var frag = document.createDocumentFragment(), last = 0;
        while (pos >= 0) {
          if (pos > last) frag.appendChild(document.createTextNode(txt.slice(last, pos)));
          var m = document.createElement("mark");
          m.className = "search-match";
          m.textContent = txt.substr(pos, q.length);
          if (seen === ordinal) { m.classList.add("current"); target = m; }
          seen++;
          frag.appendChild(m);
          last = pos + q.length;
          pos = low.indexOf(ql, last);
        }
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        node.parentNode.replaceChild(frag, node);
      });
    });

    if (!seen) { window.scrollTo(0, 0); return; }
    clearBtn.classList.remove("hidden");
    if (!target) target = doc.querySelector("mark.search-match");
    if (target) target.scrollIntoView({ block: "center" });
    else window.scrollTo(0, 0);
  }

  function openSearch() {
    modal.classList.add("open");
    input.value = "";
    results = []; active = -1;
    renderResults();
    input.focus();
  }
  function closeSearch() { modal.classList.remove("open"); }

  input.addEventListener("input", function () {
    results = performSearch(input.value);
    active = results.length ? 0 : -1;
    renderResults();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter") { e.preventDefault(); if (results[active]) goTo(results[active]); }
    else if (e.key === "Escape") { closeSearch(); }
  });

  document.getElementById("open-search").addEventListener("click", openSearch);
  Array.prototype.forEach.call(modal.querySelectorAll("[data-close]"), function (el) {
    el.addEventListener("click", closeSearch);
  });
  clearBtn.addEventListener("click", clearHighlights);

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); return; }
    if (e.key === "/" && !typing) { e.preventDefault(); openSearch(); return; }
    if (e.key === "Escape" && modal.classList.contains("open")) closeSearch();
  });

  document.getElementById("burger").addEventListener("click", function () {
    var open = side.classList.toggle("open");
    scrim.classList.toggle("on", open);
  });
  scrim.addEventListener("click", function () {
    side.classList.remove("open"); scrim.classList.remove("on");
  });
  window.addEventListener("hashchange", route);

  buildNav("");
  route();
})();
</script>
</body>
</html>
