[package]
name = "laruche-cli"
version.workspace = true
edition.workspace = true
description = "LaRuche CLI - Command line tool for interacting with LaRuche nodes"

# Le nom du binaire est celui du crate, pas "laruche" tout court: la coque de
# bureau est l'application que l'on ouvre, et c'est elle qui doit s'appeler
# laruche.exe. Un utilisateur qui double-clique sur "laruche" attend une fenetre,
# pas un terminal.
[[bin]]
name = "laruche-cli"
path = "src/main.rs"

[dependencies]
miel-protocol.workspace = true
laruche-client = { path = "../laruche-client" }
laruche-essaim = { path = "../laruche-essaim" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
chrono.workspace = true
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
unicode-width = "0.2"
tokio-tungstenite = "0.26"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
