[package]
name = "laruche-essaim"
version.workspace = true
edition.workspace = true
description = "Essaim - Agent engine for LaRuche (ReAct loop, tools, sessions)"

[dependencies]
miel-protocol.workspace = true
laruche-memoire.workspace = true
laruche-permissions.workspace = true
laruche-compaction.workspace = true
laruche-kanban = { path = "../laruche-kanban" }
laruche-butinage = { path = "../laruche-butinage" }
# Single source of truth for skill slugs. Three copies of skill_node_id had
# drifted apart, and the disagreement over `-` vs `_` made 40 skills unreadable.
laruche-skills = { path = "../laruche-skills" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = "0.1"
hostname = "0.4"
urlencoding = "2"
which = "7"
scraper = "0.20"
# TLS fingerprint emulation, OPTIONAL and off by default. It pulls BoringSSL,
# which needs cmake, nasm and a C toolchain on every build machine: far too
# heavy to impose on a default build for a capability few targets need.
# See `src/transport.rs`.
wreq = { version = "6.0.0-rc.31", optional = true }
wreq-util = { version = "3.0.0-rc.14", optional = true }
pdf-extract = "0.10"
base64.workspace = true
lazy_static = "1.5.0"

[features]
default = []
# Browser-identical TLS handshake for hosts that fingerprint the connection.
# Requires cmake, nasm and a C compiler. Build once before relying on it.
tls-emulation = ["dep:wreq", "dep:wreq-util"]

[dev-dependencies]
tempfile = "3.27.0"
