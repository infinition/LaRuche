[project]
name = "laruche-voix"
version = "0.1.0"
description = "LaRuche Voice Services - STT/TTS nodes for the Miel network"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "zeroconf>=0.136",
    "torch>=2.4",
    "transformers>=4.45",
    "soundfile>=0.12",
    "numpy>=1.26",
    "edge-tts>=6.1",
    "pyttsx3>=2.90",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local neural TTS, fast on CPU. Needs the model files kokoro-v1.0.onnx +
# voices-v1.0.bin (point KOKORO_MODEL / KOKORO_VOICES at them, or place in cwd).
# Force it with TTS_BACKEND=kokoro (edge-tts wins the auto-detect otherwise).
kokoro = ["kokoro-onnx>=0.4"]

[project.scripts]
laruche-stt = "src.stt_service:main"
laruche-tts = "src.tts_service:main"
