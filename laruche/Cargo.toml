[workspace]
resolver = "2"
members = [
    "miel-protocol",
    "laruche-node",
    "laruche-client",
    "laruche-cli",
    "laruche-dashboard",
    "laruche-essaim",
    "laruche-memoire", "laruche-watchers",
    "laruche-skills", "laruche-kanban",
    "laruche-events",
    "laruche-permissions",
    "laruche-compaction",
    "laruche-butinage",
    "laruche-evals",
    "outils/icones",
    "laruche-bureau",
]
# `cargo build` a la racine ne construit pas les outils ponctuels: le generateur
# d'icones ne sert qu'a la demande, et ses dependances de rendu n'ont rien a faire
# dans la construction courante ni dans le workflow de release.
default-members = [
    "miel-protocol",
    "laruche-node",
    "laruche-client",
    "laruche-cli",
    "laruche-dashboard",
    "laruche-essaim",
    "laruche-memoire", "laruche-watchers",
    "laruche-skills", "laruche-kanban",
    "laruche-events",
    "laruche-permissions",
    "laruche-compaction",
    "laruche-butinage",
    "laruche-evals",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["LaRuche Team"]
license = "MPL-2.0"
description = "LaRuche - Networked Edge AI System with Miel Protocol"

[workspace.dependencies]
miel-protocol = { path = "miel-protocol" }
laruche-memoire = { path = "laruche-memoire" }
laruche-watchers = { path = "laruche-watchers" }
laruche-events = { path = "laruche-events" }
laruche-permissions = { path = "laruche-permissions" }
laruche-compaction = { path = "laruche-compaction" }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
thiserror = "2"
anyhow = "1"
# UUID for node identity
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# HTTP client (for Ollama)
reqwest = { version = "0.12", features = ["json", "multipart"] }
# Web framework (dashboard)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
# Zip archives (export OKF téléchargeable via le navigateur)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Crypto for auth tokens
blake3 = "1"
rand = "0.8"
base64 = "0.22"
local-ip-address = "0.6"
# Ouvre le navigateur au premier lancement. `that_detached` pour que la fermeture du
# navigateur n'entraine pas le noeud.
open = "5"
# System metrics (CPU, RAM, temperature)
sysinfo = "0.32"
axum-server = { version = "0.7", features = ["tls-rustls"] }
