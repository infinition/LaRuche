[package]
name = "laruche-evals"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Eval harness: fixed mission set replayed against the real butinage engine, with hard checks and metrics"

[dependencies]
laruche-essaim = { path = "../laruche-essaim" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
futures-util = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
