[package]
name = "laruche-node"
version.workspace = true
edition.workspace = true
description = "LaRuche Node - AI inference daemon with Miel protocol"

[[bin]]
name = "laruche-node"
path = "src/main.rs"

[dependencies]
# Les skills et plugins livres voyagent DANS le binaire: un laruche-node.exe seul,
# telecharge depuis les releases, doit arriver avec ses capacites.
include_dir = "0.7"
# Dossier de donnees standard par OS (%APPDATA%, ~/Library/Application Support,
# ~/.local/share) pour que la ruche ait le meme foyer quel que soit le lanceur.
dirs = "6"
laruche-events.workspace = true
miel-protocol.workspace = true
tokio.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
axum.workspace = true
tower-http.workspace = true
local-ip-address.workspace = true
open.workspace = true
sysinfo.workspace = true
toml = "0.8"
laruche-essaim = { path = "../laruche-essaim" }
laruche-skills = { path = "../laruche-skills" }
laruche-memoire.workspace = true
futures-util = "0.3"
which = "7"
axum-server.workspace = true
rustls = { version = "0.23", features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
crossterm = "0.28"
ratatui = "0.29"
qrcode = "0.14"
blake3.workspace = true
rand.workspace = true
sha1_smol = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64.workspace = true
laruche-watchers.workspace = true
laruche-kanban = { path = "../laruche-kanban" }
zip.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
