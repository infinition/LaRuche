[package]
name = "laruche-bureau"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LaRuche en application de bureau: la meme interface web, dans sa propre fenetre"
publish = false

# Le binaire porte le nom du produit: c'est lui qui apparait dans le gestionnaire
# des taches et dans le raccourci. C'est donc `laruche` tout court, puisque cette
# coque EST l'application: le noeud (`laruche-node`) et le terminal
# (`laruche-cli`) gardent un nom qui dit ce qu'ils sont.
[[bin]]
name = "laruche"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Lire le theme actif dans le foyer avant d'ouvrir la fenetre, pour que l'ecran
# d'attente s'affiche deja aux couleurs de l'utilisateur. Tauri l'embarque de
# toute facon: la dependance ne coute rien de plus a la compilation.
serde_json = { workspace = true }
# Decouverte mDNS seule: MielListener ecoute sans annoncer, donc une coque sans
# noeud peut lister les ruches du reseau. C'est ce qui permet un client pur - et
# c'est le meme mecanisme qu'utilisera une application mobile.
miel-protocol = { workspace = true }
# Uniquement pour faire tourner la decouverte mDNS: MielListener essaime des taches
# et exige donc un runtime. Il est cree puis rendu avant que Tauri ne demarre le sien.
tokio = { workspace = true }
