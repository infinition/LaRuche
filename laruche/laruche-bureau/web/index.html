<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LaRuche</title>
<!-- L'ecran d'attente, et rien de plus.
     La fenetre s'ouvre ICI, immediatement, puis part sur le noeud des qu'il
     repond. Avant, la fenetre n'etait construite qu'une fois le noeud debout:
     un double clic suivi de rien pendant une minute sur un demarrage a froid,
     avec pour seul signe de vie la console du noeud, celle-la meme qu'on vient
     de faire taire. Cette page ne duplique aucune interface: la SPA reste servie
     par le noeud, on ne fait qu'occuper l'attente honnetement. -->
<script>
  /* La coque pose `window.__LARUCHE_PALETTE__` avant que cette page ne
     s'execute. On l'applique tout de suite, avant la premiere peinture: poser
     ces variables apres coup ferait voir un ecran sombre qui vire au clair. */
  (function () {
    var p = window.__LARUCHE_PALETTE__;
    if (!p) return;
    var r = document.documentElement;
    if (p.fond) r.style.setProperty('--att-fond', p.fond);
    if (p.texte) r.style.setProperty('--att-texte', p.texte);
    if (p.accent) r.style.setProperty('--att-accent', p.accent);
    if (p.attenue) r.style.setProperty('--att-attenue', p.attenue);
    // Un fond clair veut des controles clairs: sans cela la barre de defilement
    // et les champs natifs restent sombres au milieu d'une page blanche.
    var h = String(p.fond || '').replace('#', '');
    if (h.length === 6) {
      var l = (parseInt(h.slice(0,2),16)*299 + parseInt(h.slice(2,4),16)*587 + parseInt(h.slice(4,6),16)*114) / 1000;
      r.style.setProperty('color-scheme', l > 140 ? 'light' : 'dark');
    }
  })();
</script>
<style>
  /* Les quatre couleurs viennent de la coque, qui a lu le theme actif dans le
     foyer avant d'ouvrir la fenetre. Les valeurs ecrites ici restent le repli:
     lancee sans coque, cette page doit s'afficher quand meme. */
  :root {
    color-scheme: dark;
    --att-fond: #0f0f10; --att-texte: #e8e8ea;
    --att-accent: #f5a623; --att-attenue: #8b8b92;
  }
  html, body {
    height: 100%; margin: 0;
    background: var(--att-fond); color: var(--att-texte);
    font: 14px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    box-sizing: border-box;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  /* Transpose de `.honeycomb-loader.hc-lg` de l'application: meme geometrie,
     meme cadence, meme decalage d'un cinquieme de seconde entre les alveoles.
     La coque ne partage pas la feuille de style du noeud, cette page etant servie
     avant lui: la douzaine de lignes est le prix d'une marque identique des la
     premiere seconde. */
  .ruche { position: relative; width: 80px; height: 80px; }
  .alv {
    position: absolute; width: 20px; height: 23px;
    background: var(--att-accent);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: pulse-alv 1.5s infinite ease-in-out;
  }
  .a1 { top: 8px;  left: 30px; animation-delay: 0s;   }
  .a2 { top: 21px; left: 10px; animation-delay: .2s;  }
  .a3 { top: 21px; left: 50px; animation-delay: .4s;  }
  .a4 { top: 34px; left: 30px; animation-delay: .6s;  }
  .a5 { top: 47px; left: 10px; animation-delay: .8s;  }
  .a6 { top: 47px; left: 50px; animation-delay: 1s;   }
  .a7 { top: 60px; left: 30px; animation-delay: 1.2s; }
  @keyframes pulse-alv {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50%      { opacity: 1;  transform: scale(1.1); }
  }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  p  { margin: 0; font-size: 13px; color: var(--att-attenue); max-width: 34ch; }
  .barre { width: 190px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .barre i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #f5a623; animation: va 1.5s ease-in-out infinite; }
  @keyframes va { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
  /* Une animation qui pulse n'est pas negociable pour tout le monde. */
  @media (prefers-reduced-motion: reduce) {
    .ruche, .barre i { animation: none; }
    .barre i { width: 100%; opacity: .5; }
  }
</style>
<body>
  <!-- La MEME ruche que celle de la barre du haut, sept alveoles qui pulsent a
       tour de role. Un hexagone fige disait « ca charge » sans rien montrer, et
       surtout ce n'etait pas la marque: on la decouvrait une seconde plus tard,
       differente, une fois l'application ouverte. -->
  <div class="ruche" aria-hidden="true">
    <i class="alv a1"></i><i class="alv a2"></i><i class="alv a3"></i><i class="alv a4"></i>
    <i class="alv a5"></i><i class="alv a6"></i><i class="alv a7"></i>
  </div>
  <h1 id="titre">Démarrage de LaRuche…</h1>
  <p id="detail">La ruche ouvre sa mémoire et sonde le réseau. Quelques secondes.</p>
  <div class="barre"><i></i></div>

  <script>
    // Au-dela d'un certain temps, dire ce qui se passe vaut mieux que continuer a
    // faire tourner une barre. Le demarrage a froid depasse rarement 20 secondes;
    // s'il traine, c'est presque toujours l'indexation initiale de la memoire.
    // Les phrases suivent la langue reglee dans l'interface. La table est injectee
    // par l'application avant que cette page ne s'execute, donc le premier rendu est
    // deja dans la bonne langue: rien ne clignote d'une langue a l'autre.
    var TX = window.__LARUCHE_TEXTES__ || {};
    if (TX.titre) document.getElementById('titre').textContent = TX.titre;
    if (TX.detail) document.getElementById('detail').textContent = TX.detail;

    setTimeout(function () {
      var d = document.getElementById('detail');
      if (d && TX.lent) d.textContent = TX.lent;
    }, 20000);
  </script>
</body>
