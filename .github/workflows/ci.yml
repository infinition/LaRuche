name: CI
on: [push, pull_request]

# The Cargo workspace lives in laruche/, not at the repository root.
defaults:
  run:
    working-directory: laruche

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # laruche-bureau (Tauri) fait partie du workspace, et `--all` l'inclut:
      # sans la webview et GTK, glib-sys echoue a la compilation sur Linux.
      # L'outil ordinateur (xcap, enigo) demande aussi X11, DBus et PipeWire.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev clang
      - run: cargo build --release
      - run: cargo test --all

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev clang
      - run: cargo clippy --all -- -D warnings
