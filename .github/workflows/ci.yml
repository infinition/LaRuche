name: CI
on: [push, pull_request]

# The Cargo workspace lives in laruche/, not at the repository root.
defaults:
  run:
    working-directory: laruche

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # laruche-bureau (Tauri) fait partie du workspace, et `--all` l'inclut:
      # sans la webview et GTK, glib-sys echoue a la compilation sur Linux.
      # Installer les paquets plutot qu'exclure le crate: la coque contient de la
      # vraie logique (decouverte mDNS, resolution de l'adresse) qui merite d'etre
      # compilee a chaque poussee.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # Le `computer` tool (feature gui-control, active par defaut) synthetise
      # des entrees et capture les ecrans: sur Linux cela demande X11 et xdo.
      # Sans ces paquets, `cargo build` echoue sur enigo et xcap.
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev
      - run: cargo build --release
      - run: cargo test --all

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev
      - run: cargo clippy --all -- -D warnings
