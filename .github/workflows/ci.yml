name: CI
on: [push, pull_request]

# The Cargo workspace lives in laruche/, not at the repository root.
defaults:
  run:
    working-directory: laruche

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --all

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laruche
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all -- -D warnings
