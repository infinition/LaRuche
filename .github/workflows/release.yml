name: Release

# Publishes cross-platform binaries whenever a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
# Asset names are version-free on purpose: the showcase site links to
# https://github.com/infinition/LaRuche/releases/latest/download/<asset>
# which must keep working across releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            archive: tar.gz

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # reqwest builds against the system OpenSSL; laruche-bureau contre la webview.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p laruche-node -p laruche-cli -p laruche-bureau

      # Les TROIS binaires: le noeud (serveur + interface web), le CLI/TUI, et la coque
      # de bureau. Elle manquait: quelqu'un qui telechargeait l'archive obtenait la
      # ruche et le terminal, mais pas la fenetre - alors que c'est le seul des trois
      # qu'on lance en double-cliquant.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="laruche-${{ matrix.label }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/laruche-node" "$staging/"
          cp "target/${{ matrix.target }}/release/laruche" "$staging/"
          cp "target/${{ matrix.target }}/release/laruche-bureau" "$staging/"
          cp ../README.md ../LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "laruche-${{ matrix.label }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/laruche-node.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/laruche.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/laruche-bureau.exe" $staging
          Copy-Item ../README.md, ../LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-${{ matrix.label }}
          path: laruche/laruche-${{ matrix.label }}.*
          if-no-files-found: error

  # Application de bureau: la meme interface web dans sa propre fenetre.
  # macOS est volontairement absent - sans certificat Apple (99 $/an) Gatekeeper
  # bloque le .dmg, et livrer un installeur qui refuse de s'ouvrir est pire que
  # ne pas le livrer. Windows et Linux n'ont pas cette contrainte.
  bureau:
    name: bureau-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            noeud: laruche-node.exe
          - os: ubuntu-latest
            label: linux-x86_64
            noeud: laruche-node

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # webkit2gtk est la webview de Tauri sous Linux; libssl pour reqwest.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # Le noeud est embarque dans l'installeur (bundle.resources -> bin/), sinon
      # la fenetre s'ouvrirait sur une machine neuve avec rien a afficher.
      - name: Build node
        run: cargo build --release -p laruche-node

      - name: Stage node for bundling
        shell: bash
        run: cp "target/release/${{ matrix.noeud }}" laruche-bureau/bin/

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Deux variantes. Complete: le noeud voyage dedans, elle marche seule sur une
      # machine neuve. Client: 2 Mo, aucun noeud, elle cherche les ruches du reseau
      # en mDNS et laisse choisir - pour une machine qui n'a pas vocation a heberger.
      - name: Bundle desktop app (complete)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build

      - name: Bundle desktop app (client)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build --config tauri.client.conf.json

      # Mise a plat AVANT le televersement. Avec plusieurs chemins, upload-artifact
      # conserve l'arborescence sous leur plus petit ancetre commun: les installeurs
      # arrivaient donc dans dist/nsis/, dist/msi/... et le `files: dist/*` du job
      # release n'y voyait que des dossiers, qu'il ignore. Quatre installeurs
      # construits, zero attache a la release.
      #
      # Les noms sont aussi normalises: Tauri produit « LaRuche Client_0.2.0_x64-setup.exe »,
      # avec une espace et un numero de version. Or les assets sont sans version par
      # convention ici, pour que les liens /releases/latest/download/<nom> continuent
      # de marcher d'une version a l'autre.
      - name: Stage installers
        shell: bash
        run: |
          set -eu
          mkdir -p dist-bureau
          # Le job a `working-directory: laruche`, donc les chemins des etapes `run`
          # sont relatifs a laruche/ - contrairement a ceux d'upload-artifact, qui
          # partent de la racine du depot. Les deux se ressemblent et ne sont pas les
          # memes: prefixer par laruche/ ici visait laruche/laruche/, et rien ne
          # correspondait.
          B=target/release/bundle
          copier() {  # $1 = motif, $2 = nom de sortie
            f=$(ls $1 2>/dev/null | head -1) || true
            if [ -n "${f:-}" ]; then
              cp "$f" "dist-bureau/$2"
              echo "  $2  <-  $(basename "$f")"
            fi
          }
          L='${{ matrix.label }}'
          # « Client » dans le nom distingue la variante sans noeud de la complete.
          copier "$B/nsis/LaRuche_*-setup.exe"          "laruche-bureau-$L-setup.exe"
          copier "$B/nsis/LaRuche?Client_*-setup.exe"   "laruche-client-$L-setup.exe"
          copier "$B/msi/LaRuche_*.msi"                 "laruche-bureau-$L.msi"
          copier "$B/msi/LaRuche?Client_*.msi"          "laruche-client-$L.msi"
          copier "$B/appimage/LaRuche_*.AppImage"       "laruche-bureau-$L.AppImage"
          copier "$B/appimage/LaRuche?Client_*.AppImage" "laruche-client-$L.AppImage"
          copier "$B/deb/LaRuche_*.deb"                 "laruche-bureau-$L.deb"
          copier "$B/deb/LaRuche?Client_*.deb"          "laruche-client-$L.deb"
          echo "--- a televerser ---"
          ls -lh dist-bureau
          # Un dossier vide voudrait dire que les motifs ne correspondent plus a ce que
          # Tauri produit: on echoue ici plutot que de publier une release amputee.
          [ -n "$(ls -A dist-bureau)" ] || { echo "aucun installeur trouve"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-bureau-${{ matrix.label }}
          # Depuis la racine du depot: upload-artifact ignore le
          # working-directory des etapes `run`.
          path: laruche/dist-bureau/*
          if-no-files-found: error

  release:
    needs: [build, bureau]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: |
          ls -lhR dist
          # Filet: on compte les fichiers attendus AVANT de creer la release. Un job
          # amont qui reussit sans rien produire d'utile est deja arrive, et la release
          # etait sortie avec quatre assets sur huit sans que rien ne le signale.
          n=$(find dist -type f | wc -l)
          echo "fichiers a attacher: $n"
          [ "$n" -ge 8 ] || { echo "trop peu d'assets: attendu au moins 8"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          # `dist/**/*` et non `dist/*`: un asset depose dans un sous-dossier par un
          # job amont serait sinon ignore en silence.
          files: dist/**/*
          draft: true
          generate_release_notes: true
