name: Release

# Publishes cross-platform binaries whenever a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
# Asset names are version-free on purpose: the showcase site links to
# https://github.com/infinition/LaRuche/releases/latest/download/<asset>
# which must keep working across releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            archive: tar.gz

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # reqwest builds against the system OpenSSL; laruche-bureau contre la webview.
      # L'outil ordinateur (xcap, enigo) demande aussi X11, DBus et PipeWire.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev clang

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p laruche-node -p laruche-cli -p laruche-bureau

      # Les TROIS binaires: le noeud (serveur + interface web), le CLI/TUI, et la coque
      # de bureau. Elle manquait: quelqu'un qui telechargeait l'archive obtenait la
      # ruche et le terminal, mais pas la fenetre - alors que c'est le seul des trois
      # qu'on lance en double-cliquant.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="laruche-${{ matrix.label }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/laruche-node" "$staging/"
          cp "target/${{ matrix.target }}/release/laruche-cli" "$staging/"
          cp "target/${{ matrix.target }}/release/laruche" "$staging/"
          cp ../README.md ../LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "laruche-${{ matrix.label }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/laruche-node.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/laruche-cli.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/laruche.exe" $staging
          Copy-Item ../README.md, ../LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-${{ matrix.label }}
          path: laruche/laruche-${{ matrix.label }}.*
          if-no-files-found: error

  # Application de bureau: la meme interface web dans sa propre fenetre.
  # macOS est volontairement absent - sans certificat Apple (99 $/an) Gatekeeper
  # bloque le .dmg, et livrer un installeur qui refuse de s'ouvrir est pire que
  # ne pas le livrer. Windows et Linux n'ont pas cette contrainte.
  bureau:
    name: bureau-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            noeud: laruche-node.exe
          - os: ubuntu-latest
            label: linux-x86_64
            noeud: laruche-node

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # webkit2gtk est la webview de Tauri sous Linux; libssl pour reqwest.
      # L'outil ordinateur (xcap, enigo) demande aussi X11, DBus et PipeWire.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev clang

      # Le noeud est embarque dans l'installeur (bundle.resources -> bin/), sinon
      # la fenetre s'ouvrirait sur une machine neuve avec rien a afficher.
      - name: Build node
        run: cargo build --release -p laruche-node

      - name: Stage node for bundling
        shell: bash
        run: cp "target/release/${{ matrix.noeud }}" laruche-bureau/bin/

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Deux variantes. Complete: le noeud voyage dedans, elle marche seule sur une
      # machine neuve. Client: 2 Mo, aucun noeud, elle cherche les ruches du reseau
      # en mDNS et laisse choisir - pour une machine qui n'a pas vocation a heberger.
      - name: Bundle desktop app (complete)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build

      # Mise a l'abri IMMEDIATE, avant de construire la seconde variante: le
      # bundler AppImage nettoie `bundle/appimage/` a chaque passage, si bien que
      # le build client effacait l'AppImage complete. Les .deb et les installeurs
      # Windows survivaient, eux - d'ou une release ou il manquait exactement un
      # asset sur douze, sans que rien n'echoue.
      - name: Stage installers (complete)
        shell: bash
        run: |
          set -eu
          mkdir -p dist-bureau
          B=target/release/bundle
          L='${{ matrix.label }}'
          for m in "nsis/LaRuche_*-setup.exe:laruche-bureau-$L-setup.exe" \
                   "msi/LaRuche_*.msi:laruche-bureau-$L.msi" \
                   "appimage/LaRuche_*.AppImage:laruche-bureau-$L.AppImage" \
                   "deb/LaRuche_*.deb:laruche-bureau-$L.deb"; do
            f=$(ls $B/${m%%:*} 2>/dev/null | head -1) || true
            # `|| true` indispensable: sous Windows les motifs AppImage et deb ne
            # correspondent a rien, la chaine && renvoie 1, et `set -e` tuerait
            # l'etape alors que les deux installeurs Windows sont bien la.
            { [ -n "${f:-}" ] && cp "$f" "dist-bureau/${m##*:}" && echo "  ${m##*:}  <-  $(basename "$f")"; } || true
          done
          ls -lh dist-bureau

      - name: Bundle desktop app (client)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build --config tauri.client.conf.json

      # Mise a plat AVANT le televersement. Avec plusieurs chemins, upload-artifact
      # conserve l'arborescence sous leur plus petit ancetre commun: les installeurs
      # arrivaient donc dans dist/nsis/, dist/msi/... et le `files: dist/*` du job
      # release n'y voyait que des dossiers, qu'il ignore. Quatre installeurs
      # construits, zero attache a la release.
      #
      # Les noms sont aussi normalises: Tauri produit « LaRuche Client_0.2.0_x64-setup.exe »,
      # avec une espace et un numero de version. Or les assets sont sans version par
      # convention ici, pour que les liens /releases/latest/download/<nom> continuent
      # de marcher d'une version a l'autre.
      # Le job a `working-directory: laruche`, donc les chemins des etapes `run` sont
      # relatifs a laruche/ - contrairement a ceux d'upload-artifact, qui partent de la
      # racine du depot. Les deux se ressemblent et ne sont pas les memes.
      #
      # Les noms sont normalises: Tauri produit « LaRuche Client_0.2.0_x64-setup.exe »,
      # avec une espace et un numero de version. Or les assets sont sans version par
      # convention ici, pour que les liens /releases/latest/download/<nom> continuent
      # de marcher d'une version a l'autre. Le `?` du motif attrape cette espace.
      - name: Stage installers (client)
        shell: bash
        run: |
          set -eu
          mkdir -p dist-bureau
          B=target/release/bundle
          copier() {  # $1 = motif, $2 = nom de sortie
            f=$(ls $1 2>/dev/null | head -1) || true
            if [ -n "${f:-}" ]; then
              cp "$f" "dist-bureau/$2"
              echo "  $2  <-  $(basename "$f")"
            fi
          }
          L='${{ matrix.label }}'
          copier "$B/nsis/LaRuche?Client_*-setup.exe"   "laruche-client-$L-setup.exe"
          copier "$B/msi/LaRuche?Client_*.msi"          "laruche-client-$L.msi"
          copier "$B/appimage/LaRuche?Client_*.AppImage" "laruche-client-$L.AppImage"
          copier "$B/deb/LaRuche?Client_*.deb"          "laruche-client-$L.deb"
          echo "--- a televerser ---"
          ls -lh dist-bureau
          # QUATRE fichiers attendus par plateforme: deux formats x deux variantes.
          # Windows: nsis + msi. Linux: AppImage + deb. Un simple test « non vide »
          # avait laisse passer une release ou il manquait exactement une AppImage
          # sur douze assets, sans que rien n'echoue.
          n=$(ls -1 dist-bureau | wc -l)
          echo "installeurs prets: $n"
          [ "$n" -eq 4 ] || { echo "attendu 4 installeurs, obtenu $n"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-bureau-${{ matrix.label }}
          # Depuis la racine du depot: upload-artifact ignore le
          # working-directory des etapes `run`.
          path: laruche/dist-bureau/*
          if-no-files-found: error

  # L'extension Chrome, en archive a charger soi-meme.
  #
  # Pas de .crx: depuis Chrome 33, un paquet signe glisse dans chrome://extensions
  # est refuse sur Windows et macOS, seul le Web Store installe. Livrer un .crx
  # reviendrait a livrer un fichier que personne ne peut ouvrir, et obligerait a
  # publier la cle de signature, avec laquelle n'importe qui pourrait forger une
  # mise a jour. L'archive non empaquetee, elle, se charge partout en mode
  # developpeur, et c'est de toute facon le mode d'installation qui convient a une
  # extension inutile sans un noeud LaRuche sur la meme machine.
  extension:
    name: extension-chrome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Package the extension
        run: |
          # Le manifeste porte deja la version; l'archive n'en a pas besoin dans
          # son nom, et ne doit surtout pas en avoir: le site pointe sur
          # releases/latest/download/<asset>, un lien qui casse des que le nom
          # bouge d'une release a l'autre.
          test -f extension-chrome/manifest.json
          mkdir -p paquet
          cp -r extension-chrome paquet/laruche-extension-chrome
          # DEUX paquets, parce que le champ `key` est exige d'un cote et interdit de
          # l'autre, et qu'un seul fichier ne peut pas satisfaire les deux.
          #
          #   - celui qu'on TELECHARGE garde `key`. Il sert au chargement manuel, et
          #     sans ce champ l'identifiant de l'extension derive du chemin du dossier
          #     sur le disque: il differe donc d'une machine a l'autre, et la socket de
          #     pilotage du noeud, qui n'admet que des identifiants connus, la refuse.
          #     C'est le cas courant aujourd'hui, celui qu'il ne faut pas casser.
          #   - celui qu'on SOUMET au Chrome Web Store en est debarrasse: le Store
          #     refuse l'envoi avec "Le champ key n'est pas autorise dans le fichier
          #     manifeste", et c'est lui qui attribue l'identifiant.
          cd paquet && zip -qr ../laruche-extension-chrome.zip laruche-extension-chrome && cd ..
          jq -e '.key' paquet/laruche-extension-chrome/manifest.json > /dev/null             || { echo "le paquet de chargement manuel a perdu sa key"; exit 1; }

          jq 'del(.key)' extension-chrome/manifest.json > paquet/laruche-extension-chrome/manifest.json
          jq -e '.key' paquet/laruche-extension-chrome/manifest.json > /dev/null             && { echo "key toujours presente dans le paquet du Store"; exit 1; } || true
          cd paquet && zip -qr ../laruche-extension-chrome-store.zip laruche-extension-chrome && cd ..
          unzip -l laruche-extension-chrome.zip | tail -3
          unzip -l laruche-extension-chrome-store.zip | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-extension-chrome
          path: |
            laruche-extension-chrome.zip
            laruche-extension-chrome-store.zip
          if-no-files-found: error

  release:
    needs: [build, bureau, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: |
          ls -lhR dist
          # Filet: on compte les fichiers attendus AVANT de creer la release. Un job
          # amont qui reussit sans rien produire d'utile est deja arrive, et la release
          # etait sortie avec quatre assets sur huit sans que rien ne le signale.
          n=$(find dist -type f | wc -l)
          echo "fichiers a attacher: $n"
          [ "$n" -ge 13 ] || { echo "trop peu d'assets: attendu au moins 13"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          # `dist/**/*` et non `dist/*`: un asset depose dans un sous-dossier par un
          # job amont serait sinon ignore en silence.
          files: dist/**/*
          # Publiee directement, plus en brouillon: le brouillon obligeait a venir
          # cliquer Publish a la main apres chaque tag, sans que rien ne le dise, et
          # une release invisible ressemble a une release ratee. Le comptage d'assets
          # juste au-dessus est le garde-fou: une construction incomplete s'arrete la
          # et ne devient jamais une release.
          draft: false
          generate_release_notes: true
