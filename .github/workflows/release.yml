name: Release

# Publishes cross-platform binaries whenever a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
# Asset names are version-free on purpose: the showcase site links to
# https://github.com/infinition/LaRuche/releases/latest/download/<asset>
# which must keep working across releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            archive: tar.gz

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # reqwest builds against the system OpenSSL on Linux.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p laruche-node -p laruche-cli

      # Ships both binaries: the node (server + web UI) and the CLI/TUI.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="laruche-${{ matrix.label }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/laruche-node" "$staging/"
          cp "target/${{ matrix.target }}/release/laruche" "$staging/"
          cp ../README.md ../LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "laruche-${{ matrix.label }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/laruche-node.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/laruche.exe" $staging
          Copy-Item ../README.md, ../LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-${{ matrix.label }}
          path: laruche/laruche-${{ matrix.label }}.*
          if-no-files-found: error

  # Application de bureau: la meme interface web dans sa propre fenetre.
  # macOS est volontairement absent - sans certificat Apple (99 $/an) Gatekeeper
  # bloque le .dmg, et livrer un installeur qui refuse de s'ouvrir est pire que
  # ne pas le livrer. Windows et Linux n'ont pas cette contrainte.
  bureau:
    name: bureau-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            noeud: laruche-node.exe
          - os: ubuntu-latest
            label: linux-x86_64
            noeud: laruche-node

    defaults:
      run:
        working-directory: laruche

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: laruche

      # webkit2gtk est la webview de Tauri sous Linux; libssl pour reqwest.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # Le noeud est embarque dans l'installeur (bundle.resources -> bin/), sinon
      # la fenetre s'ouvrirait sur une machine neuve avec rien a afficher.
      - name: Build node
        run: cargo build --release -p laruche-node

      - name: Stage node for bundling
        shell: bash
        run: cp "target/release/${{ matrix.noeud }}" laruche-bureau/bin/

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Deux variantes. Complete: le noeud voyage dedans, elle marche seule sur une
      # machine neuve. Client: 2 Mo, aucun noeud, elle cherche les ruches du reseau
      # en mDNS et laisse choisir - pour une machine qui n'a pas vocation a heberger.
      - name: Bundle desktop app (complete)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build

      - name: Bundle desktop app (client)
        working-directory: laruche/laruche-bureau
        run: cargo tauri build --config tauri.client.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: laruche-bureau-${{ matrix.label }}
          path: |
            laruche/target/release/bundle/nsis/*.exe
            laruche/target/release/bundle/msi/*.msi
            laruche/target/release/bundle/appimage/*.AppImage
            laruche/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: [build, bureau]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
